<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B · Routines get their own home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0e1117; --panel:#141923; --raised:#1c2230; --rule:#232a38; --rule-strong:#323b4e;
  --ink:#e4e7ef; --ink-strong:#fff; --muted:#8b93a7; --faint:#5d6579;
  --calm:#55607f; --near:#5b8def; --soon:#e8b33c; --critical:#ff4d6a;
  --fill:#c9cedb;
  --chrome-bg:#e9e4d4; --chrome-ink:#2a2a2a;
}
:root[data-theme="light"]{
  --ground:#eef0f5; --panel:#ffffff; --raised:#e2e6ef; --rule:#d3d8e3; --rule-strong:#b9c0cf;
  --ink:#151824; --ink-strong:#000; --muted:#525a70; --faint:#757d92;
  --calm:#8a92a8; --near:#2b62c6; --soon:#8a6008; --critical:#c81e3c; --fill:#3a4152;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:400 14px/1.5 Barlow,system-ui,sans-serif;font-variant-numeric:tabular-nums;padding-top:40px;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--ink);background:var(--ground);border:1px solid var(--rule-strong);border-radius:3px;padding:6px 8px}
:focus-visible{outline:2px solid var(--near);outline-offset:2px}
.cond{font-family:"Barlow Condensed",Barlow,sans-serif}

/* ---------- prototype chrome ---------- */
#chrome{position:fixed;inset:0 0 auto 0;height:40px;z-index:50;background:var(--chrome-bg);color:var(--chrome-ink);display:flex;align-items:center;gap:6px;padding:0 12px;font:500 12px/1 system-ui,sans-serif;border-bottom:2px dashed #b9b29a;overflow-x:auto;white-space:nowrap}
#chrome b{font-weight:700;margin-right:8px}
#chrome button{padding:5px 8px;border-radius:3px;border:1px solid #c4bda4;background:#f6f2e6}
#chrome button[aria-pressed="true"]{background:#2a2a2a;color:#f6f2e6;border-color:#2a2a2a}
#chrome .sp{flex:1}

/* ---------- app shell ---------- */
.shell{max-width:1320px;margin:0 auto;border-inline:1px solid var(--rule);min-height:calc(100vh - 40px)}
header.top{display:flex;align-items:flex-end;gap:28px;padding:18px 24px 0;border-bottom:1px solid var(--rule)}
.mark{font:700 20px/1 "Barlow Condensed";letter-spacing:.04em;padding-bottom:14px}
.mark span{color:var(--near)}
nav.tabs{display:flex;gap:2px;flex:1}
nav.tabs button{padding:10px 14px 12px;font:600 15px/1 "Barlow Condensed";letter-spacing:.03em;color:var(--faint);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:baseline}
nav.tabs button:hover{color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--ink);border-color:var(--ink)}
nav.tabs .n{font:500 12px Barlow;color:var(--faint)}
nav.tabs .gear{margin-left:auto}
nav.tabs svg{width:15px;height:15px;align-self:center}

/* ---------- events screen ---------- */
.ev{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 100px)}
.rail{border-right:1px solid var(--rule)}
.head{padding:22px 24px 20px;border-bottom:1px solid var(--rule)}
.legend{font-size:12px;color:var(--faint);margin:0 0 6px}
.head h2{font:600 30px/1.05 "Barlow Condensed";margin:0 0 6px;letter-spacing:.005em}
.head .game{font-weight:500;font-size:14px}
.big{font:700 64px/1 "Barlow Condensed";letter-spacing:-.01em;margin:16px 0 4px}
.big small{font-size:18px;font-weight:600;color:var(--muted);margin-left:6px;letter-spacing:0}
.exact{font-size:12px;color:var(--faint);margin-bottom:12px}
.meter{display:flex;gap:2px;height:9px}
.meter i{flex:1;background:var(--rule);border-radius:1px}
.meter i.on{background:var(--h)}
.meter.unknown{background:repeating-linear-gradient(135deg,var(--rule) 0 3px,transparent 3px 6px);}
.meter.unknown i{background:transparent}
.then{list-style:none;margin:16px 0 0;padding:12px 0 0;border-top:1px solid var(--rule)}
.then li{display:flex;gap:8px;align-items:baseline;font-size:13px;padding:3px 0;color:var(--muted)}
.then .dot{width:7px;height:7px;border-radius:50%;background:var(--g);flex:none;transform:translateY(-1px)}
.then .t{flex:1}
.then .r{font:600 14px "Barlow Condensed"}

.rstrip{display:block;width:100%;text-align:left;padding:18px 24px;border-bottom:1px solid var(--rule)}
.rstrip:hover{background:var(--panel)}
.rstrip .row1{display:flex;justify-content:space-between;align-items:baseline}
.rstrip .lbl{font:600 16px "Barlow Condensed";letter-spacing:.02em}
.rstrip .go{font-size:12px;color:var(--near)}
.rstrip .nums{display:flex;gap:18px;margin-top:8px}
.rstrip .nums div{font-size:12px;color:var(--faint)}
.rstrip .nums b{display:block;font:600 22px/1.1 "Barlow Condensed";color:var(--ink)}
.rstrip .nums b.due{color:var(--soon)}
.rstrip.empty .lbl{color:var(--muted)}
.rstrip p{margin:6px 0 0;font-size:13px;color:var(--muted)}

.mine{padding:18px 24px}
.mine h3{font:600 16px "Barlow Condensed";letter-spacing:.02em;margin:0 0 8px;display:flex;justify-content:space-between}
.mine h3 button{font:500 12px Barlow;color:var(--near)}
.mine p{font-size:13px;color:var(--muted);margin:0}

.main{min-width:0}
.notice{margin:0;padding:14px 24px;border-bottom:1px solid var(--rule);background:color-mix(in srgb,var(--near) 9%,transparent);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.notice p{margin:0;flex:1;min-width:220px}
.notice strong{font-weight:600}
.btn{padding:7px 12px;border:1px solid var(--rule-strong);border-radius:3px;font-weight:500;font-size:13px;color:var(--muted)}
.btn:hover{color:var(--ink);border-color:var(--muted)}
.btn.solid{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn.solid:hover{background:var(--ink-strong)}
.btn.link{border:0;padding:7px 4px;color:var(--near)}

.ledger-h{display:flex;justify-content:space-between;align-items:baseline;padding:20px 24px 10px;gap:12px;flex-wrap:wrap}
.ledger-h h2{font:600 22px "Barlow Condensed";margin:0;letter-spacing:.02em}
.ledger-h .sub{font-size:12px;color:var(--faint)}
.seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:3px}
.seg button{padding:5px 10px;font-size:12px;color:var(--faint)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink)}
table.led{width:100%;border-collapse:collapse}
table.led th{font:500 12px Barlow;color:var(--faint);text-align:left;padding:6px 12px;border-bottom:1px solid var(--rule-strong);white-space:nowrap}
table.led td{padding:12px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.led th:first-child,table.led td:first-child{padding-left:24px}
table.led th:last-child,table.led td:last-child{padding-right:24px}
table.led tbody tr{cursor:pointer}
table.led tbody tr:hover{background:var(--panel)}
.gcell{display:flex;align-items:center;gap:10px;white-space:nowrap;font-weight:600;font-size:13px;color:var(--g)}
.gcell::before{content:"";width:3px;height:26px;border-radius:2px;background:var(--g)}
.tcell{font-weight:500;font-size:15px}
.tcell .tag{font-size:11px;color:var(--faint);border:1px solid var(--rule-strong);border-radius:2px;padding:0 5px;margin-left:8px;font-weight:500;vertical-align:2px}
.tcell .tag.own{color:var(--g);border-color:color-mix(in srgb,var(--g) 45%,transparent)}
.mcell{width:34%}
.cd{font:600 20px "Barlow Condensed";text-align:right;white-space:nowrap}
.cd.calm{color:var(--calm)}.cd.near{color:var(--near)}.cd.soon{color:var(--soon)}.cd.critical{color:var(--critical)}.cd.unk{color:var(--faint);font-size:14px}
tr.done{opacity:.4}
tr.done .tcell{text-decoration:line-through}
.more{padding:12px 24px;font-size:13px;color:var(--muted)}

/* ---------- routines board ---------- */
.rt-top{display:flex;align-items:flex-end;gap:16px;padding:22px 24px 16px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.rt-top h1{font:700 34px/1 "Barlow Condensed";margin:0;letter-spacing:.01em}
.rt-top .sum{font-size:13px;color:var(--muted);flex:1;min-width:200px}
.band{border-bottom:1px solid var(--rule)}
.band-h{display:grid;grid-template-columns:1fr auto;align-items:end;padding:22px 24px 10px;gap:12px;border-bottom:1px solid var(--rule-strong)}
.band-h h2{font:700 26px/1 "Barlow Condensed";margin:0;letter-spacing:.02em}
.band-h .meta{font-size:12px;color:var(--faint);margin-top:4px}
.band-h .reset{text-align:right}
.band-h .reset .k{font-size:12px;color:var(--faint)}
.band-h .reset .v{font:700 34px/1 "Barlow Condensed"}
table.rt{width:100%;border-collapse:collapse;table-layout:fixed}
table.rt td:nth-child(4){width:150px;text-align:right}
table.rt td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.rt td:first-child{padding-left:24px;width:150px}
table.rt td:last-child{padding-right:24px;text-align:right;width:44px}
table.rt tr:last-child td{border-bottom:0}
.rtitle{font-weight:500;font-size:15px}
.rtitle .src{display:block;font-size:12px;color:var(--faint);font-weight:400}
.prog{width:34%}
.amt{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.amt .bar{flex:1;height:6px;background:var(--rule);position:relative;border-radius:1px;overflow:hidden}
.amt .bar i{position:absolute;inset:0 auto 0 0;background:var(--fill)}
.amt .bar.full i{background:var(--g)}
.amt .num{font:600 15px "Barlow Condensed";min-width:120px;text-align:right;color:var(--muted)}
.amt .num b{color:var(--ink);font-weight:600}
.amt input{width:90px;padding:3px 6px}
.tick{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.tick .box{width:18px;height:18px;border:1px solid var(--rule-strong);border-radius:3px;display:grid;place-items:center}
.tick[aria-pressed="true"]{color:var(--ink)}
.tick[aria-pressed="true"] .box{background:var(--g);border-color:var(--g)}
.tick svg{width:12px;height:12px;stroke:var(--ground);stroke-width:3;fill:none;opacity:0}
.tick[aria-pressed="true"] svg{opacity:1}
.cyc{font:600 14px "Barlow Condensed";color:var(--muted);white-space:nowrap}
.kebab{width:28px;height:28px;border-radius:3px;display:inline-grid;place-items:center;color:var(--faint);position:relative}
.kebab:hover{background:var(--raised);color:var(--ink)}
.menu{position:absolute;right:0;top:30px;z-index:20;background:var(--panel);border:1px solid var(--rule-strong);border-radius:4px;min-width:180px;text-align:left;padding:4px;box-shadow:0 8px 24px rgb(0 0 0 / .35)}
.menu button{display:block;width:100%;text-align:left;padding:7px 10px;font-size:13px;color:var(--muted);border-radius:3px}
.menu button:hover{background:var(--raised);color:var(--ink)}
.menu button.danger:hover{color:var(--critical)}
tr.met .rtitle{color:var(--muted)}
.empty-band{padding:14px 24px;font-size:13px;color:var(--faint)}
.empty-state{padding:72px 24px;max-width:560px}
.empty-state h2{font:700 30px/1.1 "Barlow Condensed";margin:0 0 10px}
.empty-state p{color:var(--muted);margin:0 0 20px;max-width:46ch}

/* ---------- library drawer ---------- */
.scrim{position:fixed;inset:40px 0 0 0;background:rgb(8 10 14 / .6);z-index:30}
:root[data-theme="light"] .scrim{background:rgb(26 31 48 / .35)}
.drawer{position:fixed;top:40px;right:0;bottom:0;width:min(560px,100vw);background:var(--panel);border-left:1px solid var(--rule-strong);z-index:31;display:flex;flex-direction:column}
.drawer-h{padding:20px 24px 14px;border-bottom:1px solid var(--rule)}
.drawer-h .r1{display:flex;justify-content:space-between;align-items:center}
.drawer-h h2{font:700 28px/1 "Barlow Condensed";margin:0}
.drawer-h p{margin:6px 0 12px;font-size:13px;color:var(--muted)}
.drawer-h input{width:100%}
.close{width:32px;height:32px;display:grid;place-items:center;border-radius:3px;color:var(--muted)}
.close:hover{background:var(--raised);color:var(--ink)}
.drawer-b{overflow:auto;flex:1}
.lg{border-bottom:1px solid var(--rule)}
.lg-h{display:flex;align-items:center;gap:10px;padding:16px 24px 8px;flex-wrap:wrap}
.lg-h .nm{font:700 18px "Barlow Condensed";color:var(--g);letter-spacing:.02em;flex:1}
.lg-h .cnt{font-size:12px;color:var(--faint)}
.bulk{display:flex;gap:6px;padding:0 24px 10px;flex-wrap:wrap}
.bulk button{font-size:12px;color:var(--muted);border:1px solid var(--rule-strong);border-radius:2px;padding:3px 8px}
.bulk button:hover{color:var(--ink);border-color:var(--muted)}
.li{display:grid;grid-template-columns:1fr auto;gap:12px;padding:9px 24px;border-top:1px solid var(--rule);align-items:center}
.li .t{font-weight:500}
.li .d{font-size:12px;color:var(--faint)}
.fol{font-size:12px;font-weight:600;padding:5px 10px;border-radius:3px;border:1px solid var(--rule-strong);color:var(--muted);min-width:92px}
.fol:hover{color:var(--ink);border-color:var(--muted)}
.fol[aria-pressed="true"]{background:color-mix(in srgb,var(--g) 16%,transparent);border-color:color-mix(in srgb,var(--g) 60%,transparent);color:var(--ink)}
.others summary{padding:14px 24px;cursor:pointer;color:var(--muted);font-size:13px}
.create{padding:18px 24px 28px;border-top:1px solid var(--rule-strong);background:var(--ground)}
.create h3{font:700 20px "Barlow Condensed";margin:0 0 4px}
.create p{font-size:13px;color:var(--muted);margin:0 0 12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--faint)}
.form .full{grid-column:1/-1}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pills button{font-size:12px;padding:5px 9px;border:1px solid var(--rule-strong);border-radius:2px;color:var(--muted)}
.pills button[aria-pressed="true"]{border-color:var(--near);color:var(--ink);background:color-mix(in srgb,var(--near) 14%,transparent)}

/* ---------- settings ---------- */
.set{max-width:820px;padding:8px 24px 60px}
.set h1{font:700 34px/1 "Barlow Condensed";margin:22px 0 6px}
.set .intro{color:var(--muted);margin:0 0 18px;max-width:60ch}
.sec{display:grid;grid-template-columns:200px 1fr;gap:24px;padding:22px 0;border-top:1px solid var(--rule)}
.sec>*{align-self:start}
.sec .seg{justify-self:start}
.sec h2{font:700 20px "Barlow Condensed";margin:0;letter-spacing:.02em}
.sec .hint{font-size:12px;color:var(--faint);margin-top:4px}
.grow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule)}
.grow:last-child{border-bottom:0}
.grow .sw{width:10px;height:10px;border-radius:2px;background:var(--g)}
.grow .nm{flex:1}
.grow.off .nm{color:var(--faint)}
.grow .ord{width:26px;height:26px;border-radius:3px;color:var(--faint);display:grid;place-items:center}
.grow .ord:hover{background:var(--raised);color:var(--ink)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--near)}
.chk small{display:block;color:var(--faint);font-size:12px}
.pointer{font-size:13px;color:var(--muted);border-left:2px solid var(--rule-strong);padding:4px 0 4px 12px;margin-top:4px}

/* ---------- archive ---------- */
.arc-sum{display:flex;gap:32px;padding:20px 24px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.arc-sum div{font-size:12px;color:var(--faint)}
.arc-sum b{display:block;font:700 30px/1.1 "Barlow Condensed";color:var(--ink)}
.filters{display:flex;gap:12px;padding:14px 24px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--rule-strong)}
.st{font-size:12px;font-weight:500;padding:1px 6px;border-radius:2px}
.st.c{color:var(--near);background:color-mix(in srgb,var(--near) 15%,transparent)}
.st.i{color:var(--muted);border:1px solid var(--rule-strong)}

/* ---------- timeline (stub) ---------- */
.tl{padding:20px 24px}
.tl-row{display:grid;grid-template-columns:120px 1fr;align-items:center;border-bottom:1px solid var(--rule);height:40px}
.tl-row .n{font-weight:600;font-size:13px;color:var(--g)}
.tl-track{position:relative;height:100%}
.tl-bar{position:absolute;top:8px;height:24px;border-radius:3px;background:color-mix(in srgb,var(--g) 24%,var(--panel));border-left:3px solid var(--g);font-size:12px;padding:3px 8px;white-space:nowrap;overflow:hidden}
.tl-now{position:absolute;top:0;bottom:0;width:1px;background:var(--critical)}

/* ---------- onboarding ---------- */
.ob{max-width:760px;margin:0 auto;padding:40px 24px 80px}
.ob .step{font-size:12px;color:var(--faint);margin-bottom:8px}
.ob h1{font:700 44px/1.02 "Barlow Condensed";margin:0 0 10px}
.ob .lede{color:var(--muted);max-width:54ch;margin:0 0 24px}
.gpick{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule)}
.gpick button{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--rule);text-align:left;color:var(--muted)}
.gpick button:nth-child(odd){border-right:1px solid var(--rule)}
.gpick button .sw{width:12px;height:12px;border-radius:2px;border:1px solid var(--g)}
.gpick button[aria-pressed="true"]{color:var(--ink);background:color-mix(in srgb,var(--g) 9%,transparent)}
.gpick button[aria-pressed="true"] .sw{background:var(--g)}
.gpick button:hover{color:var(--ink)}
.ob-foot{display:flex;gap:12px;align-items:center;margin-top:28px;flex-wrap:wrap}
.ob-foot .cnt{color:var(--faint);font-size:13px;flex:1}
.ob-g{border-top:1px solid var(--rule-strong);margin-top:6px}
.ob-g .lg-h{padding-left:0;padding-right:0}
.ob-g .li{padding-left:0;padding-right:0}

/* ---------- detail sheet ---------- */
.sheet{position:fixed;z-index:31;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--rule-strong);border-radius:6px;padding:22px 24px}
.sheet h2{font:700 26px/1.05 "Barlow Condensed";margin:4px 0 8px}
.sheet .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}

/* ---------- why panel ---------- */
.why{position:fixed;top:40px;left:0;bottom:0;width:min(460px,100vw);z-index:40;background:#f6f2e6;color:#232323;border-right:2px dashed #b9b29a;overflow:auto;padding:22px 24px 40px;font:400 14px/1.55 system-ui,sans-serif}
.why h2{font:700 18px system-ui;margin:0 0 8px}
.why h3{font:700 14px system-ui;margin:20px 0 6px}
.why code,.why pre{font:12px/1.5 ui-monospace,Menlo,monospace;background:#ebe5d3;border-radius:3px}
.why code{padding:1px 4px}
.why pre{padding:10px;overflow:auto;white-space:pre}
.why ul{padding-left:18px;margin:6px 0}
.why .x{float:right;border:1px solid #c4bda4;border-radius:3px;padding:3px 8px;background:#fff}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--raised);border:1px solid var(--rule-strong);border-radius:4px;padding:10px 14px;z-index:45;font-size:13px;display:flex;gap:12px;box-shadow:0 8px 24px rgb(0 0 0 / .35)}

@media (max-width:860px){
  .ev{grid-template-columns:1fr}
  .rail{border-right:0}
  .mcell,table.led .h-meter{display:none}
  table.led .h-game,table.led td.gc{display:none}
  .tcell .gsm{display:block;font-size:12px;font-weight:600;color:var(--g)}
  table.rt{table-layout:auto}
  table.rt td:first-child,table.rt td:nth-child(4){display:none}
  nav.tabs button{white-space:nowrap}
  .rt-top h1{width:100%}
  table.rt td:nth-child(2){padding-left:24px}
  .rtitle .gsm{display:block;font-size:12px;font-weight:600;color:var(--g)}
  .prog{width:auto}
  .amt .bar{display:none}
  .amt .num{min-width:0}
  .sec{grid-template-columns:1fr;gap:10px}
  .gpick{grid-template-columns:1fr}
  .gpick button:nth-child(odd){border-right:0}
  header.top{gap:12px;padding:12px 16px 0;flex-wrap:wrap}
  .mark{padding-bottom:4px}
  nav.tabs{overflow-x:auto;width:100%}
  nav.tabs button{padding:10px 10px 12px}
  .big{font-size:52px}
  .band-h .reset .v{font-size:26px}
  .ob h1{font-size:34px}
}
@media (min-width:861px){ .gsm{display:none} }
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:slide .18s ease-out}

// ---------- clock ----------
const DAY=864e5, H=36e5;
const RESET_UTC_HOUR=3; // Europe server, 04:00 local
function nextDaily(){let d=new Date(NOW);d.setUTCHours(RESET_UTC_HOUR,0,0,0);if(+d<=NOW)d=new Date(+d+DAY);return +d}
function nextWeekly(){let t=nextDaily();while(new Date(t).getUTCDay()!==1)t+=DAY;return t}
function nextMonthly(startsOn=1){const n=new Date(NOW);let d=Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),startsOn,RESET_UTC_HOUR);if(d<=NOW)d=Date.UTC(n.getUTCFullYear(),n.getUTCMonth()+1,startsOn,RESET_UTC_HOUR);return d}
function nextCycle(p){const from=Date.parse(p.from+"T03:00:00Z"),len=p.days*DAY;let k=Math.floor((NOW-from)/len)+1;return from+k*len}
function resetOf(r){const p=r.period;return p.unit==="day"?nextDaily():p.unit==="week"?nextWeekly():p.unit==="month"?nextMonthly(p.startsOn||1):nextCycle(p)}
function dur(ms){if(ms<H)return Math.max(1,Math.round(ms/6e4))+"m";const d=Math.floor(ms/DAY),h=Math.floor(ms%DAY/H),m=Math.floor(ms%H/6e4);return d?`${d}d ${h}h`:`${h}h ${String(m).padStart(2,"0")}m`}
function heat(ms){return ms==null?"unk":ms<DAY?"critical":ms<3*DAY?"soon":ms<7*DAY?"near":"calm"}
const HEAT={calm:"var(--calm)",near:"var(--near)",soon:"var(--soon)",critical:"var(--critical)"};
const fmt=n=>n.toLocaleString("en-GB");
const dateStr=t=>new Date(t).toLocaleString("en-GB",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"UTC"})+" UTC";
const PERIOD_LABEL={day:"Daily",week:"Weekly",month:"Monthly",cycle:"Cycle"};
function periodWords(p){return p.unit==="day"?"Every day":p.unit==="week"?"Every Monday":p.unit==="month"?(p.startsOn&&p.startsOn!==1?`Every month on the ${p.startsOn}th`:"Every month on the 1st"):`Every ${p.days} days`}

function meter(ev,n=24){if(ev.end==null)return `<div class="meter unknown">${"<i></i>".repeat(n)}</div>`;const frac=Math.max(0,(ev.end-NOW)/(ev.end-ev.start));const lit=Math.max(1,Math.round(frac*n));const h=HEAT[heat(ev.end-NOW)];return `<div class="meter" style="--h:${h}">${Array.from({length:n},(_,i)=>`<i class="${i<lit?"on":""}"></i>`).join("")}</div>`}

function eventsScreen(){

  const live=evs.filter(e=>S.status[e.id]!=="ignored"&&(S.showCompleted||S.status[e.id]!=="done"));
  const next=live.find(e=>S.status[e.id]!=="done"&&e.end);const then=live.filter(e=>e!==next&&S.status[e.id]!=="done").slice(0,3);

  const strip=c.total?`<button class="rstrip" data-tab="routines"><div class="row1"><span class="lbl">Routines</span><span class="go">Open Routines</span></div>

    :`<button class="rstrip empty" data-tab="routines"><div class="row1"><span class="lbl">Routines</span><span class="go">Browse the library</span></div><p>Follow dailies, weeklies and endgame cycles. They live on their own tab and stay out of this list.</p></button>`;

  const notice=S.returning?`<div class="notice"><p><strong>Routines moved to their own tab.</strong> The ${c.total} you followed came with you, and nothing you ticked was lost. This list now holds events only.</p><button class="btn solid" data-act="takeme">Take me there</button><button class="btn link" data-act="dismiss">Got it</button></div>`:"";

  return `<div class="ev">${rail}<section class="main">${notice}<div class="ledger-h"><div><h2>Running now</h2><div class="sub">${live.length} events in ${S.games.length} games · sorted by what ends first</div></div><div class="seg"><button aria-pressed="true">Ending soonest</button><button aria-pressed="false">Doing first</button></div></div>
    <table class="led"><thead><tr><th class="h-game">Game</th><th>Event</th><th class="h-meter">Time left</th><th style="text-align:right">Ends in</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="more">Completed and ignored events move to the Archive tab.</div></section></div>`;
}

function routineRow(r){
  const met=isMet(r);const v=S.progress[r.id]||0;let prog;
  if(r.measure.kind==="days"){prog=`<button class="tick" data-tick="${r.id}" aria-pressed="${met}"><span class="box">${ICON.check}</span>${met?"Done":"To do"}</button>`}
  else if(S.editing===r.id){prog=`<form class="amt" data-amtform="${r.id}"><input type="number" min="0" name="v" value="${v}" autofocus aria-label="Amount"><span class="num">/ ${fmt(r.measure.target)} ${esc(r.measure.unit||"")}</span><button class="btn" type="submit">Save</button></form>`}
  else{const f=Math.min(1,v/r.measure.target);prog=`<button class="amt" data-amt="${r.id}" title="Enter an amount"><span class="bar ${f>=1?"full":""}"><i style="width:${f*100}%"></i></span><span class="num"><b>${fmt(v)}</b> / ${fmt(r.measure.target)} ${esc(r.measure.unit||"")}</span></button>`}
  const cyc=r.period.unit==="cycle"?`<span class="cyc">${dur(resetOf(r)-NOW)} left in cycle</span>`:"";
  const menu=S.menu===r.id?`<div class="menu" role="menu">${r.measure.kind==="amount"?`<button data-amt="${r.id}">Edit amount</button>`:""}<button data-act="target" data-id="${r.id}">Change target</button>${r.builtin?`<button data-act="mine" data-id="${r.id}">Make it mine</button>`:`<button data-act="editown" data-id="${r.id}">Edit</button>`}<button class="danger" data-unfollow="${r.id}">${r.own?"Delete":"Unfollow"}</button></div>`:"";
  return `<tr class="${met?"met":""}" style="${gv(r.game)}"><td><span class="gcell">${G[r.game].short}</span></td><td class="rtitle"><span class="gsm">${G[r.game].short}</span>${esc(r.title)}${r.own?'<span class="tag own" style="font-size:11px;margin-left:8px;border:1px solid;border-radius:2px;padding:0 5px">yours</span>':""}${S.group==="game"?`<span class="src">${PERIOD_LABEL[r.period.unit]} · resets in ${dur(resetOf(r)-NOW)}</span>`:""}</td><td class="prog">${prog}</td><td>${cyc}</td><td><button class="kebab" data-menu="${r.id}" aria-label="More for ${esc(r.title)}" aria-expanded="${S.menu===r.id}">${ICON.dots}${menu}</button></td></tr>`;
}
function routinesScreen(){
  const f=followedList();const c=counts();
  const top=`<div class="rt-top"><h1>Routines</h1><div class="sum">${f.length?`${c.left} of ${c.total} still to do across ${new Set(f.map(r=>r.game)).size} games. Each one rolls on its own game's reset.`:"Things that reset: dailies, weeklies, monthlies and endgame cycles."}</div>${f.length?`<div class="seg"><button data-group="horizon" aria-pressed="${S.group==="horizon"}">By reset</button><button data-group="game" aria-pressed="${S.group==="game"}">By game</button></div>`:""}<button class="btn solid" data-act="library">Browse the library</button></div>`;
  if(!f.length)return top+`<div class="empty-state"><h2>You're not following any routines yet</h2><p>Pick the dailies, weekly bosses, shop restocks and endgame modes you actually do. Nothing is on until you choose it, and your events list stays clean either way.</p><button class="btn solid" data-act="library">Browse the library</button> <button class="btn link" data-act="library-create">Create your own</button></div>`;
  const order=r=>S.games.indexOf(r.game);
  if(S.group==="game"){
    return top+S.games.filter(g=>f.some(r=>r.game===g)).map(g=>{const rs=f.filter(r=>r.game===g);const left=rs.filter(r=>!isMet(r)).length;return `<section class="band"><div class="band-h" style="${gv(g)}"><div><h2 style="color:var(--g)">${G[g].name}</h2><div class="meta">${left} of ${rs.length} to do</div></div><div class="reset"><div class="k">Daily reset</div><div class="v cond">${dur(nextDaily()-NOW)}</div></div></div><table class="rt"><tbody>${rs.sort((a,b)=>resetOf(a)-resetOf(b)).map(routineRow).join("")}</tbody></table></section>`}).join("");
  }
  const bands=[["day","Today","Daily chores"],["week","This week","Rolls every Monday"],["month","This month","Shop restocks and monthly modes"],["cycle","Cycles","Endgame modes on their own clocks"]];
  return top+bands.map(([u,name,meta])=>{const rs=f.filter(r=>r.period.unit===u).sort((a,b)=>u==="cycle"?resetOf(a)-resetOf(b):order(a)-order(b));const left=rs.filter(r=>!isMet(r)).length;
    const nxt=u==="day"?nextDaily():u==="week"?nextWeekly():u==="month"?nextMonthly():rs.length?Math.min(...rs.map(resetOf)):null;
    const left_ms=nxt?nxt-NOW:0;const bandCol=!rs.length||!left?"var(--faint)":left_ms<3*H?"var(--critical)":left_ms<DAY&&u!=="day"?"var(--soon)":"var(--ink)";
    return `<section class="band"><div class="band-h"><div><h2>${name}</h2><div class="meta">${meta} · ${rs.length?`${left} of ${rs.length} to do`:"none followed"}</div></div><div class="reset"><div class="k">${u==="cycle"?"Next cycle ends":"Resets in"}</div><div class="v cond" style="color:${bandCol}">${nxt?dur(nxt-NOW):"—"}</div></div></div>${rs.length?`<table class="rt"><tbody>${rs.map(routineRow).join("")}</tbody></table>`:`<div class="empty-band">Nothing here. <button class="btn link" data-act="library">Add from the library</button></div>`}</section>`}).join("");
}

    ${o.games.map(g=>`<section class="ob-g" style="${gv(g)}"><div class="lg-h"><span class="nm">${G[g].name}</span></div>${BUILTINS.filter(r=>r.game===g&&r.pulls!=="standard").map(r=>`<div class="li"><div><div class="t">${esc(r.title)}</div><div class="d">${periodWords(r.period)}</div></div><button class="fol" data-obpick="${r.id}" aria-pressed="${o.picks.has(r.id)}">${o.picks.has(r.id)?"Following":"Follow"}</button></div>`).join("")}</section>`).join("")}

  <div class="acts"><button class="btn solid" data-evst="${e.id}:done">${st==="done"?"Mark not done":"Mark done"}</button><button class="btn" data-evst="${e.id}:ignored">Ignore</button><button class="btn link" data-act="closesheet">Close</button></div></div>`}

function whyPanel(){return `<aside class="why"><button class="x" data-act="why">Close</button><h2>B · Routines get their own home</h2>
<p>Events and routines are different jobs. An event has an end date you're racing; a routine resets and comes back. Today both share the left rail, so a few followed weeklies crowd out the deadlines. B gives routines a tab of their own, ordered by when they reset, and makes every routine opt-in from one library. The Events list goes back to holding events only.</p>
<h3>The foundation</h3>
<p>One idea replaces about fifteen prefs: <b>a routine is anything that resets, and you follow it or you don't.</b> Daily chores, built-in weeklies, monthly shops, endgame cycles and your own tasks are all the same shape.</p>
<pre>prefs = {
  games: LaneId[]          // followed games, in order
  followed: RoutineId[]    // one subscription list
  ...region, theme, display
}
Routine = { id, game, title, period, measure,
            source: builtin | yours }</pre>
<p>It retires <code>showChores</code>, <code>choresOn/Off</code>, <code>showRoutines</code>, <code>routineGames</code>, <code>routinesOff</code>, <code>routinesAsked</code>, <code>routinesHidden</code>, <code>showWeekly/Monthly/CycleTasks</code> and <code>hiddenGames</code>/<code>knownGames</code> (now just <code>games</code>). <code>standardPulls</code> stays, as a library filter only. The board, the rail counts and the tab badge are each a pure query: <code>followed ∩ games</code>, grouped by period. Ticks keep their existing <code>routine:</code>/<code>mytask:</code> keys, so a migration only has to compute the first <code>followed</code> list from the old switches.</p>
<h3>How it scales</h3>
<ul><li>A new game adds its rows to the library and changes nothing for anyone until they follow them. Nobody's screen fills up on its own.</li>
<li>A new kind of system, like a pass window or a rotating shop, is a new period unit or band. The follow model doesn't change.</li>
<li>“Make it mine” copies a built-in into your own routines and swaps the id in <code>followed</code>.</li></ul>
<h3>Trade-offs</h3>
<ul><li>A fourth tab is one more place to look. Someone who only does dailies has to leave the events list to tick them, though the rail strip softens that.</li>
<li>Opt-in means a new reader sees nothing until they choose, so step 2 of onboarding carries a lot of weight.</li>
<li>Per-game nuance, like “all of Genshin but none of NTE”, is only expressible as a list of followed items. That's fine for the library's bulk buttons, but there's no single per-game switch to flip.</li>
<li>The ledger look is denser. It's harder to scan on a phone, where the game column collapses into the title.</li></ul></aside>`}

function render(){
  document.documentElement.dataset.theme=S.theme;
  renderChrome();
  const app=document.getElementById("app");
  if(S.ob){app.innerHTML=`<div class="shell"><header class="top" style="border:0"><div class="mark">EVENT<span>CLOCK</span></div></header>${onboarding()}</div>`}
  else{const body=S.tab==="events"?eventsScreen():S.tab==="routines"?routinesScreen():S.tab==="settings"?settingsScreen():S.tab==="archive"?archiveScreen():timelineScreen();app.innerHTML=`<div class="shell">${tabs()}${body}</div>`}
  document.getElementById("overlay").innerHTML=(S.drawer?libraryDrawer():"")+(S.sheet?sheet():"")+(S.why?whyPanel():"")+(S.toast?`<div class="toast" role="status">${S.toast}</div>`:"");
  const a=document.querySelector("[autofocus]");if(a){a.focus();a.select?.()}
}
let toastT;function toast(m){S.toast=m;clearTimeout(toastT);toastT=setTimeout(()=>{S.toast=null;render()},2600)}

// ---------- events ----------
document.addEventListener("click",ev=>{
  const t=ev.target.closest("button,[data-ev],[data-act]");if(!t)return;
  const d=t.dataset;
  if(d.jump)jump(d.jump);
  else if(d.tab){S.tab=d.tab;S.drawer=false;S.menu=null;if(S.tab!=="events")S.returning=false}
  else if(d.group)S.group=d.group;
  else if(d.tick){S.progress[d.tick]=isMet(byId(d.tick))?0:1}
  else if(d.amt){S.editing=d.amt;S.menu=null}
  else if(d.menu!==undefined&&t.classList.contains("kebab")&&!ev.target.closest(".menu")){S.menu=S.menu===d.menu?null:d.menu}
  else if(d.unfollow){const r=byId(d.unfollow);S.followed.delete(d.unfollow);if(r.own)S.own=S.own.filter(x=>x.id!==r.id);S.menu=null;toast(`${r.own?"Deleted":"Unfollowed"} ${esc(r.title)}. Find it again in the library.`)}
  else if(d.follow){S.followed.has(d.follow)?S.followed.delete(d.follow):S.followed.add(d.follow)}
  else if(d.bulk){const[g,u]=d.bulk.split(":");const rs=BUILTINS.filter(r=>r.game===g&&(u==="all"||r.period.unit===u)&&(S.standardPulls||r.pulls!=="standard"));const allOn=rs.every(r=>S.followed.has(r.id));rs.forEach(r=>allOn?S.followed.delete(r.id):S.followed.add(r.id));toast(`${allOn?"Unfollowed":"Followed"} ${rs.length} for ${G[g].short}`)}
  else if(d.fu){S.form.unit=d.fu}
  else if(d.fk){S.form.kind=d.fk}
  else if(d.ev){S.sheet=d.ev}
  else if(d.evst){const[id,st]=d.evst.split(":");const e=[...EVENTS,...S.ownEvents].find(x=>x.id===id);if(S.status[id]===st)delete S.status[id];else{S.status[id]=st;if(st==="ignored"||!S.showCompleted)S.archive.unshift({game:e.game,title:e.title,end:"running",status:st==="done"?"done":"ignored",ref:id})}S.sheet=null;if(st==="ignored")toast("Ignored. It's in the Archive if you want it back.")}
  else if(d.restore){const a=S.archive.find(x=>x.title===d.restore);S.archive=S.archive.filter(x=>x!==a);if(a.ref)delete S.status[a.ref];toast(`Restored ${esc(a.title)}`)}
  else if(d.arcst)S.arcStatus=d.arcst;
  else if(d.region)S.region=d.region;
  else if(d.theme)S.theme=d.theme;
  else if(d.ord){const[g,dir]=d.ord.split(":");const i=S.games.indexOf(g),j=i+ +dir;if(j>=0&&j<S.games.length){[S.games[i],S.games[j]]=[S.games[j],S.games[i]]}}
  else if(d.obg){const o=S.ob;o.games=o.games.includes(d.obg)?o.games.filter(x=>x!==d.obg):[...o.games,d.obg]}
  else if(d.obpick){const p=S.ob.picks;p.has(d.obpick)?p.delete(d.obpick):p.add(d.obpick)}
  else if(d.act){switch(d.act){
    case"why":S.why=!S.why;break;
    case"reset":S=fresh();break;
    case"library":S.drawer=true;S.tab="routines";break;
    case"library-create":S.drawer=true;setTimeout(()=>document.getElementById("create")?.scrollIntoView(),0);break;
    case"closedrawer":S.drawer=false;break;
    case"closesheet":S.sheet=null;break;
    case"takeme":S.tab="routines";S.returning=false;break;
    case"dismiss":S.returning=false;break;
    case"mine":{const r=byId(d.id);const id="mytask:"+Math.random().toString(36).slice(2,8);S.own.push({...r,id,builtin:false,own:true,src:"Yours, copied from the built-in"});S.followed.delete(r.id);S.followed.add(id);S.progress[id]=S.progress[r.id];S.menu=null;toast(`${esc(r.title)} is now yours to edit`);break}
    case"target":case"editown":S.menu=null;toast("Mockup: opens the routine editor");break;
    case"newevent":toast("Mockup: opens Add an event (your own events stay under Events)");break;
    case"obnext":if(S.ob.games.length)S.ob.step=2;break;
    case"obback":S.ob.step=1;break;
    case"obskip":S.ob.games=GAMES.map(g=>g.id);S.ob.step=2;break;
    case"obusual":BUILTINS.filter(r=>S.ob.games.includes(r.game)&&(r.period.unit==="week"||r.period.unit==="day")&&r.pulls!=="standard").forEach(r=>S.ob.picks.add(r.id));break;
    case"obclear":S.ob.picks.clear();break;
    case"obdone":S.games=[...S.ob.games];S.followed=new Set(S.ob.picks);S.own=[];S.progress={};S.ownEvents=[];S.ob=null;S.tab="events";toast(S.followed.size?`Following ${S.followed.size} routines. They're on the Routines tab.`:"Events only. Add routines from the Routines tab any time.");break;
  }}
  else return;
  render();
});
document.addEventListener("submit",ev=>{ev.preventDefault();const f=ev.target;
  if(f.dataset.amtform){S.progress[f.dataset.amtform]=Math.max(0,+f.v.value||0);S.editing=null;render()}
  if(f.id==="createform"){const fd=new FormData(f);const F=S.form;const title=String(fd.get("title")||"").trim();if(!title)return;const id="mytask:"+Math.random().toString(36).slice(2,8);
    const period=F.unit==="cycle"?{unit:"cycle",days:+fd.get("days")||14,from:"2026-10-16"}:{unit:F.unit};
    S.own.push({id,game:String(fd.get("game")),title,period,measure:F.kind==="amount"?{kind:"amount",target:+fd.get("target")||1}:{kind:"days",required:1},src:"Yours",own:true});S.followed.add(id);S.form={title:"",game:F.game,unit:"week",days:14,kind:"days",target:1};toast(`Created and following ${esc(title)}`);render()}
});
document.addEventListener("input",ev=>{
  if(ev.target.id==="libq"){S.q=ev.target.value;const pos=ev.target.selectionStart;render();const i=document.getElementById("libq");i.focus();i.setSelectionRange(pos,pos)}
  if(ev.target.closest("#createform")&&ev.target.name==="title")S.form.title=ev.target.value;
});
document.addEventListener("change",ev=>{const t=ev.target;
  if(t.dataset.game){const g=t.dataset.game;S.games=t.checked?[...S.games,g]:S.games.filter(x=>x!==g);render()}
  if(t.dataset.pref){S[t.dataset.pref]=t.checked;render()}
  if(t.id==="arcgame"){S.arcGame=t.value;render()}
  if(t.closest("#createform")&&t.name==="game")S.form.game=t.value;
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"){S.drawer=false;S.sheet=null;S.menu=null;S.editing=null;render()}});
render();
</script>
</body>
