<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · One due list</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#1a1c24; --surface:#21242e; --soft:#292c38; --softer:#323543;
  --ink:#eeeae3; --strong:#fffdf8; --muted:#aaa6b0; --faint:#77747f; --line:#2f3240;
  --calm:#7d8499; --near:#7ba5f3; --soon:#e9b95b; --critical:#f76b7d;
  --r-sm:8px; --r:14px; --r-lg:20px;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body:"Figtree", ui-sans-serif, system-ui, sans-serif;
  --bar:40px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:400 15px/1.6 var(--body);-webkit-font-smoothing:antialiased;padding-top:var(--bar);min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--near);outline-offset:2px;border-radius:6px}
.tnum{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* ---------- prototype chrome (deliberately not the app) ---------- */
.mock{position:fixed;inset:0 0 auto 0;height:var(--bar);z-index:100;background:#d8d5cc;color:#22232a;display:flex;align-items:center;gap:6px;padding:0 12px;font:500 12.5px/1 ui-sans-serif,system-ui,sans-serif;overflow-x:auto;white-space:nowrap;border-bottom:1px solid #bdb9ae}
.mock b{font-weight:700;margin-right:8px}
.mock button{padding:6px 9px;border-radius:6px;color:#22232a}
.mock button:hover{background:#c6c2b7}
.mock button.on{background:#22232a;color:#d8d5cc}
.mock .sp{flex:1}
.why{position:fixed;top:var(--bar);right:0;bottom:0;width:min(440px,100vw);background:#e7e4dc;color:#1e1f25;z-index:99;padding:22px 24px 40px;overflow:auto;font:400 14px/1.6 ui-sans-serif,system-ui,sans-serif;box-shadow:-12px 0 30px rgb(0 0 0/.35)}
.why h3{font-size:15px;margin:20px 0 6px}
.why code{background:#d5d1c6;padding:1px 5px;border-radius:4px;font-size:12.5px}
.why pre{background:#d5d1c6;padding:10px 12px;border-radius:8px;font-size:12px;line-height:1.5;overflow:auto}
.why ul{padding-left:18px;margin:6px 0}

/* ---------- app shell ---------- */
.shell{max-width:1360px;margin:0 auto;padding:0 28px 80px}
header.top{display:flex;align-items:center;gap:20px;padding:22px 0 18px}
.word{font:700 21px/1 var(--display);letter-spacing:-.01em}
.word span{color:var(--near)}
.tabs{display:flex;gap:2px;background:var(--surface);padding:4px;border-radius:12px}
.tabs button{padding:7px 14px;border-radius:9px;color:var(--muted);font-weight:500;font-size:14px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--softer);color:var(--ink)}
.grow{flex:1}
.link{color:var(--muted);font-size:14px}
.link:hover{color:var(--ink)}
.addbtn{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--ground);padding:9px 14px 9px 12px;border-radius:12px;font-weight:600;font-size:14px}
.addbtn:hover{background:var(--strong)}
.addbtn kbd{font:600 11px/1 var(--body);background:rgb(26 28 36/.12);padding:3px 6px;border-radius:5px}

.layout{display:grid;grid-template-columns:400px 1fr;gap:28px;align-items:start}
.rail{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(var(--bar) + 16px)}

.sec{background:var(--surface);border-radius:var(--r-lg);padding:18px 20px 16px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.sec-h h2{font:600 17px/1.3 var(--display);margin:0;letter-spacing:-.005em}
.sec-h .meta{color:var(--faint);font-size:13px}
.cust{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--faint);font-size:13px;padding:4px 8px;border-radius:8px}
.cust:hover,.cust[aria-expanded=true]{color:var(--ink);background:var(--soft)}
.cust svg{width:15px;height:15px}

/* due list */
.bucket{color:var(--faint);font-size:13px;margin:14px 0 4px}
.bucket:first-of-type{margin-top:4px}
.due{display:grid;grid-template-columns:10px 1fr auto;gap:2px 12px;align-items:center;padding:9px 10px;margin:0 -10px;border-radius:12px;width:calc(100% + 20px);text-align:left}
.due:hover{background:var(--soft)}
.dot{width:9px;height:9px;border-radius:50%}
.due .t{font-weight:500;line-height:1.35;min-width:0}
.due .t .sub{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:1px}
.due .left{font-weight:600;font-size:14px;text-align:right}
.kind{display:inline-block;font-size:11.5px;font-weight:500;color:var(--muted);background:var(--soft);padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.due:hover .kind{background:var(--softer)}
.kind.yours{color:var(--soon);background:rgb(233 185 91/.13)}
.due.done .t{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint)}
.due.done .left{color:var(--faint)}
.fill{grid-column:2/4;height:3px;border-radius:2px;background:var(--softer);overflow:hidden;margin-top:5px}
.fill i{display:block;height:100%;border-radius:2px}
.more{color:var(--muted);font-size:14px;margin-top:8px;padding:4px 0}
.more:hover{color:var(--ink)}
.empty{color:var(--muted);font-size:14px;padding:6px 0 4px}
.empty button{color:var(--near);text-decoration:underline;text-underline-offset:3px}
.editor{grid-column:1/4;display:flex;gap:8px;align-items:center;padding:8px 0 4px 22px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.editor input{width:96px;background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.pill{padding:6px 12px;border-radius:999px;background:var(--softer);font-size:13px;font-weight:500}
.pill:hover{background:#3c3f4f}
.pill.primary{background:var(--near);color:#0f1420}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 9px;border-radius:999px;background:var(--soft);font-size:13.5px;font-weight:500;color:var(--muted)}
.chip:hover{color:var(--ink)}
.chip .ck{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--h);display:grid;place-items:center}
.chip[aria-pressed=true]{background:color-mix(in srgb,var(--h) 16%,var(--surface));color:var(--ink)}
.chip[aria-pressed=true] .ck{background:var(--h)}
.chip[aria-pressed=true] .ck svg{opacity:1}
.chip .ck svg{width:10px;height:10px;opacity:0;color:var(--ground)}

.addsec{border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:13px 18px;color:var(--muted);font-size:14px;text-align:left;display:flex;gap:8px;align-items:center}
.addsec:hover{color:var(--ink);border-color:var(--faint)}

/* headline */
.head{background:var(--surface);border-radius:var(--r-lg);padding:26px 30px 24px;position:relative;overflow:hidden;margin-bottom:16px}
.head .lbl{color:var(--muted);font-size:14px}
.head h1{font:600 34px/1.12 var(--display);letter-spacing:-.02em;margin:6px 0 4px;max-width:22ch}
.head .game{font-weight:600;font-size:15px}
.head .row{display:flex;align-items:flex-end;gap:18px;margin:18px 0 14px;flex-wrap:wrap}
.big{font:700 54px/1 var(--body);letter-spacing:-.03em}
.head .when{color:var(--muted);font-size:14px;padding-bottom:6px}
.meter{display:flex;gap:3px}
.meter i{flex:1;height:10px;border-radius:3px;background:var(--softer)}
.meter i.on{background:var(--c)}
.meter.sm i{height:7px;border-radius:2px}

/* running list */
.runrow{display:grid;grid-template-columns:4px 1fr auto;gap:4px 16px;padding:16px 14px;margin:0 -14px;border-radius:14px;width:calc(100% + 28px);text-align:left}
.runrow:hover{background:var(--soft)}
.runrow .rail3{grid-row:1/4;border-radius:3px;background:var(--h);opacity:.7}
.runrow .gname{font-size:13px;font-weight:600}
.runrow .title{font-size:16px;font-weight:500;line-height:1.35}
.runrow .left{font-weight:600;font-size:15px;align-self:start;text-align:right}
.runrow .range{color:var(--faint);font-size:13px;margin-top:6px}
.runrow .meter{grid-column:2/4;margin-top:8px}
.rowacts{grid-column:2/4;display:flex;gap:8px;margin-top:10px}

/* popover */
.pop{position:absolute;z-index:60;width:340px;background:var(--softer);border-radius:16px;padding:16px 18px 14px;box-shadow:0 18px 40px rgb(0 0 0/.45)}
.pop h4{font:600 13px/1.3 var(--body);color:var(--muted);margin:14px 0 8px}
.pop h4:first-child{margin-top:0}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:5px 11px;border-radius:999px;background:var(--soft);font-size:13px;color:var(--muted)}
.opt:hover{color:var(--ink)}
.opt[aria-pressed=true]{background:rgb(123 165 243/.18);color:var(--ink);box-shadow:inset 0 0 0 1px rgb(123 165 243/.5)}
.opt.g[aria-pressed=true]{background:color-mix(in srgb,var(--h) 18%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 60%,transparent)}
.popfoot{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:16px;padding-top:12px;border-top:1px solid #3a3d4c;font-size:13.5px}
.popfoot button{color:var(--muted)}
.popfoot button:hover{color:var(--ink)}
.popfoot .addb{color:var(--near)}

/* palette */
.scrim{position:fixed;inset:var(--bar) 0 0 0;background:rgb(14 15 20/.66);z-index:70;display:flex;justify-content:center;align-items:flex-start;padding:10vh 16px 16px}
.pal{width:min(620px,100%);background:var(--surface);border-radius:20px;box-shadow:0 30px 60px rgb(0 0 0/.5);overflow:hidden}
.pal .q{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.pal .q svg{width:18px;height:18px;color:var(--faint)}
.pal .q input{flex:1;background:none;border:0;outline:0;font-size:17px}
.pal .res{max-height:56vh;overflow:auto;padding:8px 8px 12px}
.pal .grp{color:var(--faint);font-size:13px;padding:10px 12px 4px}
.pr{display:grid;grid-template-columns:10px 1fr auto;gap:2px 12px;align-items:center;padding:9px 12px;border-radius:12px;width:100%;text-align:left}
.pr:hover,.pr.sel{background:var(--soft)}
.pr .sub{grid-column:2;color:var(--muted);font-size:13px}
.pr .act{font-size:13px;font-weight:600;color:var(--near);grid-row:1/3;grid-column:3}
.pr .act.on{color:var(--muted);font-weight:500}
.pal .hint{padding:10px 18px;border-top:1px solid var(--line);color:var(--faint);font-size:12.5px}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--softer);border-radius:14px;padding:11px 12px 11px 18px;display:flex;gap:16px;align-items:center;box-shadow:0 14px 34px rgb(0 0 0/.45);z-index:90;font-size:14px;max-width:calc(100vw - 32px)}
.toast button{color:var(--near);font-weight:600;padding:4px 8px}

/* settings & archive */
.page{max-width:820px}
.page h1{font:600 30px/1.2 var(--display);letter-spacing:-.02em;margin:8px 0 6px}
.page .lead{color:var(--muted);margin:0 0 22px;max-width:60ch}
.set{background:var(--surface);border-radius:var(--r-lg);padding:20px 22px;margin-bottom:14px}
.set h2{font:600 18px/1.3 var(--display);margin:0 0 4px}
.set p{color:var(--muted);margin:0 0 14px;font-size:14px;max-width:62ch}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.lrow:first-of-type{border-top:0}
.lrow .s{color:var(--muted);font-size:13px}
.lrow .r{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.seg{display:inline-flex;background:var(--ground);border-radius:10px;padding:3px}
.seg button{padding:5px 12px;border-radius:8px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--softer);color:var(--ink)}

/* timeline (light sketch) */
.tl{background:var(--surface);border-radius:var(--r-lg);padding:18px 20px;overflow:auto}
.tlrow{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;min-height:34px}
.tltrack{position:relative;height:26px}
.tlbar{position:absolute;top:2px;height:22px;border-radius:6px;font-size:12px;padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now{position:absolute;top:0;bottom:0;width:1px;background:var(--critical)}

/* onboarding */
.ob{position:fixed;inset:var(--bar) 0 0 0;background:var(--ground);z-index:80;overflow:auto}
.obin{max-width:720px;margin:0 auto;padding:56px 24px 60px}
.step{color:var(--faint);font-size:14px}
.ob h1{font:600 38px/1.12 var(--display);letter-spacing:-.025em;margin:8px 0 10px}
.ob .lead{color:var(--muted);font-size:16px;margin:0 0 28px;max-width:52ch}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.gopt{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface);text-align:left;font-weight:500;color:var(--muted)}
.gopt:hover{color:var(--ink)}
.gopt[aria-pressed=true]{background:color-mix(in srgb,var(--h) 16%,var(--surface));color:var(--ink);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--h) 70%,transparent)}
.choice{display:block;width:100%;text-align:left;background:var(--surface);border-radius:18px;padding:20px 22px;margin-bottom:10px}
.choice:hover{background:var(--soft)}
.choice[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--near);background:var(--soft)}
.choice strong{font:600 19px/1.3 var(--display);display:block}
.choice span{color:var(--muted);font-size:14.5px;display:block;margin-top:4px}
.choice .ex{color:var(--faint);font-size:13px;margin-top:10px}
.obfoot{display:flex;align-items:center;gap:16px;margin-top:28px}
.commit{background:var(--ink);color:var(--ground);font-weight:600;padding:12px 22px;border-radius:12px}
.commit:hover{background:var(--strong)}
.commit:disabled{background:var(--soft);color:var(--faint);cursor:not-allowed}

/* coach marks */
.spot{position:fixed;z-index:85;border-radius:14px;box-shadow:0 0 0 9999px rgb(10 11 16/.72);pointer-events:none;transition:all .22s ease-out}
.tip{position:fixed;z-index:86;width:320px;background:var(--ink);color:var(--ground);border-radius:16px;padding:16px 18px 14px;box-shadow:0 18px 40px rgb(0 0 0/.5)}
.tip .n{font-size:12.5px;color:#5d5a63}
.tip h3{font:600 17px/1.3 var(--display);margin:4px 0 6px}
.tip p{margin:0;font-size:14px;line-height:1.5;color:#3a3840}
.tip .f{display:flex;gap:10px;align-items:center;margin-top:14px}
.tip .f .skip{color:#5d5a63;font-size:13.5px}
.tip .f .nx{margin-left:auto;background:var(--ground);color:var(--ink);padding:7px 14px;border-radius:10px;font-weight:600;font-size:13.5px}

@media (max-width:960px){
  .layout{grid-template-columns:1fr}
  .rail{position:static}
}
@media (max-width:640px){
  .shell{padding:0 16px 80px}
  header.top{flex-wrap:wrap;gap:12px;padding:16px 0 14px}
  header.top .tabs{order:3;width:100%}
  header.top .tabs button{flex:1}
  .head{padding:20px 18px}
  .head h1{font-size:26px}
  .big{font-size:42px}
  .sec{padding:16px}
  .pop{position:fixed!important;left:0!important;right:0;bottom:0;top:auto!important;width:auto;border-radius:20px 20px 0 0;max-height:80vh;overflow:auto}
  .ob h1{font-size:30px}
  .tip{left:16px!important;right:16px;width:auto}
  .addbtn kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    const d=new Date(NOW);let y=d.getUTCFullYear(),m=d.getUTCMonth();
    let end=Date.UTC(y,m,p.startsOn,RESET_H); if(end<=NOW) end=Date.UTC(y,m+1,p.startsOn,RESET_H);
    const e=new Date(end); return [Date.UTC(e.getUTCFullYear(),e.getUTCMonth()-1,p.startsOn,RESET_H),end];

function query(sec){
  let xs=items().filter(i=>{

    if(sec.games!=="all" && !sec.games.includes(i.game)) return false;
    if(sec.where==="main" && i.kind!=="event") return false;
    if(sec.within && i.dueAt!=null && i.dueAt-NOW>sec.within*D && i.status!=="done") return false;
    if(i.src==="event"||(i.own&&i.kind==="event")) return i.status==="open";

}

function dueRow(r){

  const tag=r.own?`<span class="kind yours">your ${r.kind==="event"?"event":r.kind}</span>`:`<span class="kind">${KIND_TAG[r.kind]}</span>`;
  let sub="", fill="";
  if(r.id==="__chores"){ sub=r.sub; }
  else if(r.measure){ const m=r.measure;
    sub=m.kind==="amount"?`<span class="tnum">${num(r.value)} / ${num(m.target)}</span> ${esc(m.unit||"")}`:(r.status==="done"?"Cleared this "+(r.kind==="cycle"?"cycle":r.kind.replace("ly","")):"Not cleared yet");
    if(m.kind==="amount") fill=`<div class="fill"><i style="width:${Math.min(100,r.value/m.target*100)}%;background:${hue}"></i></div>`;
    sub=`${G[r.game].short}, ${sub}`;
  } else sub=G[r.game].short;
  const lt=r.status==="done"&&r.id!=="__chores"?"done":r.id==="__chores"?`<span style="color:${heat(r.dueAt)}">${r.count}</span>`:`<span style="color:${heat(r.dueAt)}">${left(r.dueAt)}</span>`;
  const ed=S.editing===r.id&&r.measure?editor(r):"";
  return `<button class="due ${r.status==="done"?"done":""}" data-act="due" data-v="${r.id}"><span class="dot" style="background:${hue}"></span>
    <span class="t">${esc(r.title)}${tag}<span class="sub">${sub}</span></span><span class="left tnum">${lt}</span>${fill}</button>${ed}`;
}
function editor(r){
  const m=r.measure;
  if(m.kind==="amount") return `<div class="editor">Now at <input class="tnum" id="ed-in" type="number" value="${r.value}" min="0"> / ${num(m.target)} ${esc(m.unit||"")}<button class="pill primary" data-act="saveamt" data-v="${r.id}">Save</button><button class="pill" data-act="unfollow" data-v="${r.id}">Stop following</button></div>`;
  return `<div class="editor"><button class="pill primary" data-act="tick" data-v="${r.id}">${r.status==="done"?"Mark not cleared":"Mark cleared"}</button><button class="pill" data-act="unfollow" data-v="${r.id}">Stop following</button></div>`;
}
function runningBody(sec,xs){
  if(!xs.length) return `<div class="empty">No running events for the games you follow.</div>`;
  const full=S.expanded[sec.id]; const cap=sec.limit||xs.length; const shown=full?xs:xs.slice(0,cap);
  return shown.map(e=>{const g=G[e.game];const open=S.rowOpen===e.id;return `<button class="runrow" data-act="row" data-v="${e.id}" style="--h:${g.hue}"><span class="rail3"></span>
    <span><span class="gname" style="color:${g.hue}">${g.name}</span>${e.own?'<span class="kind yours">your event</span>':""}<br><span class="title">${esc(e.title)}</span></span>
    <span class="left tnum" style="color:${heat(e.dueAt)}">${left(e.dueAt)}</span>${meter(e,32,true)}
    <span class="range tnum" style="grid-column:2/4">${fmtD(e.startAt)} to ${e.dueAt?fmtD(e.dueAt):"end not announced"}</span>
    ${open?`<span class="rowacts"><span class="pill primary" data-act="mark" data-v="${e.id}" data-s="done">Mark done</span><span class="pill" data-act="mark" data-v="${e.id}" data-s="ignored">Ignore</span></span>`:""}</button>`}).join("")

/* quick-add palette */
function palResults(q){
  q=q.trim().toLowerCase(); const words=q.split(/\s+/).filter(Boolean);
  const periodWord=words.find(w=>["weekly","week","monthly","month","cycle","cycles","endgame","dailies","daily"].includes(w));
  const gameHit=GAMES.filter(g=>words.some(w=>g.name.toLowerCase().includes(w)||g.short.toLowerCase().includes(w)||g.id===w));
  const unit=periodWord?({weekly:"week",week:"week",monthly:"month",month:"month",cycle:"cycle",cycles:"cycle",endgame:"cycle"}[periodWord]):null;
  const res={bulk:[],chores:[],built:[]};
  const scope=gameHit.length?gameHit.map(g=>g.id):S.games.length?S.games:DEMO_GAMES;
  const rest=words.filter(w=>w!==periodWord&&!gameHit.some(g=>g.name.toLowerCase().includes(w)||g.short.toLowerCase().includes(w)||g.id===w));
  res.built=ROUTINES.filter(r=>scope.includes(r.game)&&(!unit||r.period.unit===unit)&&rest.every(w=>r.title.toLowerCase().includes(w))).slice(0,9);
  if(gameHit.length===1&&unit){ const g=gameHit[0]; const n=ROUTINES.filter(r=>r.game===g.id&&r.period.unit===unit).length; if(n) res.bulk.push({g,unit,n}); }
  if(periodWord==="dailies"||periodWord==="daily"||(!unit&&gameHit.length)) res.chores=scope.slice(0,6);
  return res;
}
function palHtml(){
  const q=UI.pal.q, r=palResults(q);
  const unitWord={week:"weekly",month:"monthly",cycle:"cycle"};
  let h="";
  if(r.bulk.length) h+=`<div class="grp">Follow a whole set</div>`+r.bulk.map(b=>`<button class="pr sel" data-act="bulk" data-v="${b.g.id}" data-s="${b.unit}"><span class="dot" style="background:${b.g.hue}"></span><span>Follow every ${b.g.short} ${unitWord[b.unit]}</span><span class="act">Follow ${b.n}</span><span class="sub">${b.n} built-ins, they appear in Due next</span></button>`).join("");
  if(r.chores.length) h+=`<div class="grp">Daily chores</div>`+r.chores.map(g=>{const on=S.chores.includes(g)&&S.games.includes(g);return `<button class="pr" data-act="choreon" data-v="${g}"><span class="dot" style="background:${G[g].hue}"></span><span>${G[g].name} dailies</span><span class="act ${on?"on":""}">${on?"Following":"Follow"}</span><span class="sub">${esc(G[g].chores)}</span></button>`}).join("");
  if(r.built.length) h+=`<div class="grp">Built-in for the game</div>`+r.built.map(x=>{const on=S.follow.includes(x.id)&&S.games.includes(x.game);const k=x.period.unit==="week"?"Weekly":x.period.unit==="month"?"Monthly":`Every ${x.period.days} days`;
    return `<button class="pr" data-act="follow" data-v="${x.id}"><span class="dot" style="background:${G[x.game].hue}"></span><span>${esc(x.title)}</span><span class="act ${on?"on":""}">${on?"Following":"Follow"}</span><span class="sub">${G[x.game].short}, ${k}${x.measure.kind==="amount"?`, ${num(x.measure.target)} ${esc(x.measure.unit)}`:""}</span></button>`}).join("");
  h+=`<div class="grp">Your own</div><button class="pr" data-act="mkown"><span class="dot" style="background:var(--soon)"></span><span>${q.trim()?`Create a weekly task called “${esc(q.trim())}”`:"Create your own event or task"}</span><span class="act">Create</span><span class="sub">Kept apart from the built-ins, under Settings, Your own events</span></button>`;
  return `<div class="scrim" data-act="closepal"><div class="pal" role="dialog" aria-label="Add"><div class="q">${ICON.search}<input id="palq" placeholder="Try “zzz weekly”, “star rail cycle” or “dailies”" value="${esc(q)}" autocomplete="off"></div><div class="res" id="palres">${h}</div><div class="hint">Type a game and a kind. Everything you follow lands in Due next straight away.</div></div></div>`;
}

function whyHtml(){
  return `<aside class="why"><h2 style="margin:0;font-size:19px">C · One due list</h2>
  <h3>The idea</h3><p>You don't think in events, weeklies and cycles; you think in “what do I lose next”. So everything with a deadline goes into one Due next list, ordered by when it's lost, capped so it never floods. Nothing but events is on until you add it. Every section carries its own Customise button, so changing a list happens where you are looking, not at the bottom of the page.</p>
  <h3>The foundation underneath</h3><p>Two ideas replace the fifteen scattered prefs (<code>hiddenGames</code>, <code>knownGames</code>, <code>showChores</code>/<code>choresOn</code>/<code>choresOff</code>, <code>showRoutines</code>/<code>routineGames</code>/<code>routinesOff</code>/<code>routinesAsked</code>/<code>routinesHidden</code>, <code>showWeeklyTasks</code>/<code>showMonthlyTasks</code>/<code>showCycleTasks</code>, <code>standardPulls</code>):</p>
<pre>// 1. one stream: every source projects to Item
Item = { id, game, kind: event|daily|weekly|monthly|cycle,
         own: boolean, startAt, dueAt, measure?, status }
// feed events, chores, built-ins and your tasks are adapters

// 2. what you follow, and how you look at it
Prefs = {
  games: GameId[],          // followed, in your order
  follow: ItemSourceId[],   // chores + built-ins you opted into
  layout: Section[],
}
Section = { id, title, where: rail|main,
            kinds, games: 'all'|GameId[], limit, sort, hidden }</pre>
  <p>Due next, Today's dailies and Running now are just three saved queries. The Timeline and the archive read the same stream.</p>
  <h3>How it scales</h3><ul><li>A new kind (a season pass, a shop reset) is one adapter into <code>Item</code>; every section can show it at once.</li><li>A new view (a per-game page, a “cycles only” panel) is a new <code>Section</code> preset, not new prefs and not new components.</li><li>Onboarding answers write sections; they don't flip switches.</li></ul>
  <h3>Tradeoffs, honestly</h3><ul><li>A merged list can bury a long cycle under many short dailies; the cap and the folded “Daily chores” line are what stop that, and they need tuning.</li><li>Section configs are power-user surface. Most readers will never open Customise, so the presets have to be right.</li><li>Kind tags are small; a reader who wants weeklies visually apart gets that only by adding a section.</li><li>Migration has to translate today's prefs into sections, once.</li></ul></aside>`;
}

let undoState=null;
function snapshot(){ undoState=JSON.parse(JSON.stringify(S)); }
function toast(msg,undo=true){ UI.toast={msg,undo}; clearTimeout(toast.t); toast.t=setTimeout(()=>{UI.toast=null;render();},5000); }
document.addEventListener("click",(ev)=>{
  const el=ev.target.closest("[data-act]");
  if(!el){ if(UI.pop||UI.addMenu){UI.pop=null;UI.addMenu=false;render();} return; }
  const a=el.dataset.act, v=el.dataset.v, s=el.dataset.s, sec=S.layout.find(x=>x.id===s);
  if(a==="closepal"&&ev.target!==el) return;
  ev.stopPropagation();
  switch(a){
    case "screen": go(v); return;
    case "reset": S=demoState(); UI={...UI,pop:null,pal:null,toast:null,ob:null,tour:null,addMenu:false,screen:"main"}; break;
    case "why": UI.why=!UI.why; break;
    case "tab": S.tab=v; S.view="main"; UI.pop=null; UI.screen=v==="settings"?"settings":"main"; break;
    case "archive": S.tab="checklist"; S.view="archive"; UI.pop=null; UI.screen="archive"; break;
    case "back": S.view="main"; UI.screen="main"; break;
    case "pal": UI.pop=null; UI.addMenu=false; UI.pal={q:el.dataset.q||""}; break;
    case "closepal": UI.pal=null; break;
    case "pop": UI.pop=UI.pop===v?null:v; UI.addMenu=false; break;
    case "addmenu": UI.addMenu=!UI.addMenu; UI.pop=null; break;
    case "addsecv": snapshot(); addSection(v); UI.addMenu=false; break;
    case "kind": snapshot(); sec.kinds=sec.kinds.includes(v)?sec.kinds.filter(k=>k!==v):[...sec.kinds,v]; break;
    case "gamesall": sec.games="all"; break;
    case "game": { let gs=sec.games==="all"?[]:[...sec.games]; gs=gs.includes(v)?gs.filter(g=>g!==v):[...gs,v]; sec.games=gs.length?gs:"all"; break; }
    case "limit": sec.limit=+v; break;
    case "sort": sec.sort=v; break;
    case "within": sec.within=+v; break;
    case "moregames": UI.moreGames=!UI.moreGames; break;
    case "move": { const i=S.layout.indexOf(sec), j=i+(+v); if(j>=0&&j<S.layout.length){ S.layout.splice(i,1); S.layout.splice(j,0,sec);} break; }
    case "hide": snapshot(); sec.hidden=true; UI.pop=null; toast(`Hid ${sec.title}. Bring it back from Add a section or Settings, Layout.`); break;
    case "showsec": sec.hidden=!sec.hidden; break;
    case "editsec": sec.hidden=false; S.tab="checklist"; S.view="main"; UI.pop=s; UI.screen="main"; break;
    case "more": S.expanded[v]=!S.expanded[v]; break;
    case "due": if(v==="__chores"){ const d=S.layout.find(x=>x.id==="dailies"); if(d.hidden){d.hidden=false;toast("Showing Today's dailies so you can tick them",false);} else document.getElementById("sec-dailies")?.scrollIntoView({behavior:"smooth",block:"center"}); break; }
      if(v.startsWith("ev")){ S.rowOpen=v; break; } S.editing=S.editing===v?null:v; break;
    case "saveamt": { const n=+document.getElementById("ed-in").value||0; S.progress[v]=n; S.editing=null; break; }
    case "tick": S.progress[v]=S.progress[v]?0:1; S.editing=null; break;
    case "unfollow": snapshot(); S.follow=S.follow.filter(f=>f!==v); S.own=S.own.filter(o=>o.id!==v); S.editing=null; toast("Stopped following. Find it again with Add."); break;
    case "chore": S.choresDone=S.choresDone.includes(v)?S.choresDone.filter(g=>g!==v):[...S.choresDone,v]; break;
    case "row": S.rowOpen=S.rowOpen===v?null:v; break;
    case "mark": snapshot(); S.status[v]=s; S.rowOpen=null; toast(s==="done"?"Marked done, moved to Done & ignored":"Ignored, moved to Done & ignored"); break;
    case "restore": snapshot(); delete S.status[v]; toast("Restored to Running now"); break;
    case "astat": S.archiveStatus=v; break;
    case "agame": S.archiveGame=v; break;
    case "togglegame": snapshot(); S.games=S.games.includes(v)?S.games.filter(g=>g!==v):[...S.games,v]; break;
    case "follow": { snapshot(); const r=ROUTINES.find(x=>x.id===v); if(!S.games.includes(r.game)) S.games.push(r.game);
      if(S.follow.includes(v)){S.follow=S.follow.filter(f=>f!==v); toast(`Stopped following ${esc(r.title)}`);} else { S.follow.push(v); ensureKind(r.period.unit); toast(`Following ${esc(r.title)}, it's in Due next`);} break; }
    case "bulk": { snapshot(); const ids=ROUTINES.filter(r=>r.game===v&&r.period.unit===s).map(r=>r.id); if(!S.games.includes(v)) S.games.push(v); S.follow=[...new Set([...S.follow,...ids])]; ensureKind(s); UI.pal=null; toast(`Following ${ids.length} ${G[v].short} ${s==="week"?"weeklies":s==="month"?"monthlies":"cycles"}`); break; }
    case "choreon": snapshot(); if(!S.games.includes(v)) S.games.push(v); if(S.chores.includes(v)) S.chores=S.chores.filter(g=>g!==v); else { S.chores.push(v); ensureKind("daily"); const d=S.layout.find(x=>x.id==="dailies"); d.hidden=false; } toast(`${G[v].short} dailies ${S.chores.includes(v)?"added":"removed"}`); break;
    case "mkown": { snapshot(); const t=UI.pal.q.trim()||"New task"; const g=S.games[0]||"genshin"; S.own.push({id:"own:"+Date.now(),game:g,title:t,kind:"weekly",period:{unit:"week",startsOn:1},measure:{kind:"days",required:1}}); ensureKind("own"); UI.pal=null; toast(`Created “${esc(t)}” for ${G[g].short}. It's in Due next and in Settings, Your own events`); break; }
    case "undo": if(undoState){S=undoState;undoState=null;} UI.toast=null; break;
    case "obgame": UI.ob.games=UI.ob.games.includes(v)?UI.ob.games.filter(g=>g!==v):[...UI.ob.games,v]; break;
    case "obnext": UI.ob.step=2; break;
    case "obback": UI.ob.step=1; break;
    case "obplan": UI.ob.plan=v; break;
    case "obdone": finishOnboarding(); break;
    case "tournext": if(UI.tour.i<UI.tour.steps.length-1) UI.tour.i++; else UI.tour=null; break;
    case "tourend": UI.tour=null; break;
  }
  render();
});
function ensureKind(unit){ const k={week:"weekly",month:"monthly",cycle:"cycle",daily:"daily",own:"own"}[unit]||unit; const d=S.layout.find(x=>x.id==="due"); if(d&&!d.kinds.includes(k)) d.kinds.push(k); }
function addSection(v){
  const id=v+Math.floor(Math.random()*1e4);
  if(v==="dailies"){ const d=S.layout.find(x=>x.id==="dailies"); d.hidden=false; toast("Showing Today's dailies"); return; }
  const base={id,where:"rail",games:"all",limit:6,sort:"due"};
  if(v==="cycles") S.layout.push({...base,title:"Endgame cycles",kinds:["cycle"]});
  if(v==="own") S.layout.push({...base,title:"Your own",kinds:["own"]});
  if(v==="game"){ const g=S.games[1]||S.games[0]||"zzz"; S.layout.push({...base,title:G[g].short,kinds:ALL_KINDS,games:[g],sort:"due"}); }
  UI.pop=id; toast("Section added. Change it with Customise.");
}
function finishOnboarding(){
  const o=UI.ob; const s=blankState(); s.games=[...o.games];
  if(o.plan==="dailies"||o.plan==="all"){ s.chores=[...o.games]; s.layout[0].kinds=["event","daily","own"]; s.layout[1].hidden=false; }
  if(o.plan==="all"){ s.follow=ROUTINES.filter(r=>o.games.includes(r.game)).map(r=>r.id); s.layout[0].kinds=[...ALL_KINDS]; }
  S=s; UI.ob=null; UI.screen="main"; render(); UI.tour={steps:TOUR_NEW,i:0,back:false};
}
function go(k){
  UI.pop=null; UI.pal=null; UI.ob=null; UI.tour=null; UI.addMenu=false; UI.toast=null; UI.screen=k;
  if(k==="main"){ S.tab="checklist"; S.view="main"; }
  if(k==="add"){ S.tab="checklist"; S.view="main"; UI.pal={q:"zzz weekly"}; }
  if(k==="settings"){ S.tab="settings"; }
  if(k==="archive"){ S.tab="checklist"; S.view="archive"; }
  if(k==="onboard"){ S=blankState(); UI.ob={step:1,games:["genshin","zzz","hsr"],plan:"dailies"}; }
  if(k==="return"){ S=demoState(); render(); UI.tour={steps:TOUR_BACK,i:0,back:true}; }
  render();
}
document.addEventListener("input",(ev)=>{ if(ev.target.id==="palq"){ UI.pal.q=ev.target.value; const r=document.getElementById("palres"); const tmp=document.createElement("div"); tmp.innerHTML=palHtml(); r.innerHTML=tmp.querySelector("#palres").innerHTML; } });
document.addEventListener("keydown",(ev)=>{
  if(ev.key==="/"&&!UI.pal&&!UI.ob&&!/input|textarea/i.test(document.activeElement.tagName)){ ev.preventDefault(); UI.pal={q:""}; render(); }
  if(ev.key==="Escape"){ UI.pal=null; UI.pop=null; UI.addMenu=false; UI.tour=null; render(); }
});
window.addEventListener("resize",()=>{ if(UI.tour) render(); });
render();
</script>
</body>
</html>
