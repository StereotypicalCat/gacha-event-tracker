<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Round 4 · Round 4 · Combined review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0e1117; --panel:#141923; --raised:#1c2230; --rule:#232a38; --rule-strong:#323b4e;
  --ink:#e4e7ef; --ink-strong:#fff; --muted:#8b93a7; --faint:#5d6579;
  --calm:#55607f; --near:#5b8def; --soon:#e8b33c; --critical:#ff4d6a; --fill:#c9cedb;
  --chrome-bg:#e9e4d4; --chrome-ink:#2a2a2a;
}
:root[data-theme="light"]{
  --ground:#eef0f5; --panel:#ffffff; --raised:#e2e6ef; --rule:#d3d8e3; --rule-strong:#b9c0cf;
  --ink:#151824; --ink-strong:#000; --muted:#525a70; --faint:#757d92;
  --calm:#8a92a8; --near:#2b62c6; --soon:#8a6008; --critical:#c81e3c; --fill:#3a4152;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:400 14px/1.5 Barlow,system-ui,sans-serif;font-variant-numeric:tabular-nums;padding-top:40px;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--ground);border:1px solid var(--rule-strong);border-radius:3px;padding:6px 8px;min-width:0}
:focus-visible{outline:2px solid var(--near);outline-offset:2px}
.cond{font-family:"Barlow Condensed",Barlow,sans-serif}

/* ---------- prototype chrome ---------- */
#chrome{position:fixed;inset:0 0 auto 0;height:40px;z-index:50;background:var(--chrome-bg);color:var(--chrome-ink);display:flex;align-items:center;gap:5px;padding:0 12px;font:500 12px/1 system-ui,sans-serif;border-bottom:2px dashed #b9b29a;overflow-x:auto;white-space:nowrap}
#chrome b{font-weight:700;margin-right:6px}
#chrome button{padding:5px 7px;border-radius:3px;border:1px solid #c4bda4;background:#f6f2e6;color:#2a2a2a;flex:none}
#chrome button[aria-pressed="true"]{background:#2a2a2a;color:#f6f2e6;border-color:#2a2a2a}
#chrome .sep{width:1px;height:20px;background:#c4bda4;margin:0 4px;flex:none}
#chrome .lbl{color:#6b6450;flex:none}

/* ---------- app shell ---------- */
.shell{max-width:1320px;margin:0 auto;border-inline:1px solid var(--rule);min-height:calc(100vh - 40px);display:flex;flex-direction:column}
.shell>.body{flex:1}
header.top{display:flex;align-items:flex-end;gap:28px;padding:18px 24px 0;border-bottom:1px solid var(--rule)}
.mark{font:700 20px/1 "Barlow Condensed";letter-spacing:.04em;padding-bottom:14px}
.mark span{color:var(--near)}
nav.tabs{display:flex;gap:2px;flex:1;min-width:0}
nav.tabs button{padding:10px 14px 12px;font:600 15px/1 "Barlow Condensed";letter-spacing:.03em;color:var(--faint);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:baseline;white-space:nowrap}
nav.tabs button:hover{color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--ink);border-color:var(--ink)}
nav.tabs .n{font:500 12px Barlow;color:var(--faint)}
nav.tabs .gear{margin-left:auto}
nav.tabs svg{width:15px;height:15px;align-self:center}
footer.foot{border-top:1px solid var(--rule);padding:16px 24px;display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--faint)}
footer.foot button{color:var(--muted);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule-strong)}
footer.foot button:hover{color:var(--ink)}

/* ---------- what's new ---------- */
.wn{border-bottom:1px solid var(--rule);padding:16px 24px 14px;background:color-mix(in srgb,var(--near) 6%,transparent)}
.wn-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.wn-h .k{font:600 13px "Barlow Condensed";letter-spacing:.1em;text-transform:uppercase;color:var(--near)}
.wn-h .d{font-size:12px;color:var(--faint)}
.wn-h h3{font:600 19px/1.15 "Barlow Condensed";margin:0;flex-basis:100%;letter-spacing:.01em}
.wn ul{list-style:none;margin:0 0 10px;padding:0}
.wn li{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:3px 0;font-size:13px;color:var(--muted)}
.wn li .kind{color:var(--faint);font-size:12px}
.wn .acts{display:flex;gap:6px;align-items:center}
.pillbtn{font-size:12px;font-weight:600;padding:5px 12px;border-radius:3px;border:1px solid color-mix(in srgb,var(--near) 55%,transparent);color:var(--near);background:color-mix(in srgb,var(--near) 12%,transparent)}
.pillbtn:hover{background:color-mix(in srgb,var(--near) 20%,transparent)}

/* ---------- checklist ---------- */
.ev{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 160px)}
.rail{border-right:1px solid var(--rule);min-width:0}
.head{padding:22px 24px 20px;border-bottom:1px solid var(--rule)}
.legend{font-size:12px;color:var(--faint);margin:0 0 6px}
.head h2{font:600 30px/1.05 "Barlow Condensed";margin:0 0 6px;letter-spacing:.005em}
.head .game{font-weight:500;font-size:14px}
.big{font:700 64px/1 "Barlow Condensed";letter-spacing:-.01em;margin:16px 0 4px}
.big small{font-size:18px;font-weight:600;color:var(--muted);margin-left:6px;letter-spacing:0}
.exact{font-size:12px;color:var(--faint);margin-bottom:12px}
.meter{display:flex;gap:2px;height:9px}
.meter i{flex:1;background:var(--rule);border-radius:1px}
.meter i.on{background:var(--h)}
.meter.unknown{background:repeating-linear-gradient(135deg,var(--rule) 0 3px,transparent 3px 6px)}
.meter.unknown i{background:transparent}
.then{list-style:none;margin:16px 0 0;padding:12px 0 0;border-top:1px solid var(--rule)}
.then li{display:flex;gap:8px;align-items:baseline;font-size:13px;padding:3px 0;color:var(--muted)}
.then .dot{width:7px;height:7px;border-radius:50%;background:var(--g);flex:none;transform:translateY(-1px)}
.then .t{flex:1}
.then .r{font:600 14px "Barlow Condensed"}

.pinned{padding:18px 0 8px}
.pinned-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 24px 8px;gap:10px}
.pinned-h .lbl{font:600 16px "Barlow Condensed";letter-spacing:.02em}
.pinned-h .lbl small{font:500 12px Barlow;color:var(--faint);margin-left:6px;letter-spacing:0}
.pinned-h button{font-size:12px;color:var(--near)}
.pinned .hint{padding:0 24px 8px;font-size:12px;color:var(--faint);margin:0}
.gblock{border-top:1px solid var(--rule)}
.gblock-h{display:grid;grid-template-columns:3px 1fr auto;gap:0 12px;align-items:center;width:100%;text-align:left;padding:10px 24px}
.gblock-h:hover{background:var(--panel)}
.gblock-h .rl{width:3px;height:30px;border-radius:2px;background:var(--g)}
.gblock-h .nm{font:600 15px/1.2 "Barlow Condensed";letter-spacing:.02em;color:var(--g)}
.gblock-h .nm .srv{color:var(--muted);font-weight:500}
.gblock-h .sm{font-size:12px;color:var(--muted);line-height:1.35}
.gblock-h .sm b{font-weight:600;color:var(--soon)}
.gblock-h .chev{color:var(--faint);transition:transform .14s}
.gblock.open .gblock-h .chev{transform:rotate(180deg)}
.gitems{padding:0 24px 10px 39px}
.gitem{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--rule);font-size:13px}
.gitem:first-child{border-top:0}
.gitem .t{flex:1;min-width:0;line-height:1.3}
.gitem .t small{display:block;color:var(--faint);font-size:11.5px}
.gitem.met .t{color:var(--faint)}
.mini-amt{display:flex;align-items:center;gap:5px;font:600 13px "Barlow Condensed";color:var(--faint);white-space:nowrap}
.mini-amt input{width:74px;padding:3px 6px;text-align:right;font:600 13px "Barlow Condensed"}
.rail-foot{display:flex;justify-content:space-between;padding:12px 24px 6px;font-size:12px;color:var(--faint);border-top:1px solid var(--rule)}
.rail-foot button{color:var(--near)}
.pinned .empty{padding:4px 24px 12px;font-size:13px;color:var(--muted);margin:0}

.main{min-width:0}
.btn{padding:7px 12px;border:1px solid var(--rule-strong);border-radius:3px;font-weight:500;font-size:13px;color:var(--muted);white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--muted)}
.btn.solid{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn.solid:hover{background:var(--ink-strong)}
.btn.link{border:0;padding:7px 4px;color:var(--near)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:default}

.ledger-h{display:flex;justify-content:space-between;align-items:baseline;padding:20px 24px 6px;gap:12px;flex-wrap:wrap}
.ledger-h h2{font:600 22px "Barlow Condensed";margin:0;letter-spacing:.02em}
.ledger-h .sub{font-size:12px;color:var(--faint)}
.focusrow{display:flex;gap:2px 16px;flex-wrap:wrap;padding:6px 24px 0;border-bottom:1px solid var(--rule-strong)}
.focusrow button{font:600 14px "Barlow Condensed";letter-spacing:.03em;color:var(--faint);padding:8px 0 9px;border-bottom:2px solid transparent;margin-bottom:-1px}
.focusrow button:hover{color:var(--muted)}
.focusrow button[aria-pressed="true"]{color:var(--ink);border-color:var(--fh,var(--ink))}
.focusrow .n{font:500 11px Barlow;color:var(--faint);margin-left:4px}
.seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:3px;flex:none}
.seg button{padding:5px 10px;font-size:12px;color:var(--faint);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink)}
table.led{width:100%;border-collapse:collapse}
table.led th{font:500 12px Barlow;color:var(--faint);text-align:left;padding:6px 12px;border-bottom:1px solid var(--rule-strong);white-space:nowrap}
table.led td{padding:12px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.led th:first-child,table.led td:first-child{padding-left:24px}
table.led th:last-child,table.led td:last-child{padding-right:24px}
table.led tbody tr{cursor:pointer}
table.led tbody tr:hover{background:var(--panel)}
.gcell{display:flex;align-items:center;gap:10px;white-space:nowrap;font-weight:600;font-size:13px;color:var(--g)}
.gcell::before{content:"";width:3px;height:26px;border-radius:2px;background:var(--g);flex:none}
.gcell small{display:block;color:var(--muted);font-weight:500;font-size:11.5px;line-height:1}
.tcell{font-weight:500;font-size:15px}
.tag{font-size:11px;color:var(--faint);border:1px solid var(--rule-strong);border-radius:2px;padding:0 5px;margin-left:8px;font-weight:500;vertical-align:2px;white-space:nowrap}
.tag.own{color:var(--g);border-color:color-mix(in srgb,var(--g) 45%,transparent)}
.mcell{width:34%}
.cd{font:600 20px "Barlow Condensed";text-align:right;white-space:nowrap}
.cd.calm{color:var(--calm)}.cd.near{color:var(--near)}.cd.soon{color:var(--soon)}.cd.critical{color:var(--critical)}.cd.unk{color:var(--faint);font-size:14px}
.more{padding:12px 24px;font-size:13px;color:var(--muted)}
.more button{color:var(--near)}

/* ---------- routines ---------- */
.rt-top{display:flex;align-items:flex-end;gap:16px;padding:22px 24px 16px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.rt-top h1{font:700 34px/1 "Barlow Condensed";margin:0;letter-spacing:.01em}
.rt-top .sum{font-size:13px;color:var(--muted);flex:1;min-width:200px}
.rt-top .sum b{color:var(--ink);font-weight:600}
.hintbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--rule);background:color-mix(in srgb,var(--near) 7%,transparent);font-size:13px}
.hintbar p{margin:0;flex:1;min-width:240px;color:var(--muted)}
.hintbar p b{color:var(--ink);font-weight:600}
.hintbar svg{width:14px;height:14px;vertical-align:-2px;color:var(--near)}
.band{border-bottom:1px solid var(--rule)}
.band-h{display:grid;grid-template-columns:1fr auto;align-items:end;padding:22px 24px 10px;gap:12px;border-bottom:1px solid var(--rule-strong)}
.band-h h2{font:700 26px/1 "Barlow Condensed";margin:0;letter-spacing:.02em}
.band-h .meta{font-size:12px;color:var(--faint);margin-top:4px}
.bulkpins{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.bulkpins button{font-size:12px;color:var(--muted);border:1px solid var(--rule-strong);border-radius:2px;padding:2px 8px}
.bulkpins button:hover{color:var(--ink);border-color:var(--muted)}
.band-h .reset{text-align:right}
.band-h .reset .k{font-size:12px;color:var(--faint)}
.band-h .reset .v{font:700 34px/1 "Barlow Condensed"}
.subsrv{padding:10px 24px 2px;font:600 13px "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
table.rt{width:100%;border-collapse:collapse;table-layout:fixed}
table.rt th{font:500 11px Barlow;color:var(--faint);text-align:left;padding:6px 12px 4px;letter-spacing:.02em}
table.rt td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.rt td:first-child,table.rt th:first-child{padding-left:24px;width:140px}
table.rt .c-cyc{width:130px;text-align:right}
table.rt .c-pin{width:78px;text-align:center}
table.rt .c-k{width:52px;text-align:right;padding-right:24px}
table.rt tr:last-child td{border-bottom:0}
.rtitle{font-weight:500;font-size:15px}
.prog{width:30%}
.amt{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.amt .bar{flex:1;height:6px;background:var(--rule);position:relative;border-radius:1px;overflow:hidden}
.amt .bar i{position:absolute;inset:0 auto 0 0;background:var(--fill)}
.amt .bar.full i{background:var(--g)}
.amt .num{font:600 15px "Barlow Condensed";min-width:110px;text-align:right;color:var(--muted)}
.amt .num b{color:var(--ink);font-weight:600}
.amt input{width:90px;padding:3px 6px}
.tick{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.tick .box{width:18px;height:18px;border:1px solid var(--rule-strong);border-radius:3px;display:grid;place-items:center;flex:none}
.tick[aria-pressed="true"]{color:var(--ink)}
.tick[aria-pressed="true"] .box{background:var(--g);border-color:var(--g)}
.tick svg{width:12px;height:12px;stroke:var(--ground);stroke-width:3;fill:none;opacity:0}
.tick[aria-pressed="true"] svg{opacity:1}
.tick .part{font:600 12px "Barlow Condensed";color:var(--muted)}
.cyc{font:600 14px "Barlow Condensed";color:var(--muted);white-space:nowrap}
.pin{width:34px;height:28px;border-radius:3px;display:inline-grid;place-items:center;color:var(--faint);border:1px solid transparent}
.pin svg{width:16px;height:16px}
.pin:hover{color:var(--ink);border-color:var(--rule-strong)}
.pin[aria-pressed="true"]{color:var(--near);background:color-mix(in srgb,var(--near) 15%,transparent);border-color:color-mix(in srgb,var(--near) 45%,transparent)}
.pinlbl{display:inline-flex;align-items:center;gap:4px}
.pinlbl svg{width:12px;height:12px}
.kebab{width:28px;height:28px;border-radius:3px;display:inline-grid;place-items:center;color:var(--faint);position:relative}
.kebab:hover{background:var(--raised);color:var(--ink)}
.menu{position:absolute;right:0;top:30px;z-index:20;background:var(--panel);border:1px solid var(--rule-strong);border-radius:4px;min-width:200px;text-align:left;padding:4px;box-shadow:0 8px 24px rgb(0 0 0 / .35)}
.menu span{display:block;width:100%;text-align:left;padding:7px 10px;font-size:13px;color:var(--muted);border-radius:3px;cursor:pointer}
.menu span:hover{background:var(--raised);color:var(--ink)}
.menu span.danger:hover{color:var(--critical)}
tr.met .rtitle{color:var(--muted)}
.empty-band{padding:14px 24px;font-size:13px;color:var(--faint)}
.empty-state{padding:72px 24px;max-width:560px}
.empty-state h2{font:700 30px/1.1 "Barlow Condensed";margin:0 0 10px}
.empty-state p{color:var(--muted);margin:0 0 20px;max-width:46ch}

/* ---------- drawer: library + create ---------- */
.scrim{position:fixed;inset:40px 0 0 0;background:rgb(8 10 14 / .6);z-index:30}
:root[data-theme="light"] .scrim{background:rgb(26 31 48 / .35)}
.drawer{position:fixed;top:40px;right:0;bottom:0;width:min(580px,100vw);background:var(--panel);border-left:1px solid var(--rule-strong);z-index:31;display:flex;flex-direction:column}
.drawer-h{padding:20px 24px 14px;border-bottom:1px solid var(--rule)}
.drawer-h .r1{display:flex;justify-content:space-between;align-items:center;gap:12px}
.drawer-h h2{font:700 28px/1 "Barlow Condensed";margin:0}
.drawer-h p{margin:6px 0 12px;font-size:13px;color:var(--muted)}
.drawer-h input[type=search]{width:100%}
.drawer-h .newpin{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--faint);margin-top:10px;flex-wrap:wrap}
.drawer-h .newpin label{display:flex;gap:6px;align-items:center;color:var(--muted)}
.drawer-h input[type=checkbox]{accent-color:var(--near)}
.back{font-size:13px;color:var(--muted);display:inline-flex;gap:4px;align-items:center}
.back:hover{color:var(--ink)}
.close{width:32px;height:32px;display:grid;place-items:center;border-radius:3px;color:var(--muted);flex:none}
.close:hover{background:var(--raised);color:var(--ink)}
.drawer-b{overflow:auto;flex:1}
.mkown{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;margin:14px 0 0;padding:14px 16px;border:1px dashed color-mix(in srgb,var(--near) 60%,transparent);border-radius:4px;background:color-mix(in srgb,var(--near) 7%,transparent)}
.mkown:hover{background:color-mix(in srgb,var(--near) 13%,transparent);border-style:solid}
.mkown .plus{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--near);color:var(--ground)}
.mkown .plus svg{width:16px;height:16px}
.mkown b{display:block;font:700 18px/1.1 "Barlow Condensed";letter-spacing:.02em}
.mkown small{display:block;font-size:12px;color:var(--muted)}
.mkown .go{color:var(--near)}
.lg{border-bottom:1px solid var(--rule)}
.lg-h{display:flex;align-items:center;gap:10px;padding:16px 24px 8px;flex-wrap:wrap}
.lg-h .nm{font:700 18px "Barlow Condensed";color:var(--g);letter-spacing:.02em;flex:1}
.lg-h .cnt{font-size:12px;color:var(--faint)}
.bulk{display:flex;gap:6px;padding:0 24px 10px;flex-wrap:wrap}
.bulk button{font-size:12px;color:var(--muted);border:1px solid var(--rule-strong);border-radius:2px;padding:3px 8px}
.bulk button:hover{color:var(--ink);border-color:var(--muted)}
.li{display:grid;grid-template-columns:1fr auto;gap:12px;padding:9px 24px;border-top:1px solid var(--rule);align-items:center}
.li .t{font-weight:500}
.li .d{font-size:12px;color:var(--faint)}
.fols{display:flex;gap:4px}
.fol{font-size:12px;font-weight:600;padding:5px 10px;border-radius:3px;border:1px solid var(--rule-strong);color:var(--muted);min-width:92px;white-space:nowrap}
.fols .fol{min-width:0}
.fol:hover{color:var(--ink);border-color:var(--muted)}
.fol[aria-pressed="true"]{background:color-mix(in srgb,var(--g) 16%,transparent);border-color:color-mix(in srgb,var(--g) 60%,transparent);color:var(--ink)}
.others summary{padding:14px 24px;cursor:pointer;color:var(--muted);font-size:13px}
.cf{padding:18px 24px 32px;display:grid;grid-template-columns:1fr 1fr;gap:16px 14px}
.cf .full{grid-column:1/-1}
.cf .fld{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--faint);min-width:0}
.cf .fld>span:first-child{font:600 13px "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cf .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}
.cf .row input[type=number]{width:84px}
.cf .row input[type=date]{width:150px}
.cf .row input.unit{width:120px}
.cf textarea{min-height:60px;resize:vertical}
.cf .help{font-size:12px;color:var(--faint)}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pills button{font-size:12px;padding:5px 9px;border:1px solid var(--rule-strong);border-radius:2px;color:var(--muted)}
.pills button:hover{color:var(--ink)}
.pills button[aria-pressed="true"]{border-color:var(--near);color:var(--ink);background:color-mix(in srgb,var(--near) 14%,transparent)}
.preview{grid-column:1/-1;border:1px solid var(--rule-strong);border-left:3px solid var(--g);border-radius:3px;padding:12px 14px;background:var(--ground)}
.preview .k{font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.preview .t{font:600 18px/1.2 "Barlow Condensed";letter-spacing:.01em;margin:2px 0}
.preview .l{font-size:13px;color:var(--muted)}
.preview .l b{color:var(--ink);font-weight:600}
.cf-foot{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer;color:var(--muted);font-size:13px}
.chk input{accent-color:var(--near)}
.chk.block{align-items:flex-start;padding:6px 0}
.chk.block input{margin-top:3px}
.chk small{display:block;color:var(--faint);font-size:12px}

/* ---------- settings ---------- */
.settings{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 160px)}
.slist{border-right:1px solid var(--rule);padding:10px 0 30px}
.slist h4{font:600 13px/1 "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:18px 24px 6px}
.srow{display:grid;grid-template-columns:3px 1fr auto;gap:0 12px;align-items:center;width:100%;text-align:left;padding:9px 24px}
.srow:hover{background:var(--panel)}
.srow[aria-current="true"]{background:var(--raised)}
.srow .r3{width:3px;height:30px;border-radius:2px;background:var(--g,transparent)}
.srow.gen .r3{height:18px}
.srow .nm{font-size:14px;font-weight:600;line-height:1.3;display:block}
.srow .what{font-size:12px;color:var(--faint);line-height:1.3;display:block}
.srow.off .nm{color:var(--muted)}
.srow.off .r3{opacity:.25}
.srow svg{width:14px;height:14px;color:var(--faint)}
.slist .moreg{font-size:12px;color:var(--faint);padding:8px 24px}
.slist .moreg:hover{color:var(--ink)}
.profile{padding:22px 32px 64px;max-width:820px;min-width:0}
.ptitle{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--rule-strong)}
.ptitle h2{font:700 34px/1 "Barlow Condensed";margin:0;color:var(--g,var(--ink));letter-spacing:.01em}
.ptitle .studio{font-size:12px;color:var(--faint);padding-bottom:3px}
.switch{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.sw{width:34px;height:20px;border-radius:10px;background:var(--rule-strong);position:relative;transition:background .14s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .14s,background .14s}
.sw[aria-checked="true"]{background:color-mix(in srgb,var(--g,var(--near)) 70%,var(--ground))}
.sw[aria-checked="true"]::after{transform:translateX(14px);background:var(--ink-strong)}
.pdesc{color:var(--muted);font-size:13.5px;margin:14px 0 0;max-width:62ch}
.comp{margin:14px 0 8px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.comp button{padding:12px 12px 11px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;border:1px solid var(--rule-strong);border-radius:3px;position:relative}
.comp button:hover{border-color:var(--muted)}
.comp button[aria-pressed="true"]{background:color-mix(in srgb,var(--g) 14%,transparent);border-color:color-mix(in srgb,var(--g) 70%,transparent)}
.comp button[data-st="some"]{border-style:dashed;border-color:color-mix(in srgb,var(--g) 70%,transparent)}
.comp button[disabled]{opacity:.4;cursor:default}
.comp .cbx{position:absolute;top:12px;right:12px;width:16px;height:16px;border-radius:3px;border:1px solid var(--rule-strong);display:grid;place-items:center}
.comp button[aria-pressed="true"] .cbx{background:var(--g);border-color:var(--g)}
.comp button[data-st="some"] .cbx::after{content:"";width:8px;height:2px;background:var(--g)}
.comp .cbx svg{width:11px;height:11px;stroke:var(--ground);stroke-width:3;fill:none}
.comp .ln{font:600 17px/1.1 "Barlow Condensed";letter-spacing:.02em;display:block;padding-right:22px}
.comp .ls{font-size:11.5px;color:var(--faint);display:block;margin-top:3px;line-height:1.3}
.compnote{font-size:12px;color:var(--faint);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.compnote button{color:var(--near)}
.grp{margin-top:30px}
.grp h3{display:flex;gap:10px;align-items:baseline;font:700 18px "Barlow Condensed";letter-spacing:.02em;margin:0;padding-bottom:6px;border-bottom:1px solid var(--rule-strong);flex-wrap:wrap}
.grp h3 span{font:400 12px Barlow;color:var(--faint);letter-spacing:0}
.trow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.trow .lbl{font-weight:500;line-height:1.3;min-width:0}
.trow .lbl small{display:block;color:var(--faint);font-size:12px;font-weight:400}
.srvrow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.srvrow .tagn{font:600 12px "Barlow Condensed";letter-spacing:.06em;color:var(--faint);text-transform:uppercase;width:58px}
.srvrow .clock{font-size:13px;color:var(--muted);line-height:1.45}
.srvrow .clock b{color:var(--ink);font-weight:600}
.srvrow .clock .nx{font:600 14px "Barlow Condensed";color:var(--ink)}
.srvrow .r{display:flex;gap:8px;align-items:center}
.about{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin-top:10px;font-size:13px}
.about .k{color:var(--faint);font-size:12px}
.about a{color:var(--near)}
.soon-note{margin-top:12px;font-size:12px;color:var(--faint);border:1px dashed var(--rule-strong);border-radius:3px;padding:10px 12px}
.viewpick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.vcard{border:1px solid var(--rule-strong);border-radius:4px;padding:14px;text-align:left}
.vcard:hover{border-color:var(--muted)}
.vcard[aria-pressed="true"]{border-color:var(--near);background:color-mix(in srgb,var(--near) 8%,transparent)}
.vcard b{display:block;font:700 20px "Barlow Condensed";letter-spacing:.02em;margin-top:10px}
.vcard small{color:var(--faint);font-size:12px}
.vprev{height:62px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.vprev.list i{display:block;height:7px;border-radius:1px;background:linear-gradient(90deg,var(--soon) 0 18%,var(--rule) 18%)}
.vprev.list i:nth-child(2){background:linear-gradient(90deg,var(--near) 0 46%,var(--rule) 46%);width:86%}
.vprev.list i:nth-child(3){background:linear-gradient(90deg,var(--calm) 0 70%,var(--rule) 70%);width:72%}
.vprev.tl{position:relative}
.vprev.tl i{position:absolute;height:12px;border-radius:2px;border-left:3px solid var(--g);background:color-mix(in srgb,var(--g) 30%,transparent)}
.vprev.tl em{position:absolute;top:0;bottom:0;left:46%;width:1px;background:var(--critical)}

/* ---------- archive (three variants) ---------- */
.filters{display:flex;gap:12px;padding:14px 24px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--rule-strong)}
.month{padding:18px 24px 6px;font:700 20px "Barlow Condensed";letter-spacing:.02em;border-bottom:1px solid var(--rule-strong);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.month span{font:400 12px Barlow;color:var(--faint)}
.st{font-size:12px;font-weight:500;padding:1px 7px;border-radius:2px;white-space:nowrap}
.st.done{color:var(--near);background:color-mix(in srgb,var(--near) 15%,transparent)}
.st.ignored{color:var(--muted);border:1px dashed var(--rule-strong)}
.st.expired{color:var(--critical);background:color-mix(in srgb,var(--critical) 12%,transparent)}
.amark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none}
.amark svg{width:13px;height:13px}
.amark.done{background:var(--g);color:var(--ground)}
.amark.ignored{border:1px dashed var(--faint);color:var(--faint)}
.amark.expired{border:1.5px solid var(--critical);color:var(--critical)}
.ach{font-size:12.5px;color:var(--muted)}
.ach.done{color:var(--ink)}
.ach.expired{color:var(--critical)}
.ach.ignored{color:var(--faint)}
.stack{display:flex;height:6px;border-radius:1px;overflow:hidden;background:var(--rule);flex:1;min-width:40px}
.stack.mini{flex:none;width:90px;height:4px;align-self:center}
.stack i{display:block;height:100%}
.s-done{background:var(--near)}
.s-expired{background:var(--critical)}
.s-ignored{background:var(--rule-strong)}
/* progress glyphs */
.pips{display:flex;gap:2px;flex-wrap:wrap;max-width:190px}
.pips i{width:6px;height:10px;border-radius:1px;background:var(--rule)}
.pips i.on{background:var(--g)}
.pips.expired i:not(.on){background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--critical) 55%,transparent)}
.pips.ignored i.on{background:var(--faint)}
.pips.big{max-width:none;gap:4px}
.pips.big i{width:auto;flex:1;min-width:8px;max-width:30px;height:22px;border-radius:2px}
.pips.stages.big i{max-width:44px}
.pips-ax{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--faint);margin-top:6px}
.abar{width:150px;height:8px;border-radius:1px;background:var(--rule);position:relative;overflow:hidden}
.abar i{position:absolute;inset:0 auto 0 0;width:var(--f);background:var(--g)}
.abar.expired{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--critical) 55%,transparent)}
.abar.big{width:100%;height:20px;border-radius:2px}
.keepnote{font-size:12px;color:var(--faint);margin:10px 0 0}
.sidep-viz{margin:14px 0 4px}

/* 1 · ledger */
.v1-stats{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);border-bottom:1px solid var(--rule-strong)}
.v1-figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-right:1px solid var(--rule)}
.v1-figs>div{padding:16px 20px;border-right:1px solid var(--rule);display:flex;flex-direction:column}
.v1-figs>div:last-child{border-right:0}
.v1-figs b{font:700 34px/1 "Barlow Condensed";color:var(--ink)}
.v1-figs b small{font-size:20px;color:var(--muted);margin-left:1px}
.v1-figs span{font-size:12.5px;color:var(--muted);margin-top:4px}
.v1-figs em{font-style:normal;font-size:11.5px;color:var(--faint);margin-top:2px}
.v1-figs .warn b{color:var(--critical)}
.v1-games{padding:12px 20px;display:flex;flex-direction:column;gap:5px}
.v1-g{display:grid;grid-template-columns:72px 1fr 34px;gap:10px;align-items:center;text-align:left;padding:2px 4px;border-radius:2px}
.v1-g:hover{background:var(--panel)}
.v1-g[aria-pressed="true"]{background:var(--raised)}
.v1-g .nm{font-weight:600;font-size:12.5px;color:var(--g)}
.v1-g .ct{font-size:12px;color:var(--muted);text-align:right}
.v1-key{margin:4px 0 0;font-size:11px;color:var(--faint)}
.v1-key i{display:inline-block;width:8px;height:8px;border-radius:1px;margin:0 3px 0 6px;vertical-align:-1px}
.v1-key i:first-child{margin-left:0}
.v1row{display:grid;grid-template-columns:22px 92px minmax(0,1fr) 210px 110px;gap:14px;align-items:center;width:100%;text-align:left;padding:11px 24px;border-bottom:1px solid var(--rule);position:relative}
.v1row:hover{background:var(--panel)}
.v1row .tt{min-width:0;display:flex;flex-direction:column}
.v1row .ti{font-weight:500;font-size:15px}
.v1row .v1-res{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.v1row .v1-res b{font-size:17px;font-weight:700;min-width:62px;text-align:right}
.v1row .when{font-size:12px;color:var(--faint);white-space:nowrap;text-align:right}
.v1row.done .v1-res b{color:var(--ink)}
.v1row.expired{background:color-mix(in srgb,var(--critical) 5%,transparent);box-shadow:inset 3px 0 0 var(--critical)}
.v1row.expired .v1-res b{color:var(--critical)}
.v1row.ignored .ti{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.v1row.ignored .gcell{opacity:.5}
.v1row.ignored{color:var(--muted)}
.gcell small{font-size:11px}

/* 2 · by game and version */
.v2{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:60vh}
.v2-side{border-right:1px solid var(--rule-strong);padding:10px 0;display:flex;flex-direction:column}
.v2-si{display:grid;gap:3px;text-align:left;padding:10px 20px;border-left:3px solid transparent}
.v2-si:hover{background:var(--panel)}
.v2-si[aria-pressed="true"]{background:var(--raised);border-left-color:var(--g,var(--ink))}
.v2-si .nm{font-weight:600;font-size:14px}
.v2-si small{font-size:12px;color:var(--faint)}
.v2-si .stack.mini{width:100%;margin-top:3px}
.v2-main{min-width:0;padding-bottom:30px}
.v2-gh{font:700 24px "Barlow Condensed";margin:0;padding:20px 24px 4px;color:var(--g)}
.v2-ver{margin:14px 24px 6px;border:1px solid var(--rule-strong);border-radius:4px;overflow:hidden}
.v2-vh{display:flex;gap:14px;align-items:baseline;padding:12px 16px 8px;flex-wrap:wrap}
.v2-vn{font:700 22px/1 "Barlow Condensed";color:var(--g)}
.v2-vs{font-size:13px;color:var(--muted)}
.v2-vs b{color:var(--ink);font-weight:600}
.v2-vd{margin-left:auto;font-size:12px;color:var(--faint)}
.v2-meter{display:flex;gap:3px;padding:0 16px 12px}
.v2-meter i{flex:1;height:10px;border-radius:1px;max-width:40px}
.v2-meter i.done{background:var(--g)}
.v2-meter i.expired{box-shadow:inset 0 0 0 1.5px var(--critical)}
.v2-meter i.ignored{background:repeating-linear-gradient(135deg,var(--rule-strong) 0 2px,transparent 2px 5px)}
.v2row{display:grid;grid-template-columns:22px minmax(0,1fr) auto 104px 16px;gap:12px;align-items:center;width:100%;text-align:left;padding:9px 16px;border-top:1px solid var(--rule)}
.v2row:hover{background:var(--panel)}
.v2row .ti{font-weight:500;font-size:14px}
.v2row.ignored .ti{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.v2row .when{font-size:12px;color:var(--faint);text-align:right;white-space:nowrap}
.v2row .go{color:var(--faint)}
.v2-page{max-width:820px;padding:20px 24px 50px}
.v2-back{display:inline-flex;gap:4px;align-items:center;margin-bottom:16px;color:var(--muted)}
.v2-title{font:700 40px/1.02 "Barlow Condensed";margin:4px 0 6px}
.v2-big{font:600 18px "Barlow Condensed";letter-spacing:.01em;margin:0 0 18px}
.v2-strip{border:1px solid var(--rule-strong);border-radius:4px;padding:12px 14px 10px;margin-bottom:18px}
.v2-axis{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-bottom:8px}
.v2-track{position:relative;height:30px;background:var(--panel);border-radius:2px}
.v2-track .sib{position:absolute;top:21px;height:5px;border-radius:1px;background:color-mix(in srgb,var(--g) 30%,transparent)}
.v2-track .sib.expired{background:color-mix(in srgb,var(--critical) 40%,transparent)}
.v2-track .sib.ignored{background:var(--rule-strong)}
.v2-track .me{position:absolute;top:3px;height:16px;border-radius:2px;background:var(--g);display:flex;align-items:center;overflow:hidden}
.v2-track .me.expired{background:transparent;box-shadow:inset 0 0 0 1.5px var(--critical)}
.v2-track .me.ignored{background:transparent;box-shadow:inset 0 0 0 1px var(--faint)}
.v2-track .me span{font-size:11px;font-weight:600;color:var(--ground);padding:0 6px;white-space:nowrap}
.v2-track .me.expired span,.v2-track .me.ignored span{color:var(--muted)}
.v2-track em{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--critical)}
.v2-cap{font-size:11.5px;color:var(--faint);margin:8px 0 0}
.v2-h3{font:600 13px "Barlow Condensed";letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
.v2-viz{margin-bottom:6px}
.v2-page .desc{font-size:15px;line-height:1.6;margin:16px 0}
.v2-page .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}

/* 3 · history */
.v3-key{font-size:11.5px;color:var(--faint);display:flex;align-items:center;gap:4px;margin-left:auto}
.v3-key .k{display:inline-block;width:18px;height:8px;border-radius:1px;margin-left:8px}
.v3-key .k.done{background:var(--near)}
.v3-key .k.expired{box-shadow:inset 0 0 0 1.5px var(--critical);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--critical) 30%,transparent) 0 2px,transparent 2px 5px)}
.v3-key .k.ignored{box-shadow:inset 0 0 0 1px var(--faint)}
.v3-board{padding:6px 24px 14px;border-bottom:1px solid var(--rule-strong)}
.v3-axis,.v3-lane,.v3-dens{display:grid;grid-template-columns:76px minmax(0,1fr)}
.v3-ln{font-size:12px;font-weight:600;color:var(--g,var(--faint));padding-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v3-lt{position:relative}
.v3-axis .v3-lt{height:26px;border-bottom:1px solid var(--rule-strong)}
.v3-axis .wk{position:absolute;bottom:0;height:6px;width:1px;background:var(--rule-strong)}
.v3-axis .mo{position:absolute;top:4px;font:600 13px "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-left:4px;border-left:1px solid var(--rule-strong)}
.v3-axis .nowtag{position:absolute;top:2px;transform:translateX(-50%);font-size:10.5px;font-weight:600;color:var(--critical);background:var(--ground);padding:0 3px}
.v3-lanes{position:relative}
.v3-lanes::after{content:"";position:absolute;top:0;bottom:0;left:calc(76px + (100% - 76px) * var(--n) / 100);width:1px;background:color-mix(in srgb,var(--critical) 60%,transparent);pointer-events:none}
.v3-lane{border-bottom:1px solid var(--rule)}
.v3-lane .v3-lt{height:calc(var(--rows) * 20px + 8px);overflow:hidden}
.v3-bar{position:absolute;height:16px;border-radius:2px;overflow:hidden;display:flex;align-items:center;transition:filter .12s,box-shadow .12s}
.v3-bar span{font-size:10.5px;font-weight:600;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v3-bar.done{background:color-mix(in srgb,var(--g) 78%,transparent);color:var(--ground)}
.v3-bar.expired{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--critical) 26%,transparent) 0 3px,transparent 3px 7px);box-shadow:inset 0 0 0 1.5px var(--critical);color:var(--ink)}
.v3-bar.ignored{box-shadow:inset 0 0 0 1px var(--faint);color:var(--faint)}
.v3-bar.hl,.v3-bar:hover{filter:brightness(1.25);box-shadow:0 0 0 2px var(--ink);z-index:2}
.v3-dens .v3-ln{color:var(--faint);font-weight:500}
.v3-dens .v3-lt{height:30px;border-top:1px solid var(--rule)}
.v3-dens i{position:absolute;bottom:2px;background:var(--near);opacity:.7;border-radius:1px 1px 0 0}
.v3-list{padding-bottom:20px}
.v3row{display:grid;grid-template-columns:22px 92px minmax(0,1fr) 110px;gap:14px;align-items:center;width:100%;text-align:left;padding:9px 24px;border-bottom:1px solid var(--rule)}
.v3row .tt{display:flex;flex-direction:column;min-width:0}
.v3row .ti{font-weight:500;font-size:14px}
.v3row.ignored .ti{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.v3row .when{font-size:12px;color:var(--faint);text-align:right;white-space:nowrap}
.v3row:hover,.v3row.hl{background:var(--raised)}
.sidep{position:fixed;top:40px;right:0;bottom:0;width:min(440px,100vw);z-index:31;background:var(--panel);border-left:1px solid var(--rule-strong);overflow:auto;padding:22px 24px 40px;box-shadow:-12px 0 30px rgb(0 0 0 / .3)}
.sidep h2{font:700 28px/1.05 "Barlow Condensed";margin:4px 0 8px}
.sidep .x{float:right;color:var(--muted)}
.sidep .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.sidep .pips.big i{height:18px}

@media (max-width:860px){
  .v1-stats{grid-template-columns:1fr}
  .v1-figs{grid-template-columns:1fr 1fr;border-right:0;border-bottom:1px solid var(--rule)}
  .v1-figs>div{padding:12px 16px;border-bottom:1px solid var(--rule)}
  .v1-figs>div:nth-child(2n){border-right:0}
  .v1-games{padding:12px 16px}
  .v1row{grid-template-columns:22px minmax(0,1fr) auto;padding:11px 16px}
  .v1row .gc2,.v1row .when{display:none}
  .v1row .v1-res .pips,.v1row .v1-res .abar{display:none}
  .v1row .v1-res b{min-width:0;font-size:15px}
  .v2{grid-template-columns:1fr}
  .v2-side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--rule-strong);padding:0}
  .v2-si{flex:none;border-left:0;border-bottom:3px solid transparent;padding:10px 14px}
  .v2-si[aria-pressed="true"]{border-bottom-color:var(--g,var(--ink))}
  .v2-si .stack.mini{width:80px}
  .v2-ver{margin:12px 16px 4px}
  .v2-gh{padding:16px 16px 0}
  .v2row{grid-template-columns:22px minmax(0,1fr) 16px;row-gap:2px}
  .v2row .ach{grid-column:2;grid-row:2}
  .v2row .when{display:none}
  .v2row .go{grid-row:1/3;grid-column:3}
  .v2-page{padding:16px 16px 40px}
  .v2-title{font-size:32px}
  .v3-board{padding:6px 16px 12px}
  .v3-axis,.v3-lane,.v3-dens{grid-template-columns:56px minmax(0,1fr)}
  .v3-lanes::after{left:calc(56px + (100% - 56px) * var(--n) / 100)}
  .v3-bar span{display:none}
  .v3-key{margin-left:0}
  .v3row{grid-template-columns:22px minmax(0,1fr);padding:9px 16px}
  .v3row .gc2,.v3row .when{display:none}
}
.dsheet{width:min(560px,calc(100vw - 32px))!important;max-height:calc(100vh - 80px);overflow:auto}
.dsheet .desc{font-size:14px;color:var(--ink);margin:12px 0;line-height:1.55}
.dl2{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;font-size:13px;margin:14px 0;padding:12px 0;border-block:1px solid var(--rule)}
.dl2 dt{color:var(--faint)}
.dl2 dd{margin:0;color:var(--muted)}
.dl2 dd b{color:var(--ink);font-weight:600}
.saved{font-size:12px;color:var(--faint);border-left:2px solid var(--rule-strong);padding:4px 10px;margin-top:8px}
.saved a{color:var(--near);word-break:break-all}

/* ---------- timeline ---------- */
.tl-ctl{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--rule)}
.tl-ctl .chk{font-size:12.5px}
.tlwrap{overflow:auto;max-height:calc(100vh - 230px);position:relative;border-top:1px solid var(--rule-strong)}
.board{position:relative}
.axis{position:sticky;top:0;z-index:6;display:flex;background:var(--ground);border-bottom:1px solid var(--rule-strong)}
.axis .corner{position:sticky;left:0;z-index:7;background:var(--ground);border-right:1px solid var(--rule);flex:none}
.axis .day{flex:none;font-size:11px;color:var(--faint);padding:8px 0 6px 6px;border-left:1px solid var(--rule);line-height:1.2}
.axis .day b{display:block;font:600 14px "Barlow Condensed";color:var(--muted)}
.axis .day.wk b{color:var(--ink)}
.grpl{position:sticky;left:0;z-index:4;display:inline-block;font:600 13px "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:12px 12px 6px 24px}
.grpl small{font:400 12px Barlow;text-transform:none;letter-spacing:0;margin-left:8px}
.lane{display:flex;border-top:1px solid var(--rule);position:relative}
.lane .nm{position:sticky;left:0;z-index:3;flex:none;background:var(--ground);border-right:1px solid var(--rule);padding:0 10px 0 24px;display:flex;align-items:center;font-weight:600;font-size:13px;color:var(--g);line-height:1.2;overflow:hidden}
.lane .nm::before{content:"";width:3px;height:60%;max-height:26px;border-radius:2px;background:var(--g);margin-right:10px;flex:none}
.lane .nm small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.lane .tr{position:relative;flex:none}
.resets{background:color-mix(in srgb,var(--panel) 70%,transparent);border-bottom:1px solid var(--rule-strong)}
.resets .lane .nm{background:var(--panel)}
.gridcol{position:absolute;top:0;bottom:0;width:1px;background:var(--rule);opacity:.55}
.gridcol.wk{opacity:1;background:var(--rule-strong)}
.bar{position:absolute;height:30px;border-radius:3px;background:color-mix(in srgb,var(--g) 22%,var(--panel));border-left:3px solid var(--g);font-size:12px;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:var(--ink)}
.bar .ey{font:600 10.5px "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;color:var(--g);margin-right:6px}
.bar.ns{background:color-mix(in srgb,var(--g) 11%,var(--panel));border-left-style:dashed}
.bar.open{-webkit-mask-image:linear-gradient(90deg,#000 60%,transparent);mask-image:linear-gradient(90deg,#000 60%,transparent)}
.bar.clip{-webkit-mask-image:linear-gradient(90deg,transparent,#000 22px);mask-image:linear-gradient(90deg,transparent,#000 22px);padding-left:14px}
.bar.own{outline:1px dashed color-mix(in srgb,var(--g) 55%,transparent);outline-offset:-1px}
/* routine on the timeline: a slim outlined pill spanning its current period, filled to progress, capped at the reset */
.rbar{position:absolute;height:20px;border-radius:10px;border:1px solid color-mix(in srgb,var(--g) 70%,transparent);background:transparent;overflow:visible;cursor:pointer}
.rbar .fill{position:absolute;inset:0 auto 0 0;border-radius:10px 0 0 10px;background:color-mix(in srgb,var(--g) 30%,transparent)}
.rbar.met .fill{border-radius:10px;background:color-mix(in srgb,var(--g) 18%,transparent)}
.rbar .lab{position:absolute;left:9px;top:0;right:22px;font:600 12px/18px "Barlow Condensed";letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.rbar.met .lab{color:var(--muted)}
.rbar .cap{position:absolute;right:-1px;top:-4px;bottom:-4px;width:2px;background:var(--g);border-radius:1px}
.rbar .rs{position:absolute;right:5px;top:3px;width:12px;height:12px;color:var(--g)}
.rbar.met .rs{color:var(--muted)}
.rbar .out{position:absolute;left:calc(100% + 8px);top:0;font:600 12px/18px "Barlow Condensed";letter-spacing:.02em;white-space:nowrap;color:var(--muted)}
.rbar.clipped{border-left-color:transparent;border-radius:0 10px 10px 0}
.rghost{position:absolute;height:20px;border-radius:10px;border:1px dashed color-mix(in srgb,var(--g) 32%,transparent);pointer-events:none}
.now{position:absolute;top:0;bottom:0;width:1px;background:var(--critical);z-index:2;pointer-events:none}
.nowchip{position:absolute;top:2px;transform:translateX(-50%);background:var(--critical);color:#fff;font:600 11px/1 "Barlow Condensed";padding:3px 5px;border-radius:2px;letter-spacing:.04em;z-index:8}
.tl-legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--faint);align-items:center;padding:12px 24px}
.tl-legend i{display:inline-block;vertical-align:-3px;margin-right:6px}

/* ---------- onboarding ---------- */
.ob{max-width:820px;margin:0 auto;padding:40px 24px 80px}
.ob .step{font-size:12px;color:var(--faint);margin-bottom:8px}
.ob h1{font:700 44px/1.02 "Barlow Condensed";margin:0 0 10px}
.ob .lede{color:var(--muted);max-width:58ch;margin:0 0 24px}
.gpick{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule)}
.gpick button{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--rule);text-align:left;color:var(--muted)}
.gpick button:nth-child(odd){border-right:1px solid var(--rule)}
.gpick button .sw2{width:12px;height:12px;border-radius:2px;border:1px solid var(--g);flex:none}
.gpick button[aria-pressed="true"]{color:var(--ink);background:color-mix(in srgb,var(--g) 9%,transparent)}
.gpick button[aria-pressed="true"] .sw2{background:var(--g)}
.gpick button:hover{color:var(--ink)}
.ob-foot{display:flex;gap:12px;align-items:center;margin-top:28px;flex-wrap:wrap}
.ob-foot .cnt{color:var(--faint);font-size:13px;flex:1}
.mtx{width:100%;border-collapse:collapse;margin-top:6px}
.mtx th{font:600 13px "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;color:var(--faint);text-align:center;padding:6px 4px;border-bottom:1px solid var(--rule-strong)}
.mtx th:first-child{text-align:left}
.mtx td{padding:8px 4px;border-bottom:1px solid var(--rule);text-align:center}
.mtx td:first-child{text-align:left;font:600 15px "Barlow Condensed";letter-spacing:.02em;color:var(--g)}
.mtx tr.all td{background:var(--panel)}
.mtx tr.all td:first-child{color:var(--ink);padding-left:8px}
.mtx td small{display:block;font:400 11.5px Barlow;color:var(--faint);letter-spacing:0}
.tg{width:30px;height:30px;border-radius:3px;border:1px solid var(--rule-strong);display:inline-grid;place-items:center}
.tg svg{width:14px;height:14px;stroke:var(--ground);stroke-width:3;fill:none;opacity:0}
.tg[aria-pressed="true"]{background:var(--g,var(--near));border-color:var(--g,var(--near))}
.tg[aria-pressed="true"] svg{opacity:1}
.tg[disabled]{opacity:.25;cursor:default}
.tg[data-mixed="true"]{border-style:dashed;border-color:var(--muted)}

/* ---------- sheets ---------- */
.sheet{position:fixed;z-index:31;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--rule-strong);border-radius:6px;padding:22px 24px}
.sheet h2{font:700 26px/1.05 "Barlow Condensed";margin:4px 0 8px}
.sheet .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.clog{width:min(620px,calc(100vw - 32px))!important;max-height:calc(100vh - 80px);overflow:auto;padding:0!important}
.clog-h{display:flex;justify-content:space-between;align-items:center;padding:18px 24px 10px;position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--rule)}
.clog-h h2{margin:0}
.rel{padding:16px 24px 18px;border-bottom:1px solid var(--rule)}
.rel .d{font:600 12px "Barlow Condensed";letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.rel h3{font:700 19px/1.15 "Barlow Condensed";margin:4px 0 6px;letter-spacing:.01em}
.rel p{margin:0 0 8px;color:var(--muted);font-size:13.5px}
.rel ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}

/* ---------- why panel ---------- */
.why{position:fixed;top:40px;left:0;bottom:0;width:min(500px,100vw);z-index:40;background:#f6f2e6;color:#232323;border-right:2px dashed #b9b29a;overflow:auto;padding:22px 24px 40px;font:400 14px/1.55 system-ui,sans-serif}
.why h2{font:700 18px system-ui;margin:0 0 8px}
.why h3{font:700 14px system-ui;margin:20px 0 6px}
.why code,.why pre{font:12px/1.5 ui-monospace,Menlo,monospace;background:#ebe5d3;border-radius:3px}
.why code{padding:1px 4px}
.why pre{padding:10px;overflow:auto;white-space:pre}
.why ul{padding-left:18px;margin:6px 0}
.why .x{float:right;border:1px solid #c4bda4;border-radius:3px;padding:3px 8px;background:#fff}
.why .flag{background:#fbe3c4;border-left:3px solid #c77a12;padding:8px 10px;margin:10px 0;font-size:13px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--raised);border:1px solid var(--rule-strong);border-radius:4px;padding:10px 14px;z-index:45;font-size:13px;display:flex;gap:12px;box-shadow:0 8px 24px rgb(0 0 0 / .35);max-width:calc(100vw - 32px)}

@media (max-width:860px){
  .ev,.settings{grid-template-columns:1fr}
  .rail,.slist{border-right:0}
  .slist{border-bottom:1px solid var(--rule-strong)}
  .mcell,table.led .h-meter{display:none}
  table.led .h-game,table.led td.gc{display:none}
  .gsm{display:block;font-size:12px;font-weight:600;color:var(--g)}
  table.rt{table-layout:auto}
  table.rt td:first-child,table.rt th:first-child,table.rt .c-cyc,table.rt .h-prog,table.rt .h-t{display:none}
  table.rt td:nth-child(2){padding-left:16px}
  table.rt .c-pin{width:auto;padding:10px 2px}
  table.rt .c-k{padding-right:12px}
  .pinlbl span{display:none}
  .prog{width:auto}
  .amt .bar{display:none}
  .amt .num{min-width:0;font-size:14px}
  .gpick{grid-template-columns:1fr}
  .gpick button:nth-child(odd){border-right:0}
  header.top{gap:12px;padding:12px 16px 0;flex-wrap:wrap}
  .mark{padding-bottom:4px}
  nav.tabs{overflow-x:auto;width:100%}
  nav.tabs button{padding:10px 10px 12px}
  .big{font-size:52px}
  .band-h .reset .v{font-size:26px}
  .ob h1{font-size:34px}
  .profile{padding:20px 16px 48px}
  .comp{grid-template-columns:1fr 1fr}
  .cf{grid-template-columns:1fr;padding:16px}
  .focusrow,.ledger-h,.rt-top,.band-h,.head,.wn,.tl-ctl,.hintbar,.filters,.arc-sum,.month,.tl-legend,footer.foot{padding-left:16px;padding-right:16px}
  .pinned-h,.pinned .hint,.gblock-h,.rail-foot,.pinned .empty{padding-left:16px;padding-right:16px}
  .gitems{padding:0 16px 10px 31px}
  .wn li{grid-template-columns:1fr}
  .wn li .kind{display:none}
  .arow{grid-template-columns:22px 1fr auto;padding:12px 16px}
  .arow .gc2,.arow .when{display:none}
  .srvrow{grid-template-columns:1fr;gap:6px}
  .about{grid-template-columns:1fr}
  .viewpick{grid-template-columns:1fr}
  .li{padding-left:16px;padding-right:16px}
  .lane .nm{padding-left:12px}
  .mtx th{font-size:11px}
  .rt-top{flex-direction:column;align-items:flex-start;gap:10px}
}
@media (min-width:861px){ .gsm,.gsmi{display:none} }
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:slide .18s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:.6}}
}
/* Round 4: the timetable identity, with room for the reading view. */
:root{--faint:#9ca7b7;--muted:#afb8c7;--success:#6ccbad;--review-accent:#e7dcbb}
:root[data-theme="light"]{--faint:#596271;--muted:#485365;--success:#26705b}
::selection{background:var(--near);color:var(--ground)}
input,textarea{caret-color:var(--near)}
*{scrollbar-color:var(--rule-strong) var(--ground);scrollbar-width:thin}
.shell{max-width:1480px}
.ev{grid-template-columns:300px minmax(0,1fr)}
.ledger-h{padding:30px 32px 22px;gap:20px;flex-wrap:wrap}
.ledger-h h2{font-size:28px}
.list-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.seg button{min-height:36px}
.focusrow{padding-top:16px;padding-bottom:16px;gap:8px}
.standard-events{padding:0 32px}
.event-entry{display:grid;grid-template-columns:minmax(0,1fr) 130px 16px;align-items:center;gap:24px;text-align:left;width:100%;border-bottom:1px solid var(--rule);padding:24px 0;max-height:260px;overflow:hidden;transition:opacity .3s ease,max-height .35s ease,padding .35s ease}
.event-entry:hover{background:var(--surface)}
.event-entry .identity{font-size:12px;color:var(--g);display:block;margin-bottom:7px}
.event-entry .event-title{display:block;font-size:18px;font-weight:500;line-height:1.4;text-wrap:pretty}
.event-entry .event-description{display:block;color:var(--muted);font-size:13px;margin-top:7px;line-height:1.6;max-width:65ch}
.event-entry .deadline{text-align:right;font:600 22px/1.3 "Barlow Condensed",sans-serif}
.event-entry .deadline small{display:block;font:400 12px/1.5 Barlow,sans-serif;color:var(--muted);margin-top:5px}
.deadline.calm,.cd.calm{color:var(--muted)}
.deadline.near{color:var(--near)}
.deadline.soon{color:var(--soon)}
.deadline.critical{color:var(--critical)}
.event-entry .meter{margin-top:12px}
.event-entry svg{width:16px;height:16px;color:var(--muted)}
.archive-confirm{display:block!important;color:var(--success)!important;font-size:13px!important;margin-top:9px}
.archiving{background:var(--surface);pointer-events:none}
.event-entry.fading{opacity:0;max-height:0;padding-top:0;padding-bottom:0;border-bottom:0}
tr.fading{opacity:0;transition:opacity .3s ease}
.code-notice{padding:10px 32px;border-bottom:1px solid var(--rule);font-size:13px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--surface)}
.code-notice button{color:var(--near);text-decoration:underline;text-underline-offset:4px;min-height:32px}
.new-code{font-size:11px;color:var(--near);margin-left:5px}
.subtabs{display:flex;gap:24px;border-bottom:1px solid var(--rule);margin:20px 0 28px}
.subtabs button{padding:12px 0;border-bottom:2px solid transparent;color:var(--muted)}
.subtabs button[aria-current="page"]{color:var(--ink);border-color:var(--ink)}
.code-item{padding:24px 0;border-bottom:1px solid var(--rule)}
.code-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.code-title code{font-size:17px;overflow-wrap:anywhere}
.code-item p{color:var(--muted);margin:8px 0}
.code-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.code-actions button[aria-pressed="true"]{background:var(--raised);color:var(--success)}
.muted-copy{color:var(--muted);line-height:1.65;max-width:70ch}
.source-note{font-size:12px;color:var(--muted);margin:20px 0;line-height:1.6}
.type-guide{margin:24px 0;display:grid;grid-template-columns:1fr 1fr;gap:18px 28px}
.type-guide dt{font-weight:600;margin-bottom:3px}
.type-guide dd{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.matrix-scroll{overflow-x:auto}
.server-setup{padding:24px;background:var(--surface);margin-top:16px}
.server-setup h3{margin-top:0}
.server-choices{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.server-choices button{padding:10px 14px;border:1px solid var(--rule-strong)}
.server-choices button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.archive-view{display:flex;gap:16px;align-items:center;padding:24px 32px 0;flex-wrap:wrap}
.story{margin:24px 32px 30px;padding:24px 0;border-block:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;gap:24px}
.story h2{font-size:24px;margin:0 0 8px}
.story p{margin:0;color:var(--muted);max-width:65ch;line-height:1.65}
.story dl{display:flex;gap:28px;margin:0;align-items:center}
.story dt{font-size:12px;color:var(--muted)}
.story dd{font:600 28px "Barlow Condensed";margin:0 0 4px}
.timeline-scroller{overflow:auto;max-height:72vh;border-block:1px solid var(--rule);margin-top:16px;position:relative}
.timeline-board{position:relative;isolation:isolate}
.time-axis,.timeline-entry,.game-separator{display:grid;grid-template-columns:250px 1fr}
.time-axis{position:sticky;top:0;z-index:8;background:var(--ground);height:42px;border-bottom:1px solid var(--rule)}
.time-axis>strong{padding:12px 20px;position:sticky;left:0;background:var(--ground);z-index:9;font-size:12px}
.time-axis .ticks{position:relative;font-size:12px;color:var(--muted)}
.time-axis .ticks span{position:absolute;top:12px}
.timeline-entry{height:56px;border-bottom:1px solid var(--rule);position:relative}
.timeline-name{position:sticky;left:0;z-index:4;padding:9px 16px;background:var(--ground);font-size:13px;line-height:1.4;display:block;text-align:left;border-right:1px solid var(--rule);overflow:hidden}
.timeline-name small{display:block;color:var(--muted);font-size:11px}
.time-track{position:relative;background-image:linear-gradient(to right,var(--rule) 1px,transparent 1px);background-size:60px 100%}
.period-block{position:absolute;top:12px;height:30px;background:color-mix(in srgb,var(--g) 20%,var(--ground));border:1px solid color-mix(in srgb,var(--g) 65%,var(--rule));text-align:left;padding:5px 8px;overflow:hidden;white-space:nowrap;font-size:12px;max-width:100%}
.period-block.routine{border-style:dashed;background:var(--surface)}
.period-block .fill{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--g) 20%,transparent);pointer-events:none}
.period-block span{position:relative}
.reset-mark{position:absolute;top:9px;bottom:9px;border-right:2px solid var(--g);pointer-events:none}
.game-separator{border-bottom:1px solid var(--rule-strong);background:var(--surface);height:38px;font-size:13px}
.game-separator strong{position:sticky;left:0;padding:9px 16px;background:var(--surface);z-index:5;color:var(--g)}
.game-separator span{padding:9px 12px;color:var(--muted)}
.reset-strip .timeline-entry{height:48px}
.reset-strip .period-block{top:8px}
.today-line{position:absolute;top:0;bottom:0;border-left:1px solid var(--near);pointer-events:none;z-index:3}
.timeline-help{padding:16px 24px;color:var(--muted);font-size:12px}
.review-note{font-size:12px;color:var(--muted);padding:12px 24px;border-bottom:1px solid var(--rule)}
.toast{display:flex;align-items:center;gap:24px;max-width:min(580px,calc(100vw - 32px));white-space:normal;z-index:60;pointer-events:none}
.toast button{font-weight:600;text-decoration:underline;text-underline-offset:4px;min-height:32px;pointer-events:auto}
.toast:not(.undo-note){bottom:80px}
.undo-note{bottom:20px}
.profile,.main,.v2-main,.body{min-width:0}
.sheet{max-height:calc(100dvh - 80px);overflow:auto}
.sheet svg{width:18px;height:18px}

function tickDays(id,span,got,status){
  if(!got)return[];
  let h=[...id].reduce((s,c)=>s*31+c.charCodeAt(0),7)>>>0;const rnd=()=>(h=(h*1103515245+12345)>>>0)/4294967296;

      <div class="big cond" style="color:${HEAT[heat(next.end-NOW)]}">${dur(next.end-NOW)}<small>left</small></div><div class="exact">Ends ${dateStr(next.end)}</div>${meter(next)}
      <ul class="then">${then.map(e=>`<li style="${gv(e.game)}"><span class="dot"></span><span class="t">${esc(e.title)}</span><span class="r" style="color:${e.end?HEAT[heat(e.end-NOW)]:"var(--faint)"}">${e.end?dur(e.end-NOW):"no end"}</span></li>`).join("")}</ul></section>`:`<section class="head"><p class="legend">Next to expire</p><p style="color:var(--muted)">Nothing running.</p></section>`}
    ${railPinned()}</aside>`;
  const rows=live.map(e=>{const ms=e.end?e.end-NOW:null;const h=heat(ms);return `<tr data-ev="${e.id}" tabindex="0" role="button" style="${gv(e.game)}"><td class="gc"><span class="gcell">${G[e.game].short}</span></td><td class="tcell"><span class="gsm">${G[e.game].short}</span>${esc(e.title)}${e.own?'<span class="tag own">yours</span>':""}</td><td class="mcell">${meter(e,30)}</td><td class="cd ${h}">${ms==null?"End unknown":dur(ms)}</td></tr>`}).join("");
  const cnt=g=>evs.filter(e=>g==="all"||e.game===g).length;
  return `<div class="ev">${rail}<section class="main">${whatsNew()}<div class="ledger-h"><div><h2>Running now</h2><div class="sub">${live.length} events${S.focus==="all"?` in ${S.games.length} games`:""} · sorted by what ends first</div></div><div class="seg"><button aria-pressed="true">Ending soonest</button><button aria-pressed="false" data-act="noop">Doing first</button></div></div>
    ${focusRow(cnt)}

    <div class="more">Done or ignored events leave this list and wait in the <button data-tab="archive">Archive</button>.</div></section></div>`}

// ============ routines ============
function pinBtn(i,p){const on=pinned(i.key,p);const what=p==="c"?"Checklist":"Timeline";return `<button class="pin" data-pin="${i.key}|${p}" aria-pressed="${on}" aria-label="${on?"Unpin from":"Pin to"} ${what}: ${esc(i.r.title)}" title="${on?"Shown in":"Show in"} ${what}">${p==="c"?ICON.list:ICON.bars}</button>`}
function routineRow(i){const r=i.r,met=isMet(i),v=val(i);let prog;
  if(r.measure.kind==="days"){prog=`<button class="tick" data-tick="${i.key}" aria-pressed="${met}"><span class="box">${ICON.check}</span>${r.measure.required>1?`${Math.min(v,r.measure.required)} of ${r.measure.required} days`:met?"Done":"To do"}</button>`}
  else if(S.editing===i.key){prog=`<form class="amt" data-amtform="${i.key}"><input type="number" min="0" name="v" value="${v}" autofocus aria-label="Amount"><span class="num">/ ${fmt(r.measure.target)}</span><button class="btn sm" type="submit">Save</button></form>`}
  else{const f=Math.min(1,v/r.measure.target);prog=`<button class="amt" data-amt="${i.key}" title="Enter an amount"><span class="bar ${f>=1?"full":""}"><i style="width:${f*100}%"></i></span><span class="num"><b>${fmt(v)}</b> / ${fmt(r.measure.target)} ${esc(r.measure.unit||"")}</span></button>`}
  const cyc=r.period.unit==="cycle"?`<span class="cyc">${dur(reset(i)-NOW)} left</span>`:S.group==="game"?`<span class="cyc">${PERIOD_LABEL[r.period.unit]}</span>`:"";
  const menu=S.menu===i.key?`<div class="menu" role="menu">${r.measure.kind==="amount"?`<span role="menuitem" data-amt="${i.key}">Edit amount</span>`:""}<span role="menuitem" data-act="target">Change target</span>${r.builtin?`<span role="menuitem" data-act="mine" data-id="${i.key}">Make it mine</span>`:`<span role="menuitem" data-act="editown">Edit</span>`}<span role="menuitem" class="danger" data-unfollow="${i.key}">${r.own?"Delete":"Unfollow"}</span></div>`:"";
  return `<tr class="${met?"met":""}" style="${gv(r.game)}"><td><span class="gcell"><span>${G[r.game].short}${multi(r.game)?`<small>${SV[i.srv].name}</small>`:""}</span></span></td><td class="rtitle"><span class="gsm">${laneName(r.game,i.srv)}</span>${esc(r.title)}${r.own?'<span class="tag own">yours</span>':""}</td><td class="prog">${prog}</td><td class="c-cyc">${cyc}</td><td class="c-pin">${pinBtn(i,"c")}</td><td class="c-pin">${pinBtn(i,"t")}</td><td class="c-k"><span class="kebab" role="button" tabindex="0" data-menu="${i.key}" aria-label="More for ${esc(r.title)}" aria-expanded="${S.menu===i.key}">${ICON.dots}${menu}</span></td></tr>`}
const rtHead=()=>`<thead><tr><th class="h-g">Game</th><th class="h-t">Routine</th><th class="h-prog">Progress</th><th class="c-cyc"></th><th class="c-pin"><span class="pinlbl">${ICON.list}<span>Checklist</span></span></th><th class="c-pin"><span class="pinlbl">${ICON.bars}<span>Timeline</span></span></th><th class="c-k"></th></tr></thead>`;
function bulkPins(tag,rs){if(!rs.length)return"";const allC=rs.every(i=>pinned(i.key,"c")),allT=rs.every(i=>pinned(i.key,"t"));return `<div class="bulkpins"><button data-bulkpin="${tag}|c|${allC?0:1}">${allC?"Unpin all from":"Pin all to"} checklist</button><button data-bulkpin="${tag}|t|${allT?0:1}">${allT?"Unpin all from":"Pin all to"} timeline</button></div>`}
function routinesScreen(){
  const f=insts();const c=counts();
  const top=`<div class="rt-top"><h1>Routines</h1><div class="sum">${f.length?`<b>${c.left}</b> of ${c.total} still to do. <b>${c.c}</b> pinned to the checklist, <b>${c.t}</b> to the timeline. The rest live only here.`:"Things that reset: dailies, weeklies, monthlies and endgame cycles."}</div>${f.length?`<div class="seg"><button data-group="horizon" aria-pressed="${S.group==="horizon"}">By reset</button><button data-group="game" aria-pressed="${S.group==="game"}">By game</button></div>`:""}<button class="btn" data-act="create">Create your own</button><button class="btn solid" data-act="library">Browse the library</button></div>`;
  const hint=S.rtHint?`<div class="hintbar"><p><b>Two pins on every row.</b> ${ICON.list} puts a routine in the Checklist's left column, ${ICON.bars} puts it on the Timeline. Unpinned ones live only here. You've seen both views now, so pick what you want in front of you.</p><button class="pillbtn" data-act="rthint">Got it</button></div>`:"";
  if(!f.length)return top+hint+`<div class="empty-state"><h2>You're not following any routines yet</h2><p>Pick the dailies, weekly bosses, shop restocks and endgame modes you actually do. Then pin the ones you want to see in the checklist or on the timeline.</p><button class="btn solid" data-act="library">Browse the library</button> <button class="btn link" data-act="create">Create your own</button></div>`;
  if(S.group==="game"){
    return top+hint+S.games.filter(g=>f.some(i=>i.r.game===g)).map(g=>{const rs=f.filter(i=>i.r.game===g);const left=rs.filter(i=>!isMet(i)).length;
      const body=S.servers[g].map(srv=>{const sr=rs.filter(i=>i.srv===srv).sort((a,b)=>reset(a)-reset(b));if(!sr.length)return"";return `${multi(g)?`<div class="subsrv">${SV[srv].name} server · daily reset in ${dur(nextDaily(srv)-NOW)}</div>`:""}<table class="rt">${rtHead()}<tbody>${sr.map(routineRow).join("")}</tbody></table>`}).join("");
      return `<section class="band" id="band-${g}"><div class="band-h" style="${gv(g)}"><div><h2 style="color:var(--g)">${G[g].name}</h2><div class="meta">${left} of ${rs.length} to do · ${rs.filter(i=>pinned(i.key,"c")).length} in checklist · ${rs.filter(i=>pinned(i.key,"t")).length} on timeline${multi(g)?` · ${S.servers[g].length} servers`:""}</div>${bulkPins("g:"+g,rs)}</div><div class="reset"><div class="k">Daily reset${multi(g)?` (${SV[first(g)].short})`:""}</div><div class="v cond">${dur(nextDaily(first(g))-NOW)}</div></div></div>${body}</section>`}).join("");
  }
  const bands=[["day","Today","Daily chores, on each game's own reset"],["week","This week","Rolls with each game's Monday reset"],["month","This month","Shop restocks and monthly modes"],["cycle","Cycles","Endgame modes on their own clocks"]];
  const order=i=>S.games.indexOf(i.r.game)*10+S.servers[i.r.game].indexOf(i.srv);
  return top+hint+bands.map(([u,name,meta])=>{const rs=f.filter(i=>i.r.period.unit===u).sort((a,b)=>u==="cycle"?reset(a)-reset(b):order(a)-order(b));const left=rs.filter(i=>!isMet(i)).length;
    const nxt=rs.length?Math.min(...rs.map(reset)):null;const ms=nxt?nxt-NOW:0;
    const col=!rs.length||!left?"var(--faint)":ms<3*H?"var(--critical)":ms<DAY&&u!=="day"?"var(--soon)":"var(--ink)";
    return `<section class="band"><div class="band-h"><div><h2>${name}</h2><div class="meta">${meta} · ${rs.length?`${left} of ${rs.length} to do`:"none followed"}</div>${bulkPins("u:"+u,rs)}</div><div class="reset"><div class="k">${u==="cycle"?"Next cycle ends":"Next reset in"}</div><div class="v cond" style="color:${col}">${nxt?dur(ms):"—"}</div></div></div>${rs.length?`<table class="rt">${rtHead()}<tbody>${rs.map(routineRow).join("")}</tbody></table>`:`<div class="empty-band">Nothing here. <button class="btn link" data-act="library">Add from the library</button></div>`}</section>`}).join("");
}

const EXAMPLES=[

  {id:"shop",label:"Monthly shop restock",f:{title:"Buy the monthly pull bundle",unit:"month",dom:1,done:"amount",target:5,unit2:"pulls"},hint:"Counts what you bought against the stock."},
  {id:"cycle",label:"Endgame cycle",f:{title:"Endgame cycle",unit:"cycle",days:14,from:"2026-10-16",done:"once"},hint:"Fill in a day a cycle began; how often it comes back does the rest."},

function formRoutine(F){const g=F.game,srv=F.srv&&S.servers[g]?.includes(F.srv)?F.srv:first(g);
  const period=F.unit==="day"?{unit:"day"}:F.unit==="week"?{unit:"week",dow:+F.dow}:F.unit==="month"?{unit:"month",startsOn:+F.dom}:{unit:"cycle",days:Math.max(2,+F.days||14),from:F.from||"2026-10-16"};
  const measure=F.done==="once"?{kind:"days",required:1}:F.done==="ndays"?{kind:"days",required:Math.max(1,+F.nDays||1)}:{kind:"amount",target:Math.max(1,+F.target||1),unit:F.unit2};
  return{game:g,srv,title:F.title.trim()||"Untitled routine",period,measure,resetHour:F.hourMode==="custom"?+F.hour:4}}
function previewLine(F){const r=formRoutine(F);const p=periodOf(r,r.srv);
  const what=r.measure.kind==="amount"?`reach <b>${fmt(r.measure.target)} ${esc(r.measure.unit||"")}</b>`:r.measure.required>1?`tick on <b>${r.measure.required} days</b>`:`tick it <b>once</b>`;
  const per={day:"each day",week:"each week",month:"each month",cycle:"each cycle"}[r.period.unit];
  return `Resets <b>${periodWords(r.period,rh(r)).replace(/^E/,"e")} ${SV[r.srv].name} server time</b> · ${yourTime(p.end)} your time · next in <b>${dur(p.end-NOW)}</b><br>Done when you ${what} ${per}.`}
function createDrawer(){const F=S.form;const g=F.game;const ex=EXAMPLES.find(e=>e.id===F.example);

      <div class="fld full"><span>Repeats</span><div class="pills">${[["day","Every day"],["week","Every week"],["month","Every month"],["cycle","Every N days"]].map(([u,l])=>`<button type="button" data-fu="${u}" aria-pressed="${F.unit===u}">${l}</button>`).join("")}</div>
        <div class="row" style="margin-top:8px">${F.unit==="week"?`on <select name="dow">${[1,2,3,4,5,6,0].map(d=>opt(d,WEEKDAYS[d],F.dow)).join("")}</select>`:F.unit==="month"?`on the <select name="dom">${Array.from({length:28},(_,i)=>opt(i+1,ord(i+1),F.dom)).join("")}</select> of the month`:F.unit==="cycle"?`every <input type="number" name="days" min="2" max="366" value="${F.days}"> days, counted from <input type="date" name="from" value="${F.from}"> <span class="help">any day a cycle began</span>`:`<span class="help">Rolls at the game's daily reset.</span>`}</div></div>
