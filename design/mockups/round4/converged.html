// ============ settings ============
const COMP=[["events","Events","This game's events in Checklist and Timeline"],["dailies","Dailies","Chores that reset each game-day, such as daily commissions"],["weekly","Weeklies & monthlies","Weekly goals and monthly restocks, such as bosses and shop pulls"],["cycles","Cycles","Routines on a game-specific schedule, such as a 14-day endgame mode"]];
const kindOf=r=>r.period.unit==="day"?"dailies":r.period.unit==="cycle"?"cycles":"weekly";
const builtinsOf=(g,kind)=>BUILTINS.filter(r=>r.game===g&&kindOf(r)===kind&&(S.standardPulls||r.pulls!=="standard"));
function compState(g,kind){if(kind==="events")return S.hideEvents.has(g)?"off":"on";const rs=builtinsOf(g,kind);if(!rs.length)return"none";
  const ks=rs.flatMap(r=>S.servers[g].map(s=>keyOf(r.id,s,g)));const n=ks.filter(k=>S.followed.has(k)).length;return n===0?"off":n===ks.length?"on":"some"}
function applyComp(g,kind,on){if(kind==="events"){on?S.hideEvents.delete(g):S.hideEvents.add(g);return 0}let n=0;
  for(const r of builtinsOf(g,kind))for(const s of S.servers[g]){const k=keyOf(r.id,s,g);if(on&&!S.followed.has(k)){follow(k,true);n++}else if(!on&&S.followed.has(k)){follow(k,false);n++}}return n}
function gameLine(g){if(!S.games.includes(g))return"Not followed";const parts=COMP.filter(([k])=>{const s=compState(g,k);return s==="on"||s==="some"}).map(([k,l])=>k==="weekly"?"weeklies":l.toLowerCase());
  return `${parts.length?parts.join(", "):"nothing"}${multi(g)?` · ${S.servers[g].map(s=>SV[s].short).join(" + ")}`:""}`}
const GENERAL=[["general","Region & time","Default server, your time zone"],["appearance","Appearance",""],["view","Default view",""],["lists","Lists",""],["own","Your own events and games",""],["backup","Backup",""]];
function settingsScreen(){
  const fl=S.games,nf=GAMES.map(g=>g.id).filter(g=>!S.games.includes(g));
  const row=g=>`<button class="srow ${S.games.includes(g)?"":"off"}" data-sel="${g}" aria-current="${S.sel===g}" style="${gv(g)}"><span class="r3"></span><span><span class="nm">${G[g].name}</span><span class="what">${gameLine(g)}</span></span>${ICON.right}</button>`;
  const what=k=>k==="general"?`${SV[S.region].name} · ${YOUR_TZ}`:k==="appearance"?S.theme[0].toUpperCase()+S.theme.slice(1):k==="view"?S.defaultView[0].toUpperCase()+S.defaultView.slice(1):k==="own"?`${S.ownEvents.length} event${S.ownEvents.length===1?"":"s"}`:k==="lists"?(S.showUpcoming?"Upcoming shown":"Running only"):"Save to a file";
  return `<div class="settings"><nav class="slist" aria-label="Settings"><h4>General</h4>${GENERAL.map(([k,l])=>`<button class="srow gen" data-sel="${k}" aria-current="${S.sel===k}" style="--g:var(--rule-strong)"><span class="r3"></span><span><span class="nm">${l}</span><span class="what">${what(k)}</span></span>${ICON.right}</button>`).join("")}
    <h4>Your games</h4>${fl.map(row).join("")}<h4>Other games</h4>${nf.slice(0,S.allGames?99:3).map(row).join("")}${!S.allGames&&nf.length>3?`<button class="moreg" data-act="allgames">Show ${nf.length-3} more games</button>`:""}</nav>
    <div class="profile">${G[S.sel]?renderGamePage(S.sel):generalPane(S.sel)}</div></div>`;
}
/** A game's settings page. Swappable in a later round (game info, redeem codes). */
function originalGamePage(g){
  const on=S.games.includes(g);
  const head=`<div class="ptitle"><h2>${G[g].name}</h2><span class="studio">${G[g].studio}</span><label class="switch">Following<button class="sw" role="switch" data-followgame="${g}" aria-checked="${on}" aria-label="Follow ${G[g].name}"></button></label></div>`;
  if(!on)return `<div style="${gv(g)}">${head}<p class="pdesc">You're not following ${G[g].name}, so none of its events or routines show anywhere. Follow it to set it up.</p></div>`;
  const comp=COMP.map(([k,l,sub])=>{const st=compState(g,k);const n=k==="events"?liveEvents().filter(e=>e.game===g).length+" running":st==="none"?"none built in":`${builtinsOf(g,k).length} built in`;
    return `<button data-comp="${g}|${k}" data-st="${st}" aria-pressed="${st==="on"}" ${st==="none"?"disabled":""}><span class="cbx">${st==="on"?ICON.check.replace("<svg",'<svg stroke="currentColor"'):""}</span><span class="ln">${l}</span><span class="ls">${sub}</span><span class="ls">${st==="some"?"Some, fine-tuned":n}</span></button>`}).join("");
  const srvRows=S.servers[g].map((s,ix)=>{const nd=nextDaily(s);return `<div class="srvrow"><span class="tagn">${ix===0?"Main":"Also"}</span><div class="clock"><b>${SV[s].name}</b> · resets 04:00 server time · ${hh(new Date(nd+YOUR_OFF*H).getUTCHours())} your time · next in <span class="nx">${dur(nd-NOW)}</span><br><span style="color:var(--faint);font-size:12px">${ix===0?"Its dailies and routines are the ones you already had.":"Its own dailies and routines, ticked separately."}</span></div><div class="r"><select data-srvset="${g}|${ix}" aria-label="Server">${Object.keys(SV).filter(k=>k===s||!S.servers[g].includes(k)).map(k=>`<option value="${k}" ${k===s?"selected":""}>${SV[k].name}</option>`).join("")}</select>${ix>0?`<button class="btn sm" data-srvdel="${g}|${s}">Remove</button>`:""}</div></div>`}).join("");
  const free=Object.keys(SV).filter(k=>!S.servers[g].includes(k));
  return `<div style="${gv(g)}">${head}
  <div class="grp"><h3>What to track<span>Any combination. Each one follows or unfollows that kind of built-in for ${G[g].short}${multi(g)?", on every server":""}.</span></h3>
    <div class="comp" role="group" aria-label="What to track">${comp}</div>
    <div class="compnote"><span>Fine-tune single routines, and where they show, on the Routines tab.</span><button data-managein="${g}">Fine-tune in Routines →</button></div></div>
  <div class="grp"><h3>Servers<span>Where you play ${G[g].short}. Each server has its own reset, dailies and routines.</span></h3>${srvRows}
    ${free.length?(S.addSrv===g?`<div class="srvrow"><span class="tagn">Add</span><div class="clock">Which server? Start with events only, then choose routines for this server. Nothing is copied.</div><div class="r">${free.map(k=>`<button class="btn sm" data-srvadd="${g}|${k}">${SV[k].name}</button>`).join("")}<button class="btn link" data-act="srvcancel">Cancel</button></div></div>`:`<button class="btn link" data-act="srvopen" data-g="${g}" style="padding-left:0;margin-top:6px">+ Add another server</button>`):""}</div>
  <div class="grp"><h3>About this game</h3><div class="about"><div><div class="k">Studio</div>${G[g].studio}</div><div><div class="k">Event source</div><a href="#" data-act="noop">game8.co</a> · checked twice a day</div><div><div class="k">Daily chores</div>${esc(G[g].chores)}</div><div><div class="k">Links</div><a href="#" data-act="noop">Official site</a> · <a href="#" data-act="noop">Wiki</a></div></div>
    <div class="soon-note">Placeholder. Redeem codes, version dates and more about the game come in a later round.</div></div></div>`;
}
function generalPane(k){
  if(k==="general")return `<div><div class="ptitle"><h2>Region & time</h2></div><p class="pdesc">The server a game starts on when you follow it. Each game can differ, and can have more than one, on its own page.</p>
    <div class="grp"><h3>Default server</h3><div class="seg" style="margin-top:12px">${Object.keys(SV).map(r=>`<button data-region="${r}" aria-pressed="${S.region===r}">${SV[r].name}</button>`).join("")}</div></div>
    <div class="grp"><h3>Your time zone<span>Every date and countdown is shown in it.</span></h3><div class="trow"><span class="lbl">${YOUR_TZ}<small>From this browser.</small></span><span style="color:var(--faint);font-size:12px">Automatic</span></div></div>
    <div class="grp"><h3>Resets for your games</h3>${lanes().map(({g,srv})=>`<div class="trow" style="${gv(g)}"><span class="lbl" style="color:var(--g)">${laneName(g,srv)}<small>${SV[srv].name} · 04:00 server time · ${hh(new Date(nextDaily(srv)+YOUR_OFF*H).getUTCHours())} your time</small></span><span class="cond" style="font:600 15px 'Barlow Condensed'">${dur(nextDaily(srv)-NOW)}</span></div>`).join("")}</div></div>`;
  if(k==="appearance")return `<div><div class="ptitle"><h2>Appearance</h2></div><div class="grp"><h3>Theme</h3><div class="seg" style="margin-top:12px">${["dark","light"].map(t=>`<button data-theme="${t}" aria-pressed="${S.theme===t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div></div></div>`;
  if(k==="view")return `<div><div class="ptitle"><h2>Default view</h2></div><p class="pdesc">What opens when you come back. What's new shows in both, so you won't miss it either way.</p><div class="viewpick">${viewCards(S.defaultView,"dv")}</div></div>`;
  if(k==="lists")return `<div><div class="ptitle"><h2>Lists</h2></div><p class="pdesc">Choices about the Checklist and Timeline themselves. Which routines show in them is set per routine, by its pins.</p>
    <div class="grp"><label class="chk block"><input type="checkbox" data-pref="showUpcoming" ${S.showUpcoming?"checked":""}><span>Show events that haven't started<small>Off keeps the lists to what you can play now.</small></span></label>
    <label class="chk block"><input type="checkbox" data-pref="tlStrip" ${S.tlStrip?"checked":""}><span>Timeline: resets in their own strip<small>Off draws pinned routines in each game's lane, beside its events.</small></span></label>
    <label class="chk block"><input type="checkbox" data-pref="standardPulls" ${S.standardPulls?"checked":""}><span>Offer standard-banner pulls in the library<small>Premium pulls are always offered.</small></span></label>
    <div class="trow"><span class="lbl">Done and ignored events<small>Leave both lists and wait in the Archive, kept in your save.</small></span><button class="btn" data-tab="archive">Open Archive</button></div></div></div>`;
  if(k==="own")return `<div><div class="ptitle"><h2>Your own events and games</h2></div><p class="pdesc">Only what you typed in yourself. Routines, built-in or yours, live on the Routines tab.</p>
    <div class="grp"><h3>Your events</h3>${S.ownEvents.map(o=>`<div class="trow" style="${gv(o.game)}"><span class="lbl">${esc(o.title)}<small>${G[o.game].short} · ends ${new Date(o.end).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</small></span><button class="btn sm" data-act="editown">Edit</button></div>`).join("")}<button class="btn link" data-act="newevent" style="padding-left:0">+ Add an event</button></div>
    <div class="grp"><h3>Your games</h3><p class="pdesc" style="margin:10px 0">None yet. Add a game the app doesn't cover, and give it a colour.</p><button class="btn link" data-act="newevent" style="padding-left:0">+ Add a game</button></div></div>`;
  return `<div><div class="ptitle"><h2>Backup</h2></div><p class="pdesc">Everything lives in this browser: games and servers, followed routines, pins, ticks and the Archive. Save it to a file to move it to another device.</p><div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="btn solid" data-act="noop">Save to a file</button><button class="btn" data-act="noop">Load a file</button></div></div>`;
}
function viewCards(cur,attr){return [["checklist","Checklist","A list, closest deadline first."],["timeline","Timeline","Bars per game, today pinned."]].map(([k,l,s])=>`<button class="vcard" data-${attr}="${k}" aria-pressed="${cur===k}"><div class="vprev ${k==="checklist"?"list":"tl"}">${k==="checklist"?"<i></i><i></i><i></i>":`<i style="--g:#4EA8DE;left:4%;width:52%;top:6px"></i><i style="--g:#F2A03D;left:30%;width:44%;top:24px"></i><i style="--g:#3DD6A0;left:50%;width:46%;top:42px"></i><em></em>`}</div><b>${l}</b><small>${s}</small></button>`).join("")}

// ============ archive ============
// Three variants of the same snapshot data; the bar switches S.arcV between them.
const ST_LABEL={done:"Completed",ignored:"Ignored",expired:"Ran out"};
const ST_ICON={done:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  ignored:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12"/></svg>',
  expired:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 6.5v7M12 17.5v.01"/></svg>'};
const arcMark=st=>`<span class="amark ${st}" aria-hidden="true">${ST_ICON[st]}</span>`;
const arcFrac=a=>a.prog&&a.prog.need?Math.min(1,a.prog.got/a.prog.need):a.status==="done"?1:0;
const unitOf=(a,n)=>{const u=a.prog.unit;return n===1&&u.endsWith("s")?u.slice(0,-1):u};
/** What the reader got out of it, in their terms: "6/7 days", "missed by 1 day", "1,450/1,500 points". */
function achieved(a){const p=a.prog;if(!p)return{big:"",line:esc(a.progress||"")};
  const got=p.t==="amount"?fmt(p.got):p.got,need=p.t==="amount"?fmt(p.need):p.need,u=p.unit;
  const big=`${got}/${need}`;
  if(a.status==="done")return{big,line:p.got>=p.need?`${big} ${u}`:`${big} ${u} · marked done`};
  if(a.status==="expired"){const short=p.need-p.got;return{big,line:p.t==="amount"?`${big} ${u} · short by ${fmt(short)}`:`${big} ${u} · missed by ${short} ${unitOf(a,short)}`}}
  return{big:"—",line:`Ignored on ${dayStr(a.at)}${p.got?`, after ${p.got} ${unitOf(a,p.got)}`:""}`};
}
const runDays=a=>Math.max(1,daysBetween(a.start,a.end));
const monthOf=s=>new Date(s+"T12:00:00Z").toLocaleDateString("en-GB",{month:"long",year:"numeric",timeZone:"UTC"});
const verOf=(g,v)=>(VERSIONS[g]||[]).find(x=>x[0]===v);
function arcList(){return S.archive.filter(a=>(S.arcGame==="all"||a.game===S.arcGame)&&(S.arcStatus==="all"||a.status===S.arcStatus)).sort((a,b)=>(b.end||b.at).localeCompare(a.end||a.at))}
const tally=as=>({done:as.filter(a=>a.status==="done").length,expired:as.filter(a=>a.status==="expired").length,ignored:as.filter(a=>a.status==="ignored").length,all:as.length});
/** A stacked bar of statuses — the one stats primitive all three variants share. */
function stack(t,cls=""){const n=t.all||1;return `<span class="stack ${cls}" role="img" aria-label="${t.done} completed, ${t.expired} ran out, ${t.ignored} ignored"><i class="s-done" style="width:${t.done/n*100}%"></i><i class="s-expired" style="width:${t.expired/n*100}%"></i><i class="s-ignored" style="width:${t.ignored/n*100}%"></i></span>`}
const arcIntro=`Finished, ignored, or ran out. Kept in your save and left off the Checklist and Timeline. Open one to see it as it was.`;
function statusSeg(){return `<div class="seg">${[["all","All"],["done","Completed"],["expired","Ran out"],["ignored","Ignored"]].map(([k,l])=>`<button data-arcst="${k}" aria-pressed="${S.arcStatus===k}">${l}</button>`).join("")}</div>`}
function gameSelect(){const games=[...new Set(S.archive.map(a=>a.game))];return `<select id="arcgame" aria-label="Game"><option value="all">All games</option>${games.map(g=>`<option value="${g}" ${S.arcGame===g?"selected":""}>${G[g].name}</option>`).join("")}</select>`}

/** How the reader's progress looked: pips per day, per stage, or a filled bar. */
function progViz(a,big=false){const p=a.prog;if(!p)return"";
  if(p.t==="days"&&!big)return `<div class="pips ${a.status}" style="${gv(a.game)}" aria-label="${p.got} of ${p.need} days">${Array.from({length:p.need},(_,i)=>`<i class="${i<p.got?"on":""}"></i>`).join("")}</div>`;
  if(p.t==="days"){const span=runDays(a),on=new Set(p.days);
    return `<div class="pips ${big?"big":""} ${a.status}" style="${gv(a.game)}" aria-label="${p.got} of ${span} days checked in">${Array.from({length:span},(_,i)=>`<i class="${on.has(i)?"on":""}" title="${dayStr(new Date(Date.parse(a.start)+i*DAY_MS).toISOString().slice(0,10))}"></i>`).join("")}</div>${big?`<div class="pips-ax"><span>${dayStr(a.start)}</span><span>${p.got} of ${span} days ticked · goal ${p.need}</span><span>${(a.end?dayStr(a.end):"End unknown")}</span></div>`:""}`}
  if(p.t==="stages")return `<div class="pips stages ${big?"big":""} ${a.status}" style="${gv(a.game)}" aria-label="${p.got} of ${p.need} ${p.unit}">${Array.from({length:p.need},(_,i)=>`<i class="${i<p.got?"on":""}"></i>`).join("")}</div>`;
  return `<div class="abar ${big?"big":""} ${a.status}" style="${gv(a.game)};--f:${arcFrac(a)*100}%" aria-label="${fmt(p.got)} of ${fmt(p.need)} ${p.unit}"><i></i></div>`;
}
/** Snapshot facts every variant's detail shows. */
function oldArcFacts(a){const running=Date.parse(a.end+"T03:00:00Z")>NOW;const ac=achieved(a);
  return `<p class="desc">${esc(a.desc)||'<span style="color:var(--faint)">The source gave no description.</span>'}</p>
  <dl class="dl2"><dt>Ran</dt><dd>${dayStr(a.start)} – ${(a.end?dayStr(a.end):"End unknown")} 2026 · ${runDays(a)} days${running?" · <b>still running</b>":""}</dd>${a.ver?`<dt>Version</dt><dd>${G[a.game].short} ${a.ver}</dd>`:""}<dt>Your progress</dt><dd><b class="ach ${a.status}">${ac.line}</b></dd><dt>Archived</dt><dd>${dayStr(a.at)} 2026, ${a.status==="done"?"when you marked it done":a.status==="ignored"?"when you ignored it":"by the clock, when it ended unfinished"}</dd></dl>
  <div class="saved">Source: <a href="${esc(a.src)}" target="_blank" rel="noopener">${esc((a.src||"Reader-authored or sample event").replace("https://",""))}</a><br>${a.moved?`Saved copy from ${dayStr(a.at)} 2026. <b>The live page no longer lists this event</b>; what you see here is what it said then.`:`Saved copy from ${dayStr(a.at)} 2026 — the live page may have moved on.`}</div>
  <div class="acts">${running?`<button class="btn solid" data-restore="${a.id}">Restore to the lists</button>`:`<button class="btn" data-restore="${a.id}">Restore</button>`}<button class="btn link" data-act="closesheet">Close</button></div>
  <p class="keepnote">Restore takes it out of the Archive${running?" and puts it back in the Checklist and Timeline":"; an event that has ended stays off the lists either way"}. Nothing here is ever deleted from your save.</p>`}

function originalArchive(){return S.arcV===2?arcV2():S.arcV===3?arcV3():arcV1()}
function oldArchiveDetail(id){const a=S.archive.find(x=>x.id===id);if(!a||S.arcV===2)return"";
  const head=`<p class="legend" style="color:var(--g)">${G[a.game].name}${a.ver?" "+a.ver:""} · <span class="st ${a.status}">${ST_LABEL[a.status]}</span></p><h2>${esc(a.title)}</h2>`;
  if(S.arcV===3)return `<aside class="sidep" role="dialog" aria-label="${esc(a.title)}" style="${gv(a.game)}"><button class="x" data-act="closesheet" aria-label="Close">${ICON.x}</button>${head}<div class="sidep-viz">${progViz(a,true)}</div>${arcFacts(a)}</aside>`;
  return `<div class="scrim" data-act="closesheet"></div><div class="sheet dsheet" role="dialog" aria-label="${esc(a.title)}" style="${gv(a.game)}">${head}<div class="sidep-viz">${progViz(a,true)}</div>${arcFacts(a)}</div>`}

// ---------- 1 · Ledger with a story ----------
function arcV1(){const list=arcList();const all=S.archive;
  const ended=all.filter(a=>a.status!=="ignored");const rate=ended.length?Math.round(all.filter(a=>a.status==="done").length/ended.length*100):0;
  const oct=all.filter(a=>a.end>="2026-10-01");const octEnded=oct.filter(a=>a.status!=="ignored");const octRate=octEnded.length?Math.round(oct.filter(a=>a.status==="done").length/octEnded.length*100):0;
  const byEnd=[...all].filter(a=>a.status!=="ignored").sort((a,b)=>(a.end||a.at).localeCompare(b.end||b.at));let run=0,best=0,cur=0;byEnd.forEach(a=>{if(a.status==="done"){run++;best=Math.max(best,run)}else run=0});for(let i=byEnd.length-1;i>=0&&byEnd[i].status==="done";i--)cur++;
  const ticks=all.reduce((s,a)=>s+(a.prog?.t==="days"?a.prog.got:0),0);
  const games=[...new Set(all.map(a=>a.game))];
  const months={};list.forEach(a=>{(months[monthOf(a.end)]??=[]).push(a)});
  return `<div class="rt-top"><h1>Archive</h1><div class="sum">${arcIntro}</div></div>
  <section class="v1-stats" aria-label="Your record">
    <div class="v1-figs">
      <div><b>${octRate}<small>%</small></b><span>finished in October</span><em>${rate}% since August</em></div>
      <div><b>${cur}</b><span>finished in a row</span><em>best run ${best}</em></div>
      <div><b>${ticks}</b><span>check-in days logged</span><em>across ${all.filter(a=>a.prog?.t==="days").length} events</em></div>
      <div class="warn"><b>${all.filter(a=>a.status==="expired").length}</b><span>ran out unfinished</span><em>${all.filter(a=>a.status==="expired"&&a.prog&&a.prog.need-a.prog.got<=1).length} by a single day or stage</em></div>
    </div>
    <div class="v1-games">${games.map(g=>{const t=tally(all.filter(a=>a.game===g));return `<button class="v1-g" data-arcgame="${S.arcGame===g?"all":g}" aria-pressed="${S.arcGame===g}" style="${gv(g)}"><span class="nm">${G[g].short}</span>${stack(t)}<span class="ct">${t.done}/${t.all-t.ignored}</span></button>`}).join("")}<p class="v1-key"><i class="s-done"></i>completed <i class="s-expired"></i>ran out <i class="s-ignored"></i>ignored · count is finished of those you played</p></div>
  </section>
  <div class="filters">${gameSelect()}${statusSeg()}</div>
  ${Object.entries(months).map(([m,as])=>{const t=tally(as);return `<div class="month v1-month">${m}<span>${t.done} completed · ${t.expired} ran out · ${t.ignored} ignored</span>${stack(t,"mini")}</div>${as.map(a=>{const ac=achieved(a);return `<button class="v1row ${a.status}" data-arc="${a.id}" style="${gv(a.game)}">${arcMark(a.status)}<span class="gcell gc2">${G[a.game].short}<small>${a.ver||""}</small></span><span class="tt"><span class="ti">${esc(a.title)}</span><small class="ach ${a.status}"><span class="gsmi">${G[a.game].short} · </span>${ac.line}</small></span><span class="v1-res">${a.status==="ignored"?"":`<b class="cond">${ac.big}</b>`}${a.status==="ignored"?`<span class="st ignored">Ignored</span>`:progViz(a)}</span><span class="when">${dayStr(a.start)} – ${(a.end?dayStr(a.end):"End unknown")}</span></button>`}).join("")}`}).join("")||`<div class="empty-band">Nothing matches.</div>`}`;
}

// ---------- 2 · By game and version ----------
function arcV2(){
  if(S.arcSheet){const a=S.archive.find(x=>x.id===S.arcSheet);if(a)return arcV2Page(a)}
  const games=[...new Set(S.archive.map(a=>a.game))];const sel=S.arcGame;
  const side=`<nav class="v2-side" aria-label="Games"><button class="v2-si" data-arcgame="all" aria-pressed="${sel==="all"}"><span class="nm">All games</span><small>${S.archive.length} events</small></button>${games.map(g=>{const t=tally(S.archive.filter(a=>a.game===g));return `<button class="v2-si" data-arcgame="${g}" aria-pressed="${sel===g}" style="${gv(g)}"><span class="nm" style="color:var(--g)">${G[g].name}</span><small>${t.done} of ${t.all} done${t.expired?` · ${t.expired} ran out`:""}</small>${stack(t,"mini")}</button>`}).join("")}</nav>`;
  const shown=sel==="all"?games:[sel];
  const body=shown.map(g=>{const vers=[...new Set(S.archive.filter(a=>a.game===g).map(a=>(a.ver||"Saved events")))].sort().reverse();
    return `<section class="v2-game" style="${gv(g)}">${sel==="all"?`<h2 class="v2-gh">${G[g].name}</h2>`:""}${vers.map(v=>{const as=arcList().filter(a=>a.game===g&&(a.ver||"Saved events")===v);if(!as.length)return"";const all=S.archive.filter(a=>a.game===g&&(a.ver||"Saved events")===v);const t=tally(all);const vr=verOf(g,v);const live=vr&&Date.parse(vr[2]+"T03:00:00Z")>NOW;

}

    <div class="v2-track">${sibs.map(x=>`<i class="sib ${x.status}" style="left:${pos(x.start)}%;width:${(pos(x.end)-pos(x.start)).toFixed(2)}%" title="${esc(x.title)}"></i>`).join("")}<b class="me ${a.status}" style="left:${pos(a.start)}%;width:${(pos(a.end)-pos(a.start)).toFixed(2)}%"><span>${esc(a.title)}</span></b>${nowPos<100?`<em style="left:${nowPos}%" title="Now"></em>`:""}</div>

// ---------- 3 · History view ----------
const H0=Date.parse("2026-08-10T00:00:00Z"),H1=Date.parse("2026-10-20T00:00:00Z");
const hx=d=>((Date.parse(d+"T00:00:00Z")-H0)/(H1-H0)*100);
function arcV3(){const list=arcList();const games=[...new Set(list.map(a=>a.game))].sort((a,b)=>DEFAULT_GAMES.indexOf(a)-DEFAULT_GAMES.indexOf(b));
  const weeks=[];for(let t=Date.parse("2026-08-10T00:00:00Z");t<H1;t+=7*DAY_MS)weeks.push(t);
  const months=[["Aug","2026-08-10"],["Sep","2026-09-01"],["Oct","2026-10-01"]];
  // check-in density per day across everything shown
  const nDays=Math.round((H1-H0)/DAY_MS);const dens=new Array(nDays).fill(0);list.forEach(a=>{if(a.prog?.t!=="days")return;a.prog.days.forEach(i=>{const d=Math.round((Date.parse(a.start)+i*DAY_MS-H0)/DAY_MS);if(d>=0&&d<nDays)dens[d]++})});const dmax=Math.max(1,...dens);
  const lanes=games.map(g=>{const as=list.filter(a=>a.game===g).sort((a,b)=>a.start.localeCompare(b.start));const rows=[];as.forEach(a=>{let r=rows.findIndex(end=>end<=a.start);if(r<0){r=rows.length;rows.push("")}rows[r]=a.end||a.at;a._row=r});
    return `<div class="v3-lane" style="${gv(g)};--rows:${rows.length}"><div class="v3-ln">${G[g].short}</div><div class="v3-lt">${as.map(a=>`<button class="v3-bar ${a.status}" data-arc="${a.id}" data-hl="${a.id}" style="left:${hx(a.start).toFixed(2)}%;width:${Math.max(.8,Math.min(100,hx(a.end||a.at))-hx(a.start)).toFixed(2)}%;top:${a._row*20+4}px${hx(a.end||a.at)>100?";-webkit-mask-image:linear-gradient(90deg,#000 70%,transparent);mask-image:linear-gradient(90deg,#000 70%,transparent)":""}" aria-label="${esc(a.title)}, ${ST_LABEL[a.status]}"><span>${esc(a.title)}</span></button>`).join("")}</div></div>`}).join("");
  const nowX=Math.min(100,(NOW-H0)/(H1-H0)*100);
  return `<div class="rt-top"><h1>Archive</h1><div class="sum">Your season so far: everything you finished, ignored, or let run out since August. ${arcIntro.split(". ").slice(1).join(". ")}</div></div>
  <div class="filters">${gameSelect()}${statusSeg()}<span class="v3-key"><i class="k done"></i>completed <i class="k expired"></i>ran out <i class="k ignored"></i>ignored</span></div>
  <section class="v3-board" aria-label="Archived events over time">
    <div class="v3-axis"><div class="v3-ln"></div><div class="v3-lt">${weeks.map(t=>`<span class="wk" style="left:${((t-H0)/(H1-H0)*100).toFixed(2)}%"></span>`).join("")}${months.map(([m,d])=>`<span class="mo" style="left:${hx(d).toFixed(2)}%">${m}</span>`).join("")}<span class="nowtag" style="left:${nowX}%">Today</span></div></div>
    <div class="v3-lanes" style="--n:${nowX}">${lanes||`<div class="empty-band">Nothing matches.</div>`}</div>
    <div class="v3-dens"><div class="v3-ln">Check-ins</div><div class="v3-lt">${dens.map((n,i)=>`<i style="left:${(i/nDays*100).toFixed(2)}%;width:${(100/nDays).toFixed(2)}%;height:${n?Math.max(2,n/dmax*22):0}px" title="${n} check-ins"></i>`).join("")}</div></div>
  </section>
  <div class="v3-list">${list.map(a=>{const ac=achieved(a);return `<button class="v3row ${a.status}" data-arc="${a.id}" data-hl="${a.id}" style="${gv(a.game)}">${arcMark(a.status)}<span class="gcell gc2">${G[a.game].short}</span><span class="tt"><span class="ti">${esc(a.title)}</span><small class="ach ${a.status}"><span class="gsmi">${G[a.game].short} · </span>${ac.line}</small></span><span class="when">${dayStr(a.start)} – ${(a.end?dayStr(a.end):"End unknown")}</span></button>`}).join("")}</div>`;
}

// ============ timeline ============
/**
 * One routine on the board: a slim outlined pill spanning the period it's in now,
 * filled to its progress, capped by its reset; the next period is a faint dashed ghost.
 * Swappable in a later round that compares drawings.
 */
function drawRoutineOnTimeline(i,x,top,w0,w1,label){const p=periodOf(i.r,i.srv);const met=isMet(i);
  const L=x(p.start),R=x(p.end),W=Math.max(14,R-L);const frac=met?1:Math.min(1,val(i)/req(i.r));
  const clipped=p.start<w0;const name=label??i.r.title;const txt=`${esc(name)} · ${met?"done":esc(progText(i))}`;
  const tip=`${esc(laneName(i.r.game,i.srv))}: ${esc(i.r.title)} · ${esc(progText(i))} · resets ${yourTime(p.end)}`;
  const narrow=W<140;
  const ghost=p.end<w1?`<div class="rghost" style="left:${R+3}px;width:${Math.max(10,x(Math.min(w1,p.end+(p.end-p.start)))-R-3)}px;top:${top}px"></div>`:"";
  return `${ghost}<div class="rbar ${met?"met":""} ${clipped?"clipped":""}" data-rt="${i.key}" style="left:${L}px;width:${W}px;top:${top}px" title="${tip}"><span class="fill" style="width:${frac*100}%"></span>${narrow?"":`<span class="lab">${txt}</span>`}<span class="rs">${ICON.reset}</span><span class="cap"></span>${narrow?`<span class="out">${txt}</span>`:""}</div>`}
function oldTimeline(){
  const small=window.innerWidth<700;const DW=small?40:54,NAME=small?92:160,NDAYS=28;
  const w0=Date.UTC(2026,9,13),w1=w0+NDAYS*DAY,W=NDAYS*DW;
  const x=t=>(Math.max(w0,Math.min(w1,t))-w0)/DAY*DW;
  const days=Array.from({length:NDAYS},(_,i)=>w0+i*DAY);
  const grid=days.map((d,i)=>`<i class="gridcol ${new Date(d).getUTCDay()===1?"wk":""}" style="left:${i*DW}px"></i>`).join("");
  const axis=`<div class="axis"><div class="corner" style="width:${NAME}px"></div>${days.map(d=>{const dt=new Date(d);return `<div class="day ${dt.getUTCDay()===1?"wk":""}" style="width:${DW}px"><b>${dt.getUTCDate()}</b>${dt.toLocaleString("en-GB",{weekday:"short",timeZone:"UTC"})}</div>`}).join("")}</div>`;
  const gs=S.games.filter(g=>S.focus==="all"||S.focus===g);
  const evs=liveEvents().filter(e=>gs.includes(e.game)&&(e.end??w1)>w0&&e.start<w1);
  const evBar=(e,top,ey)=>{const l=x(e.start),r=x(e.end??w1);return `<div class="bar ${e.start>NOW?"ns":""} ${e.end==null?"open":""} ${e.start<w0?"clip":""} ${e.own?"own":""}" data-ev="${e.id}" tabindex="0" role="button" style="left:${l}px;width:${Math.max(24,r-l-2)}px;top:${top}px;${gv(e.game)}" title="${esc(e.title)}">${ey?`<span class="ey">${G[e.game].short}</span>`:""}${esc(e.title)}</div>`};
  const pack=items=>{const rows=[];items.forEach(it=>{let k=rows.findIndex(row=>row.every(o=>o.b<=it.a||o.a>=it.b));if(k<0){rows.push([]);k=rows.length-1}rows[k].push(it)});return rows};
  const routinesFor=(g,srv)=>pinnedIn(g,srv,"t").sort((a,b)=>reset(a)-reset(b));
  const showServer=g=>multi(g);
  const nm=(g,srv)=>`<div class="nm" style="width:${NAME}px"><span>${G[g].short}${srv&&showServer(g)?`<small>${SV[srv].name}</small>`:""}</span></div>`;
  let body="",strip="";
  // routine rows for one game: one row per routine, server named on the label when the game has several
  const routineRows=(g,top0)=>{let top=top0,html="";for(const srv of S.servers[g]){for(const i of routinesFor(g,srv)){html+=drawRoutineOnTimeline(i,x,top,w0,w1,showServer(g)?`${i.r.title} (${SV[srv].short})`:undefined);top+=26}}return{html,h:top-top0}};
  if(S.tlStrip){const sg=gs.filter(g=>S.servers[g].some(s=>routinesFor(g,s).length));
    strip=`<div class="resets"><span class="grpl">Resets<small>${sg.length?"pinned routines, in their own strip":"none pinned to the timeline"}</small></span>${sg.map(g=>{const rr=routineRows(g,8);return `<div class="lane" style="${gv(g)};height:${rr.h+12}px">${nm(g)}<div class="tr" style="width:${W}px">${grid}${rr.html}</div></div>`}).join("")}</div>`}
  if(S.tlMode==="bygame"){
    body=gs.map(g=>{const es=evs.filter(e=>e.game===g).sort((a,b)=>a.start-b.start);const rows=pack(es.map(e=>({a:e.start,b:e.end??w1,e})));
      const evH=rows.length*38;const rr=S.tlStrip?{html:"",h:0}:routineRows(g,8+evH+(rows.length?4:0));
      if(!rows.length&&!rr.h)return"";
      return `<div class="lane" style="${gv(g)};height:${8+evH+rr.h+(rr.h?8:4)+(rows.length&&rr.h?4:0)}px">${nm(g)}<div class="tr" style="width:${W}px">${grid}${rows.map((row,k)=>row.map(o=>evBar(o.e,8+k*38)).join("")).join("")}${rr.html}</div></div>`}).join("");
  }else{
    // Ending soonest: one queue; pinned routines take their place by when they reset.
    const items=[...evs.map(e=>({t:e.end??9e15,e})),...(S.tlStrip?[]:gs.flatMap(g=>S.servers[g].flatMap(srv=>routinesFor(g,srv).map(i=>({t:reset(i),i})))))].sort((a,b)=>a.t-b.t);
    body=items.map(it=>it.e?`<div class="lane" style="${gv(it.e.game)};height:40px">${nm(it.e.game)}<div class="tr" style="width:${W}px">${grid}${evBar(it.e,5,false)}</div></div>`
      :`<div class="lane" style="${gv(it.i.r.game)};height:30px">${nm(it.i.r.game,it.i.srv)}<div class="tr" style="width:${W}px">${grid}${drawRoutineOnTimeline(it.i,x,5,w0,w1)}</div></div>`).join("");
  }
  const nowX=NAME+x(NOW);const c=counts();
  const cnt=g=>liveEvents().filter(e=>g==="all"||e.game===g).length;
  return `${whatsNew()}<div class="rt-top"><h1>Timeline</h1><div class="sum">Events as bars. <b>${c.t}</b> pinned routines as slim pills spanning the period they're in, filled as you go, ending at their reset. <button class="btn link" data-tab="routines" style="padding:0">Change pins</button></div></div>
    <div class="tl-ctl"><div class="seg"><button data-tlmode="soonest" aria-pressed="${S.tlMode==="soonest"}">Ending soonest</button><button data-tlmode="bygame" aria-pressed="${S.tlMode==="bygame"}">By game</button></div><label class="chk"><input type="checkbox" data-pref="tlStrip" ${S.tlStrip?"checked":""}>Resets in their own strip</label></div>
    ${focusRow(cnt)}<div class="tlwrap"><div class="board" style="width:${NAME+W}px">${axis}${strip}${body}<div class="now" style="left:${nowX}px"></div><div class="nowchip" style="left:${nowX}px">NOW</div></div></div>
    <div class="tl-legend"><span><i style="width:26px;height:12px;border-radius:2px;border-left:3px solid var(--muted);background:color-mix(in srgb,var(--muted) 25%,transparent)"></i>Event</span><span><i style="width:30px;height:12px;border-radius:6px;border:1px solid var(--muted);background:linear-gradient(90deg,color-mix(in srgb,var(--muted) 35%,transparent) 55%,transparent 55%)"></i>Routine: its current period, filled to your progress</span><span><i style="width:2px;height:14px;background:var(--muted)"></i>Its reset</span><span><i style="width:24px;height:12px;border-radius:6px;border:1px dashed var(--muted)"></i>The next period</span></div>`;
}

function archiveWhy(){const common=`<h3>Archive: what every variant keeps</h3><p>Archiving copies a snapshot into the save at that moment, so the feed can drop or rewrite the event and the archive still opens:</p><pre>archive: { [eventId]: {
  status: done | ignored | expired,
  at,                       // when it was archived
  snapshot: { title, desc, start, end, version,
              sourceUrl, capturedAt },
  progress: { measure: days|stages|amount,
              got, need, unit, days: [dayKey] } } }</pre><p>Nothing is ever deleted: archived ids are filtered out of the Checklist and Timeline, and Restore only removes the archive entry (the event returns to the lists if it is still running). "Ran out" is archived by the clock, not by the reader. The detail always says when its copy was taken and flags when the live page no longer lists the event.</p><p>Derivable later from the same records, with no new storage: completion rate per month, game or version; best and current run of finished events; check-ins per day (the season heatmap); near misses (short by one day or stage); events ignored before starting vs. after trying.</p>`;
  const v={1:`<h3>Variant 1 · Ledger with a story</h3><p>The month-grouped ledger stays, but every row says what you got out of it ("6/7 days", "short by 50 points", "missed by 1 day") with its own glyph: solid hue check, struck and receded for ignored, a red edge and tint for ran out. A slim header carries four figures and a per-game stacked bar that doubles as a filter.</p><p><b>Trade-offs:</b> the most familiar and the cheapest to build; stats are a header, so they never become a reason to visit. A month with many events is still a long list.</p>`,
   2:`<h3>Variant 2 · By game and version</h3><p>The archive is read the way players think about a game: per game, then per version. Each version block has a completion meter (one tick per event) and compact rows. The detail is a full page with a strip placing the event inside its version and your check-in days as pips.</p><p><b>Trade-offs:</b> needs a version table per game (a new, hand-kept or scraped fact; dates here are mockup). Cross-game questions ("what did I miss this week?") are harder. The full page is the roomiest place for future per-event stats.</p>`,
   3:`<h3>Variant 3 · History view</h3><p>A past-only timeline of the season: each game a lane, each archived event a bar coloured by status (filled for completed, hatched with a red edge for ran out, outlined for ignored), plus a check-in density strip along the bottom. The list underneath is synced: hovering a bar lights its row and back. Detail opens in a side panel so the board stays in view.</p><p><b>Trade-offs:</b> the most "seeing your season" and closest to the Timeline the reader already knows; weakest on a phone, where bars lose their labels. Stats are implicit in the picture rather than stated.</p>`}[S.arcV];
  return common+v}
function oldWhyPanel(){return `<aside class="why"><button class="x" data-act="why">Close</button><h2>Round 3 · Converged</h2>
<p>Routines are managed in one place, the Routines tab, and pinned per routine to the Checklist and/or the Timeline. Each game has a settings page for <i>what kinds</i> to track and <i>which servers</i> it's played on. A game on two servers is two sets of dailies and routines.</p>
<h3>The foundation</h3>
<pre>prefs = {
  games: LaneId[]                      // followed, in order
  servers: { [game]: Region[] }        // [0] = main server
  region: Region                       // default for new games
  defaultView: "checklist"|"timeline"
  hideEvents: LaneId[]                 // "Events" off on a game
  routines: {
    [instanceKey]: { pins: { checklist, timeline } }
  }                                    // key present = followed
  changelogSeen: "2026-10-16"
  ...theme, lists, tlStrip
}
instanceKey = routineId               // on the main server
            | routineId + "@" + region // on any other server
archive: { [eventId]: {
  status: done|ignored|expired, at,
  snapshot: { title, desc, start, end,
              sourceUrl, progress } } }</pre>
<div class="flag"><b>Schema-guardian territory.</b> Tick keys must not move. Today's <code>dailies:&lt;game&gt;</code> and every <code>routine:</code>/<code>mytask:</code> tick key keep meaning "the main server", so no existing reader's ticks move. Only an <i>added</i> server gets a suffixed key (<code>dailies:genshin@asia</code>, <code>routine:genshin:weekly-bosses@asia</code>). Day keys for that instance are cut on its own server's clock (pass the region, not just the game, to <code>dayKey</code>). Changing the main server re-labels nothing, it only changes which clock the bare key is read on, and that has to be said in the UI.</div>
<p>Every view is a query over one list of instances: the Routines tab reads all of them, the Checklist rail reads <code>pins.checklist</code>, the board reads <code>pins.timeline</code>, filtered by games and the focus. This retires <code>showChores</code>, <code>choresOn/Off</code>, <code>showRoutines</code>, <code>routineGames</code>, <code>routinesOff</code>, <code>routinesAsked</code>, <code>routinesHidden</code> and <code>showWeekly/Monthly/CycleTasks</code>, and folds <code>hiddenGames</code>/<code>knownGames</code> into <code>games</code>.</p>
<h3>Composition, not levels</h3>
<p>Events · Dailies · Weeklies &amp; monthlies · Cycles on a game's page are four independent switches. The three routine ones are shortcuts that follow or unfollow that kind's built-ins (on every server); nothing about them is stored. A partly-followed kind shows "some" and a dashed edge. "Events" is the one stored switch, because it's the only one that isn't a routine.</p>
${archiveWhy()}
<h3>Onboarding order</h3>
<p>Games → what to track (composition) → default view. Where routines show is asked on the reader's first visit to Routines, after they've seen both views.</p>
<h3>Trade-offs</h3>
<ul><li>Two servers doubles the rows. The rail and board name the server only for games that have more than one.</li>
<li>The archive grows forever. Snapshots are small, but export files grow with them.</li>
<li>Follow vs pin is still two ideas. The first-visit hint on Routines carries it.</li></ul></aside>`}

  else if(d.bulkpin){const[kind,valx,p,v]=d.bulkpin.split("|").flatMap((s,ix)=>ix===0?s.split(":"):[s]);const rs=insts().filter(i=>kind==="g"?i.r.game===valx:i.r.period.unit===valx);rs.forEach(i=>setPin(i.key,p,v==="1"));toast(`${v==="1"?"Pinned":"Unpinned"} ${rs.length} ${v==="1"?"to":"from"} the ${p==="c"?"checklist":"timeline"}`)}

  else if(d.restore){const a=S.archive.find(x=>x.id===d.restore);S.archive=S.archive.filter(x=>x!==a);if(a.ref)S.archived.delete(a.ref);else if(Date.parse(a.end+"T03:00:00Z")>NOW&&!EVENTS.some(e=>e.id===a.id)){EVENTS.push({id:a.id,game:a.game,title:a.title,desc:a.desc,start:Date.parse(a.start+"T03:00:00Z"),end:Date.parse(a.end+"T03:00:00Z"),src:a.src});a.ref=a.id}S.arcSheet=null;toast(`Restored ${esc(a.title)}${a.ref?" to the lists":""}`)}
  else if(d.arcst)S.arcStatus=d.arcst;

function renderGamePage(g){const original=originalGamePage(g);if(!S.games.includes(g))return original;
const start=original.indexOf('<div class="grp">');const end=original.indexOf('<div class="grp"><h3>About this game');const setup=original.slice(start,end);
return `<div style="${gv(g)}"><div class="ptitle"><h2>${G[g].name}</h2><span class="studio">${G[g].studio}</span><button class="btn sm" data-followgame="${g}">Stop following game</button></div><div class="subtabs" aria-label="Game settings sections">${[['setup','Setup'],['codes','Codes'],['about','About']].map(([k,l])=>`<button data-gptab="${k}" aria-current="${S.gpTab===k?'page':'false'}">${l}${k==='codes'&&codeNew(g)?` <span class="new-code">${codeNew(g)} new</span>`:''}</button>`).join('')}</div>${S.gpTab==='setup'?setup+serverSetupPanel(g):S.gpTab==='codes'?codesPage(g):aboutPage(g)}</div>`}
function codesPage(g){const list=CODE_DEMO.filter(c=>c.game===g);return `<h3>Redeem codes</h3><p class="muted-copy">“New” means added since you last looked. Redemption is recorded separately for each server.</p><p class="source-note">Illustrative codes for this prototype; these cannot be redeemed.${g==='genshin'?' Source shape: <a href="https://game8.co/games/Genshin-Impact/archives/304759" target="_blank" rel="noopener">Game8’s Genshin codes page</a>.':''}</p>${list.map(c=>`<section class="code-item"><div class="code-title"><code>${c.code}</code><span class="tag">${S.codeSeen.includes(c.code)?'Seen':'New since last look'}</span></div><p>${c.reward}</p><p class="source-note">Added ${c.added} · Expiry not stated</p><div class="code-actions"><button class="btn sm" data-copycode="${c.code}">Copy code</button>${S.servers[g].map(s=>`<button class="btn sm" data-redeemcode="${c.code}|${s}" aria-pressed="${S.redeemed.includes(c.code+'@'+s)}">${SV[s].name}: ${S.redeemed.includes(c.code+'@'+s)?'Redeemed':'Mark redeemed'}</button>`).join('')}</div></section>`).join('')||'<p class="empty-band">No sample codes for this game. Codes will appear here when a supported source publishes them.</p>'}`}
function aboutPage(g){return `<h3>About ${G[g].name}</h3><div class="grp"><div class="trow"><span>Studio</span><b>${G[g].studio}</b></div><div class="trow"><span>Daily chores</span><span>${esc(G[g].chores)}</span></div>${S.servers[g].map(s=>`<div class="trow"><span>${SV[s].name} reset</span><span>04:00 server time · next in ${dur(nextDaily(s)-NOW)}</span></div>`).join('')}</div><p class="source-note">Reset clocks are simplified in this prototype. Version and maintenance dates will appear only when a source states them.</p>`}
function serverSetupPanel(g){const f=S.serverSetup;if(!f||f.g!==g)return '';return `<section class="server-setup"><h3>Set up ${G[g].short} · ${SV[f.s].name}</h3><p class="muted-copy">Events only to start. Choose routines for this server; follows and progress from your other servers stay separate.</p>${typeGuide()}<div class="server-choices">${COMP.filter(([k])=>k!=='events').map(([k,l])=>`<button data-serverkind="${k}" aria-pressed="${f.kinds.includes(k)}">${l}</button>`).join('')}</div><div class="acts"><button class="btn solid" data-serverdone="1">Add ${SV[f.s].name} server</button><button class="btn" data-servercancel="1">Cancel</button></div></section>`}
function renderArchive(){const list=arcList(),t=tally(list);const story=`<section class="story" aria-label="Your archive story"><div><h2>Your time across these games</h2><p>${t.done?`You completed ${t.done} event${t.done===1?'':'s'}. `:''}${t.ignored} set aside, ${t.expired} ended unfinished. Your progress, descriptions and source links stay here, even when a source moves on.</p></div><dl><div><dd>${t.done}</dd><dt>Completed</dt></div><div><dd>${t.ignored}</dd><dt>Ignored</dt></div><div><dd>${t.expired}</dd><dt>Unfinished</dt></div></dl></section>`;
const controls=`<div class="archive-view"><div class="seg" aria-label="Archive view"><button data-arcv="2" aria-pressed="${S.arcV===2}">By game</button><button data-arcv="3" aria-pressed="${S.arcV===3}">History timeline</button></div><span class="source-note">Sample history · progress is saved in this demo</span></div>`;
return `${controls}${S.arcSheet&&S.arcV===2?'':story}${S.arcV===3?arcV3():arcV2()}`}
function arcFacts(a){const running=a.end===null||Date.parse(a.end+'T03:00:00Z')>NOW;return `<p class="desc">${esc(a.desc)||'No description was supplied.'}</p><dl class="dl2"><dt>Dates</dt><dd>${dayStr(a.start)} – ${a.end?dayStr(a.end):'End not announced'}</dd><dt>Status</dt><dd>${ST_LABEL[a.status]}</dd><dt>Progress</dt><dd>${esc(a.progress||achieved(a).line||'No additional progress recorded')}</dd><dt>Archived</dt><dd>${dayStr(a.at)}</dd></dl><div class="saved">${a.src?`Source: <a href="${esc(a.src)}" target="_blank" rel="noopener">${esc(a.src)}</a>`:'Reader-authored or illustrative event; no verified source link.'}<br>Saved description from ${dayStr(a.at)}. The live source may have changed.</div><div class="acts"><button class="btn solid" data-restore="${a.id}">${running?'Restore to active views':'Restore record'}</button><button class="btn" data-act="closesheet">Close</button></div>${running?'':'<p class="source-note">Its deadline has passed, so restoring the record does not make it a live event.</p>'}`}
function arcV2Page(a){return `<article class="v2-page" style="${gv(a.game)}"><button class="btn link v2-back" data-act="closesheet">${ICON.left} Back to ${G[a.game].short} archive</button><h1 class="v2-title">${esc(a.title)}</h1><p class="v2-big ach ${a.status}">${ST_LABEL[a.status]}</p>${progViz(a,true)}${arcFacts(a)}</article>`}
function renderArchiveDetail(id){const a=S.archive.find(a=>a.id===id);if(!a||S.arcV===2)return '';return `<div class="scrim" data-act="closesheet"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(a.title)}" style="${gv(a.game)}"><h2>${esc(a.title)}</h2>${progViz(a,true)}${arcFacts(a)}</section>`}
function timelineScreen(){const evs=liveEvents().filter(e=>S.focus==='all'||e.game===S.focus),gs=S.games.filter(g=>S.focus==='all'||g===S.focus);const name=innerWidth<700?170:250,W=1680,start=Date.parse('2026-10-14T00:00:00Z'),end=start+28*DAY,x=t=>Math.max(0,Math.min(W,(t-start)/(end-start)*W));
const routines=insts().filter(i=>gs.includes(i.r.game)&&pinned(i.key,'t'));const allItems=[...evs.map(e=>({e,g:e.game,t:e.end??9e15})),...routines.map(i=>({i,g:i.r.game,t:reset(i)}))];
const row=it=>{const e=it.e,i=it.i,g=it.g,p=i?periodOf(i.r,i.srv):{start:e.start,end:e.end??end},title=e?e.title:i.r.title,when=e?(e.end?'Ends in '+dur(e.end-NOW):'End not announced'):'Resets in '+dur(p.end-NOW),attr=e?`data-ev="${e.id}"`:`data-rt="${i.key}"`,left=x(p.start),width=Math.max(18,x(p.end)-left);return `<div class="timeline-entry" style="${gv(g)}"><button class="timeline-name" ${attr}>${esc(title)}<small>${e?G[g].short:laneName(g,i.srv)+' · '+progText(i)}</small></button><div class="time-track"><button class="period-block ${i?'routine':''}" ${attr} style="left:${left}px;width:${width}px" aria-label="${esc(title)} · ${esc(when)}" title="${esc(when)}">${i?`<i class="fill" style="width:${Math.min(100,val(i)/req(i.r)*100)}%"></i>`:''}<span>${i?'Reset':'Ends'} · ${e&&!e.end?'Unknown':dayStr(new Date(p.end).toISOString().slice(0,10))}</span></button>${i?`<i class="reset-mark" style="left:${x(p.end)}px"></i>`:''}</div></div>`};
const separator=(g,txt)=>`<div class="game-separator" style="${gv(g)}"><strong>${G[g].name}</strong><span>${txt}</span></div>`;
let body='';if(S.tlStrip||S.tlMode==='bygame'){const ordered=[...gs].sort((a,b)=>S.tlMode==='soonest'?Math.min(...allItems.filter(it=>it.g===a).map(it=>it.t))-Math.min(...allItems.filter(it=>it.g===b).map(it=>it.t)):0);body=ordered.map(g=>{const its=allItems.filter(it=>it.g===g).sort((a,b)=>a.t-b.t);if(!its.length)return '';const events=its.filter(it=>it.e),rs=its.filter(it=>it.i);return separator(g,S.tlStrip?'Events and their adjacent reset strip':'Events & routines')+(S.tlStrip?events.map(row).join('')+(rs.length?`<section class="reset-strip" aria-label="${G[g].short} resets">${separator(g,'Resets · '+rs.length+' routines')}${rs.map(row).join('')}</section>`:''):its.map(row).join(''))}).join('')}else body=allItems.sort((a,b)=>a.t-b.t).map(row).join('');
return `${whatsNew()}<div class="rt-top"><h1>Timeline</h1><div class="sum">One row per event or routine. Your pins decide which routines appear.</div></div><div class="tl-ctl"><div class="seg"><button data-tlmode="soonest" aria-pressed="${S.tlMode==='soonest'}">Ending soonest</button><button data-tlmode="bygame" aria-pressed="${S.tlMode==='bygame'}">By game</button></div><label class="chk"><input type="checkbox" data-pref="tlStrip" ${S.tlStrip?'checked':''}>Separate reset strips</label></div>${S.tlStrip&&S.tlMode==='soonest'?'<p class="timeline-help">Games are ordered by their next deadline, with each reset strip kept beside that game’s events.</p>':''}${focusRow(g=>evs.filter(e=>g==='all'||e.game===g).length)}<div class="timeline-scroller"><div class="timeline-board" style="width:${name+W}px"><div class="time-axis"><strong>Game / activity</strong><div class="ticks">${Array.from({length:28},(_,j)=>`<span style="left:${j*60+8}px">${dayStr(new Date(start+j*DAY).toISOString().slice(0,10))}</span>`).join('')}</div></div>${body||'<p class="empty-band">No events or pinned routines for this selection.</p>'}<div class="today-line" style="left:${name+x(NOW)}px"></div></div></div><p class="timeline-help">Solid bars: events. Dashed bars: routine periods, filled by progress. Scroll horizontally for later dates. Clocks are fixed for this review.</p>`}
function eventSheet(){const e=[...EVENTS,...S.ownEvents].find(e=>e.id===S.sheet);if(!e)return '';return `<div class="scrim" data-act="closesheet"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(e.title)}" style="${gv(e.game)}"><p style="color:var(--g)">${G[e.game].name}</p><h2>${esc(e.title)}</h2><p class="muted-copy">${esc(e.desc)||'The source gave no description.'}</p><p>${e.end?'Ends '+dateStr(e.end):'End date not announced'}</p>${e.src?`<p class="source-note"><a href="${esc(e.src)}" target="_blank" rel="noopener">View source page</a></p>`:''}<div class="acts"><button class="btn solid" data-evst="${e.id}|done">Mark done</button><button class="btn" data-evst="${e.id}|ignored">Ignore</button><button class="btn" data-doing="${e.id}">${S.eventProgress[e.id]==='doing'?'Clear in progress':'Doing it'}</button><button class="btn link" data-act="closesheet">Close</button></div><p class="source-note">Done and Ignore save its details to Archive. You’ll see a brief confirmation before the row leaves.</p></section>`}
function whyPanel(){return `<aside class="why"><button class="btn" data-act="why">Close</button><h2>Round 4 review</h2><p>Compare Standard and Compact using the same busy event list. Focus a game to expand its pinned routines.</p><p>Try completing or ignoring an event: its row confirms the move for 1.5 seconds, then fades. Undo stays available for 8 seconds. Archive keeps its description and source.</p><p>Try Settings → Genshin → add a server. Its routine choices start empty. Codes distinguish seen from redeemed per server. “Simulate new code” exercises arrival notices in Checklist and Timeline.</p><p>New user walks through events-only setup with type explanations. Returning user shows the introduction in whichever view is set as default.</p><p>This standalone prototype uses isolated browser storage. Event content comes from the earlier mockups; codes, archive history and some descriptions are illustrative. Reset clocks and “now” are fixed. Backup and some own-event editors remain placeholders.</p></aside>`}
function render(){const pos=document.querySelector('.timeline-scroller')?.scrollLeft||0;baseRender();const scroller=document.querySelector('.timeline-scroller');if(scroller)scroller.scrollLeft=pos;
for(const [id,p] of Object.entries(S.pending)){document.querySelectorAll(`[data-ev="${id}"]`).forEach(el=>{if(el.closest('.sheet'))return;el.classList.add('archiving');if(p.phase==='fading')el.classList.add('fading');const target=el.querySelector('.event-title,.tcell')||el;target.insertAdjacentHTML('beforeend',`<span class="archive-confirm" role="status">${p.status==='done'?'Completed':'Ignored'} · Moved to Archive</span>`)})}
if(S.undo.length)document.getElementById('overlay').insertAdjacentHTML('beforeend',`<div class="toast undo-note" role="status"><span>${S.undo.length===1?(S.archive.find(a=>a.id===S.undo[0].aid)?.status==='done'?'Completed':'Ignored')+' · Moved to Archive':S.undo.length+' events moved to Archive'}</span><button data-undo="1">Undo</button></div>`)
document.querySelectorAll('.srow[data-sel]').forEach(el=>{const n=codeNew(el.dataset.sel);if(n)el.querySelector('.nm')?.insertAdjacentHTML('beforeend',` <span class="new-code">${n} new code${n===1?'':'s'}</span>`)});
persistDemo()}
function openCodes(g){S.tab='settings';S.sel=g;S.gpTab='codes';CODE_DEMO.filter(c=>c.game===g).forEach(c=>{if(!S.codeSeen.includes(c.code))S.codeSeen.push(c.code)});S.sheet=null;S.arcSheet=null}
function archiveEvent(id,status){if(S.archived.has(id))return;const e=[...EVENTS,...S.ownEvents].find(e=>e.id===id);if(!e)return;const aid='saved:'+id;S.archived.add(id);S.archive.unshift({id:aid,ref:id,game:e.game,title:e.title,status,start:new Date(e.start).toISOString().slice(0,10),end:e.end?new Date(e.end).toISOString().slice(0,10):null,at:'2026-10-16',desc:e.desc,ver:'Saved events',progress:status==='done'?'Marked completed on 16 Oct':'Ignored on 16 Oct',src:e.src||null});S.sheet=null;S.pending[id]={status,phase:'confirm'};S.undo.push({id,aid,previous:S.eventProgress[id]});S.toast=null;clearTimeout(toastT);clearTimeout(undoTimer);undoTimer=setTimeout(()=>{S.undo=[];render()},8000);pendingTimers.set(id,setTimeout(()=>{if(!S.pending[id])return;S.pending[id].phase='fading';document.querySelectorAll(`[data-ev="${id}"]`).forEach(el=>el.classList.add('fading'));pendingTimers.set(id,setTimeout(()=>{delete S.pending[id];pendingTimers.delete(id);render()},matchMedia('(prefers-reduced-motion: reduce)').matches?0:350))},1500))}
// Capture only Round 4 interactions; inherited library/forms continue to work.
document.addEventListener('click',ev=>{const el=ev.target.closest('button');if(!el)return;const d=el.dataset;let handled=true;
if(d.density)S.density=d.density;
else if(d.sort)S.sort=d.sort;
else if(d.codes)openCodes(d.codes);
else if(d.gptab){S.gpTab=d.gptab;if(d.gptab==='codes')openCodes(S.sel)}
else if(d.copycode){navigator.clipboard?.writeText(d.copycode).then(()=>toast('Code copied'),()=>toast('Select the code text to copy it.'));if(!navigator.clipboard)toast('Select the code text to copy it.')}
else if(d.redeemcode){const [code,srv]=d.redeemcode.split('|'),k=code+'@'+srv;S.redeemed=S.redeemed.includes(k)?S.redeemed.filter(x=>x!==k):[...S.redeemed,k]}
else if(d.demo==='arrival'){const c=CODE_DEMO.find(c=>c.game==='genshin');c.isNew=true;S.codeSeen=S.codeSeen.filter(x=>x!==c.code);S.tab='checklist';toast('Demo: a new Genshin code arrived. Redemption marks are unchanged.')}
else if(d.intro){S.tab=d.intro;S.wnSeen=true}
else if(d.evst){const [id,st]=d.evst.split('|');archiveEvent(id,st)}
else if(d.doing){S.eventProgress[d.doing]=S.eventProgress[d.doing]==='doing'?'untouched':'doing';S.sheet=null}
else if(d.undo){for(const u of S.undo){clearTimeout(pendingTimers.get(u.id));pendingTimers.delete(u.id);S.archived.delete(u.id);delete S.pending[u.id];S.archive=S.archive.filter(a=>a.id!==u.aid);S.eventProgress[u.id]=u.previous}S.undo=[];toast('Restored to your active events.')}
else if(d.restore){const a=S.archive.find(a=>a.id===d.restore);if(a){if(a.ref){clearTimeout(pendingTimers.get(a.ref));delete S.pending[a.ref];S.archived.delete(a.ref);S.undo=S.undo.filter(u=>u.id!==a.ref)}else if(a.end===null||Date.parse(a.end+'T03:00:00Z')>NOW){if(!S.ownEvents.some(e=>e.id===a.id))S.ownEvents.push({id:a.id,game:a.game,title:a.title,desc:a.desc,start:Date.parse(a.start+'T03:00:00Z'),end:a.end?Date.parse(a.end+'T03:00:00Z'):null,src:a.src})}S.restoredRecords??=[];S.restoredRecords.push({...a,status:'untouched'});S.archive=S.archive.filter(x=>x!==a);S.arcSheet=null;toast('Restored. Its saved details and progress are retained.')}}
else if(d.srvadd){const [g,s]=d.srvadd.split('|');S.serverSetup={g,s,kinds:[]};S.addSrv=false}
else if(d.serverkind){const f=S.serverSetup;f.kinds=f.kinds.includes(d.serverkind)?f.kinds.filter(k=>k!==d.serverkind):[...f.kinds,d.serverkind]}
else if(d.serverdone){const f=S.serverSetup;if(!S.servers[f.g].includes(f.s))S.servers[f.g].push(f.s);for(const kind of f.kinds)for(const r of builtinsOf(f.g,kind))follow(keyOf(r.id,f.s,f.g),true,{c:false,t:false});S.serverSetup=null;toast('Server added. Fine-tune and pin its routines in Routines.')}
else if(d.servercancel)S.serverSetup=null;
else if(d.act==='reset'){for(const t of pendingTimers.values())clearTimeout(t);pendingTimers.clear();clearTimeout(toastT);clearTimeout(undoTimer);S={...fresh(),...round4Defaults(),tab:'checklist'};lastJump='checklist'}
else if(d.jump==='gamepage'){jump('gamepage');S.gpTab='setup'}
else if(d.sel){S.sel=d.sel;S.gpTab='setup';S.addSrv=false;S.serverSetup=null}
else handled=false;
if(handled){ev.preventDefault();ev.stopImmediatePropagation();render()}
},true);
document.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('tr[data-ev]')){ev.preventDefault();S.sheet=ev.target.dataset.ev;render()}},true);

function reviewFooter(){return `<footer class="foot"><span>Review prototype · fixed clocks, sample codes and archive history.</span><button data-act="clog">Changelog</button><button data-act="why">Review notes</button></footer>`}

render();
</script>
</body>
</html>
